ot to help me. Are you ready for a second attempt at finding the elusive pirates? Let's try to be more careful.\"''\n\n* '''Contact:''' Cms Pearson at [https://galaxy-genome.github.io/map/?system=Wolf%20359 Manson Orbital] (Wolf 359)\n* '''Needs first:''' [[Side quests#Live bait|Live bait]]\n* '''Reward:''' 400,000 CR\n* '''Leads to:''' [[Side quests#Program crash|Program crash]]\n\n'''Walkthrough'''\n# Cms Pearson offered to patrol nearby systems. Our goal is to find signal sources, check them and prevent pirate attacks.\n# We have detected a pirate attack on a peaceful civilian ship. It is worth intervening and destroying the pirate.\n# We need to install a mining laser on the ship and mine for some time in the asteroid field. Maybe it will attract pirates.\n# We were attacked by a pirate while mining. He needs to be destroyed.\n# You need to return to the *Manson Orbital* station in the *Wolf 359* system. \u2014 ''dock at Manson Orbital''\n# We need to return to the *Manson Orbital* station in the *Wolf 359* system\n\n=== Program crash ===\n''\"It's good to have you here! Eva has not been at the station for a long time, she does not get in touch. I'm afraid something happened. You must help me, please!\"''\n\n* '''Contact:''' Cms Pearson at [https://galaxy-genome.github.io/map/?system=Wolf%20359 Manson Orbital] (Wolf 359)\n* '''Needs first:''' [[Side quests#The hunt continues|The hunt continues]]\n* '''Reward:''' 350,000 CR\n* '''Leads to:''' [[Side quests#Secret lair|Secret lair]]\n\n'''Walkthrough'''\n# You need to visit the station *Mark-01 Outpost* in the system *LP 104-2* \u2014 ''arrive in LP 104-2''\n# We arrived at the LP 104-2 system and discovered a drone attack on a peaceful trader. We should help and destroy the drone. \u2014 ''Drone-427 destroyed''\n# You need to visit the station *Mark-01 Outpost* in the system *LP 104-2* \u2014 ''dock at Mark-01 Outpost''\n# We need to find Eva. According to the information received from Dr. Anger, she should be looked for in the system *LP 658-2* or systems adjacent to it. \u2014 ''arrive in V1201 Orionis''\n# We need to stay where we are while the commissioner completes the system scan.\n# The Commissioner has detected the presence of an Eva ship in the system. The signal comes from the side of the planet A5. Need to check.\n# We found Eva, but it looks like she was attacked. It is necessary to help Eva fight the enemy.\n# We helped Eva. Now you need to figure out what to do next.\n# The conversation with Eva did not end well. You need to deliver the commissioner to the *Manson Orbital* station in the *Wolf 359* system. \u2014 ''dock at Manson Orbital''\n# I delivered the commissioner to the station. It's time to say goodbye.\n\n=== Secret lair ===\n''\"Ah, is that you? Well, take a seat. Did you just come to visit me or for business? We have unfinished business, but I just can't get started, like I'm an android with a broken behavior program. Okay, stop whining. Shall we get to work?\"''\n\n* '''Contact:''' Cms Pearson at [https://galaxy-genome.github.io/map/?system=Wolf%20359 Manson Orbital] (Wolf 359)\n* '''Needs first:''' [[Side quests#Program crash|Program crash]]\n* '''Reward:''' 130 CR (the file names no reward, so the game works one out)\n\n'''Walkthrough'''\n# Cms Pearson talks about the current state of the Elusive Pirates case. It looks like their lair is known and it remains only to attack them. We need to fly to the system *Altair* to the station *Huton Orbital* \u2014 ''arrive in Altair''\n# We must arrive at the *Huton Orbital* station in the *Altair* system \u2014 ''dock at Huton Orbital''\n# We must jump into the system * PY Vulpeculae * \u2014 ''arrive in PY Vulpeculae''\n# We need to move to the * PY Vulpeculae * system \u2014 ''arrive in PY Vulpeculae''\n# We need to wait for reinforcements in the system * PY Vulpeculae *\n# The pirates showed up before our support ships.\n# Eva was on our side and destroyed the largest pirate ship.\n# You need to choose a side. Help Eva, or change to the side of the Federation.\n# We must destroy all enemies in the system * PY Vulpeculae *\n# I chose the side of Eva and we managed to win the battle. Now you need to return to the station * Manson Orbital * in the system * Wolf 359 * \u2014 ''arrive in Wolf 359; dock at Manson Orbital''\n# We arrived at the *Manson Orbital* station, but they were already waiting for us there. Guardians of the system are trying to detain us.\n# We have flown from a dangerous system, but what do we do next? Eva offered to settle in the * HIP 17892 * system \u2014 ''arrive in HIP 17892''\n# We have reached the * HIP 17892 * system. Now we need to get to planet *A3*. \u2014 ''select the planet A3''\n# I brought Eve and the commissar to a remote system in the Pleiades Nebula. There they can hide for a while from the bounty hunters.\n# We must destroy all enemies in the system * PY Vulpeculae *\n# I chose the side of the Federation and killed the commissar and Eva. Now you need to move to the * Wolf 359 * system and deal with everyone who remained loyal to the commissar. \u2014 ''arrive in Wolf 359''\n# I must destroy all traitors to the Federation. I need to get to the station * Manson Orbital * in the system * Wolf 359 * \u2014 ''dock at Manson Orbital''\n# I flew to the *Manson Orbital* station. I'll have to deal with the traitors to the Federation.\n# I was able to defeat the commissar's predecessors. It is done.\n# ...\n\n=== Engineering survey ===\n''\"I wanted to introduce you to one person. She's my assistant. She needs help in one... unusual matter, and I think that you, like no one else, can cope with this.\"''\n\n* '''Contact:''' Dr. Landau at [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] (93 Ceti)\n* '''Needs first:''' [[Side quests#Shoulder to shoulder|Shoulder to shoulder]]\n* '''[[Reputation and ranks|Reputation]]:''' at least 450 with [[Factions#Independent|Independent]]\n* '''Reward:''' 90 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' [[Side quests#Trade tycoon|Trade tycoon]]\n\n'''Walkthrough'''\n# We need to find a good engineer. Worth a visit *GIF Orbital* station in the *Stein 2051* system\n# We need to find a good engineer. Worth a visit to the *GIF Orbital* station in the *Stein 2051* system \u2014 ''dock at GIF Orbital''\n# We need to get into the *LP 157-32* system. One of the unfinished warp gates is located there. \u2014 ''arrive in LP 157-32''\n# We have arrived in the *LP 157-32* system. We need to fly closer to the warp gate. \u2014 ''dock at LP 157-32''\n# While the gate is being restored, we need to visit the Frost Base station in the LHS 253 system \u2014 ''dock at Frost Base''\n# We need to pick up cargo from planet * Scion B * in the * LHS 253 * system \u2014 ''select the planet Scion B''\n# The cargo was stolen. We need to destroy the enemy and begin pursuit.\n# We were able to trace the warp trail. It's worth moving to LTT 3572 system as soon as possible \u2014 ''arrive in LTT 3572''\n# It seems that the stone has attracted the Anglers, but there is no choice, we will have to fight. \u2014 ''Pirate John destroyed''\n# We returned the stone, although it was not easy. Now it\u2019s worth returning to LP 157-32 system. \u2014 ''dock at LP 157-32''\n# It is necessary to place the stone in the warp gate.\n# It is necessary to return Victor to *Frost Base* station in LHS 253 system\n# It is necessary to return Victor to the Frost Base station in LHS 253 system \u2014 ''dock at Frost Base''\n# Saying goodbye to Victor\n\n=== Trade tycoon ===\n''\"Are you here just like that or is there some business? Your own station, you say? Trade routes? Not everything is as simple as it seems...\"''\n\n* '''Contact:''' Victor at [https://galaxy-genome.github.io/map/?system=LHS%20253 Frost Base] (LHS 253)\n* '''Needs first:''' [[Side quests#Engineering survey|Engineering survey]]\n* '''Your station:''' offered only once [[Your space station|your own station]] is repaired\n* '''Reward:''' 20 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' reaching its first checkpoint unlocks the Trade Port on [[Your space station#Subsystems|your own station]]\n\n'''Walkthrough'''\n# You need to get a mining ship and arrive in the Barnard's Star system \u2014 ''arrive in Barnard's Star''\n# It is necessary to go to the asteroid belt in the Barnard's Star system\n# It is necessary to place charges on the surface of the asteroid and wait for the charges to be successfully detonated.\n# Place charges on the surface of the asteroid and wait for a successful detonation. \u2014 ''detonate a seismic charge successfully''\n# Victor agreed to start trading at my station. I need to get him there. \u2014 ''dock at your own station''\n# It is necessary to upgrade the trade port at your own station \u2014 ''upgrade your Trade Port''\n# We launch trading at the station\n\n=== Korben, baby ===\n''\"Korben? No, but maybe it\u2019s good that you\u2019re not him... I see in your eyes that you want to ask me *what the hell are you doing here?*. I know you immediately realized that I am Ruby, who is the main star of the most luxurious bar in the entire galaxy. No, you haven't heard of me?! How quickly people forget...\"''\n\n* '''Contact:''' Ruby at [https://galaxy-genome.github.io/map/?system=71%20Orionis Nova Citadel] (71 Orionis)\n* '''Your station:''' offered only once [[Your space station|your own station]] is repaired\n* '''Reward:''' 150 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' reaching its first checkpoint unlocks the Bar on [[Your space station#Subsystems|your own station]]\n\n'''Walkthrough'''\n# Ruby agreed to help, but first we have to jump into the Alpha Centauri system \u2014 ''arrive in Alpha Centauri''\n# Ruby agreed to help, but first we must visit Lem Hub station in the Alpha Centauri system \u2014 ''dock at Lem Hub''\n# Ruby entered the Lem Hub station. You need to wait for him.\n# Ruby kidnapped the android from the station. You need to hide in another system.\n# We successfully broke away from the pursuit. Now you should return to your station. \u2014 ''dock at your own station''\n# We arrived at the station with Ruby. He was not very impressed and demands that the bar be renovated. \u2014 ''upgrade your Bar''\n\n=== Don't ask questions ===\n''\"You're new here, aren't you? I suppose you're looking for a good job? I have a task I can assign you. Interested?\"''\n\n* '''Contact:''' Saimon at [https://galaxy-genome.github.io/map/?system=LPM%20616 Ferbean Station] (LPM 616)\n* '''[[Combat#Karma|Karma]]:''' at most 30\n* '''[[Reputation and ranks|Reputation]]:''' at least 40 with [[Factions#Pirates|Pirates]]\n* '''Reward:''' 100,000 CR, karma +5\n\n'''Walkthrough'''\n# I need to take any cargo delivery task and complete it. It's simple.\n# I took the task of transporting cargo. Now I need to deliver it to its destination.\n# They set me up and wanted to blow up my ship at the station.\n\n=== Hunter and prey ===\n''\"You know... you're a pretty good pilot, as it turns out. I have a proposition for you. Wait, listen to the end and then I won't detain you. It's about Dr. Landau...\"''\n\n* '''Contact:''' Yuri Grom at [https://galaxy-genome.github.io/map/?system=Ross%20720 Meridian City] (Ross 720)\n* '''Needs first:''' [[Side quests#Shoulder to shoulder|Shoulder to shoulder]]\n* '''Reward:''' 450,000 CR\n* '''Leads to:''' [[Side quests#Pets|Pets]]\n\n'''Walkthrough'''\n# I was interested in Yuri Grom's words and I agreed to fly to the Echo Science Hub station in the HIP 1296 system. \u2014 ''arrive in HIP 1296; dock at Echo Science Hub''\n# I need to perform warp jumps from system to system while in the LBN 623 nebula\n# We must try to survive and return to the Echo Science Hub station.\n# You need to return to the Echo Science Hub station in the HIP 1296 system. \u2014 ''dock at Echo Science Hub''\n# We have successfully collected data.\n\n=== Pets ===\n''\"I didn't have to wait long for you. We were just finishing up the preparations. I wanted you to participate.\"''\n\n* '''Contact:''' Yuri Grom at [https://galaxy-genome.github.io/map/?system=HIP%201296 Echo Science Hub] (HIP 1296)\n* '''Needs first:''' [[Side quests#Hunter and prey|Hunter and prey]]\n* '''Reward:''' 450,000 CR\n* '''Leads to:''' completing it, with [[Combat#Rating battles|Rating battle]] level 77 won, puts the Shadow jump module in every outfitter; see [[Modules#How to get one|Modules]]\n\n'''Walkthrough'''\n# I have become interested in experimenting with the Zentarks and need to arrive in the 26 Andromedae system. \u2014 ''arrive in 26 Andromedae''\n# There is a planet in the 26 Andromedae system called Zenus 2. I need to get there. \u2014 ''select the planet Zenus 2''\n# Wait for further action in the system 26 Andromedae \u2014 ''Zentarks Hunter destroyed''\n\n== Found in space ==\nThese are never offered. Each starts the moment you arrive in a system, or scan a planet, inside its area, provided a quest slot is free and you have not finished it before.\n\n=== Message for Emily ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''500 ly''' of [https://galaxy-genome.github.io/map/?at=25%2C25898&ly=1500&draw=%7B%22circle%22%3A%5B25%2C25898%2C500%5D%7D a point 25,898 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Record from the avenger ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''30 ly''' of [https://galaxy-genome.github.io/map/?at=600%2C-1078&ly=90&draw=%7B%22circle%22%3A%5B600%2C-1078%2C30%5D%7D a point 1,234 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== One way road ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''2 ly''' of [https://galaxy-genome.github.io/map/?at=-10%2C407&ly=40&draw=%7B%22circle%22%3A%5B-10%2C407%2C2%5D%7D a point 407 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Searching for the reapers ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''500 ly''' of [https://galaxy-genome.github.io/map/?at=-3375%2C-10414&ly=1500&draw=%7B%22circle%22%3A%5B-3375%2C-10414%2C500%5D%7D a point 10,947 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Navigation error ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''23 ly''' of [https://galaxy-genome.github.io/map/?at=-496%2C-331&ly=69&draw=%7B%22circle%22%3A%5B-496%2C-331%2C23%5D%7D a point 596 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Pretty simple ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''10 ly''' of [https://galaxy-genome.github.io/map/?at=816%2C-44&ly=40&draw=%7B%22circle%22%3A%5B816%2C-44%2C10%5D%7D a point 817 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Born explorer ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on arriving in a system within '''15 ly''' of [https://galaxy-genome.github.io/map/?at=-2033%2C6686&ly=45&draw=%7B%22circle%22%3A%5B-2033%2C6686%2C15%5D%7D a point 6,988 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow ship. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== No chance ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on scanning a planet within '''23 ly''' of [https://galaxy-genome.github.io/map/?at=360%2C-717&ly=69&draw=%7B%22circle%22%3A%5B360%2C-717%2C23%5D%7D a point 802 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow planet. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Hope for salvation ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on scanning a planet within '''23 ly''' of [https://galaxy-genome.github.io/map/?at=249%2C-886&ly=69&draw=%7B%22circle%22%3A%5B249%2C-886%2C23%5D%7D a point 920 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow planet. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Don't expect salvation ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on scanning a planet within '''30 ly''' of [https://galaxy-genome.github.io/map/?at=-1448%2C13452&ly=90&draw=%7B%22circle%22%3A%5B-1448%2C13452%2C30%5D%7D a point 13,530 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow planet. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Canyon race ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on scanning a planet within '''150 ly''' of [https://galaxy-genome.github.io/map/?at=-4608%2C-16094&ly=450&draw=%7B%22circle%22%3A%5B-4608%2C-16094%2C150%5D%7D a point 16,741 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow planet. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n\n=== Misjudgment ===\n''\"Signal source detected\"''\n\n* '''Where:''' starts by itself on scanning a planet within '''8,000 ly''' of [https://galaxy-genome.github.io/map/?at=-29894%2C32934&ly=24000&draw=%7B%22circle%22%3A%5B-29894%2C32934%2C8000%5D%7D a point 44,478 ly from Sol]\n* '''Reward:''' 110,500 CR, karma +1\n\n'''Walkthrough'''\n# During a long journey across the galaxy, a message was received from an unknow planet. I need to deliver this message to any station.\n# I have successfully delivered a message to the station\n", "Modding": "\nGalaxy Genome loads '''mods''': extra side quests, and extra stars, planets and\nstations. The game's own [[Side quests|side quests]] are written in exactly the\nsame format, so anything they do, a mod can do.\n\n== Where mod files go ==\n* '''Side quests''' are files named <code>Quest0.json</code> to <code>Quest199.json</code>. The number only has to be in that range; a quest is identified by the ''ID'' inside it.\n* '''Stars, planets and stations''' go in one file, <code>StarsStations.json</code>.\n\n'''Copy the files straight into the game's own folder on your phone''', with no folder of\ntheir own:\n\n<pre>\nAndroid/data/com.skvgames.GalaxyGenome/files/Quest150.json\n</pre>\n\nThe game only looks for those exact file names in that one folder, so a mod that comes\nin a folder of its own, like StoryAlt, needs its files moved out of it. Two files with the same number\ncannot share the folder, so rename one if two mods clash; the number in the name does\nnot matter to the game.\n\nThen open '''Modifications''' from the main menu. Each section there shows the '''File Path''' it\nreads from and whether a mod file '''exists''' in it, which is the quickest way to check\nthe files are in the right place. Switch on '''Side Quests''' or '''Stars and Stations''',\nand allow the game to access your files when it asks.\n\n[[File:Modding mods screen.png|thumb|The Modifications screen with a side quest found and switched on. Each section shows the folder it reads from.]]\n\n* '''The game switches every mod off when it updates.''' Turn them back on after each update.\n* '''[[Combat#Rating battles|Rating battles]] are unavailable''' while mods are active.\n\n== A quest file ==\nOne JSON object with three parts: <code>settings</code> (who offers the quest and when),\n<code>BarRumors</code> (optional gossip) and <code>questParts</code> (the steps, in order).\n\nA file is skipped without any message when it is not valid JSON, has no\n<code>settings</code>, has fewer than two steps, or uses an ID another loaded quest already has.\nCurly quotes pasted into text break the JSON, so check files with a JSON validator.\n\n=== Example ===\n'''StoryAlt''', the 2021 example mod, is a complete quest to copy from: a dialogue choice\nwith a detour, an ambush, docking at a station and a story delivery mission. The copy here\nis updated to the current format, since the game no longer loads the original. Download it in\n[https://galaxy-genome.github.io/wiki/files/StoryAlt/Quest150.json English] or [https://galaxy-genome.github.io/wiki/files/StoryAlt/Quest151.json Russian]; both files carry the same ID, so put whichever\nmatches your game's language in the mod folder.\n\n[[File:Modding StoryAlt bar offer.png|thumb|StoryAlt's quest on offer in the bar at Thunder Station.]]\n\n[[File:Modding StoryAlt choice.png|thumb|The briefing's choice. Each button jumps to a different step of the quest.]]\n\nIts settings and two of its steps:\n\n<pre>\n{\n  \"settings\": {\n    \"QuestName\": \"Following Marcus\",\n    \"QuestDescription\": \"Marcus has gone to ground, and we need him before anyone else finds him.\",\n    \"ID\": 9001,\n    \"StationName\": \"Thunder Station\",\n    \"Lang\": \"en\",\n    \"isRandomStationQuest\": false,\n    \"isRandomSpaceQuest\": false,\n    \"RandomQuestX\": 0,\n    \"RandomQuestY\": 0,\n    \"RandomQuestRadius\": 0,\n    \"RandomSpaceQuestChance\": 0.0,\n    \"CharName\": \"Edmond Anger\",\n    \"CharImage\": \"Edmond Anger\",\n    \"MinKarma\": -101,\n    \"MaxKarma\": 101,\n    \"Faction\": \"none\",\n    \"FactionMinRep\": 0,\n    \"RandomSpaceQuestTrigger\": null,\n    \"RequestedQuestIDCompleted\": null,\n    \"Reward\": 0,\n    \"KarmaReward\": 0\n  },\n  \"BarRumors\": [\n    {\n      \"text\": \"Somebody at Manson Orbital is paying well for couriers who don't ask what they carry.\",\n      \"type\": \"global\"\n    }\n  ],\n  \"questParts\": [\n    {\n      \"name\": \"Briefing\",\n      \"TODO\": \"Decide where to look for Marcus first.\",\n      \"questID\": 1,\n      \"isCheckPoint\": true,\n      \"dialogText\": [\n        {\n          \"Name\": \"Edmond Anger\",\n          \"showTimeSec\": 6,\n          \"text\": \"The exact location of our man is unknown.\",\n          \"character\": \"Edmond Anger\",\n          \"options\": \"\"\n        },\n        {\n          \"Name\": \"Eva\",\n          \"showTimeSec\": 6,\n          \"text\": \"But we don't have time to search everywhere.\",\n          \"character\": \"Eva\",\n          \"options\": \"\"\n        },\n        {\n          \"Name\": \"Edmond Anger\",\n          \"showTimeSec\": 99999999,\n          \"text\": \"Then you'll have to choose where to fly first.\",\n          \"character\": \"Edmond Anger\",\n          \"options\": \"2=Head straight for Wolf 359;10=Check Ross 720 first;\"\n        }\n      ],\n      \"completeAction\": \"ACTION_DIALOG_COMPLETE\",\n      \"dialogTextRepeat\": null,\n      \"repeatTextTimeSec\": 999999999\n    },\n    {\n      \"name\": \"Ambush\",\n      \"TODO\": \"Destroy the bounty hunter who followed you.\",\n      \"questID\": 3,\n      \"isCheckPoint\": false,\n      \"dialogText\": [\n        {\n          \"Name\": \"Eva\",\n          \"showTimeSec\": 6,\n          \"text\": \"We were followed. We have to take out this bounty hunter.\",\n          \"character\": \"Eva\",\n          \"options\": \"\"\n        }\n      ],\n      \"completeAction\": \"ACTION_SHIP_DESTROYED_Hunter\",\n      \"dialogTextRepeat\": [\n        {\n          \"Name\": \"Eva\",\n          \"showTimeSec\": 6,\n          \"text\": \"Hurry!\",\n          \"character\": \"Eva\",\n          \"options\": \"\"\n        }\n      ],\n      \"repeatTextTimeSec\": 240,\n      \"shipSpawn\": [\n        {\n          \"Name\": \"Hunter\",\n          \"shipModel\": \"atom\",\n          \"shipLevel\": \"Master\",\n          \"shipBehavior\": \"Enemy\",\n          \"autoLVL\": false,\n          \"spawnX\": 0,\n          \"spawnY\": 0,\n          \"distanceFromPlayer\": 300\n        }\n      ],\n      \"shipControl\": [\n        {\n          \"ShipName\": \"Hunter\",\n          \"SetTarget\": \"player\",\n          \"Attack\": true,\n          \"Destroy\": false,\n          \"shipBehavior\": \"Enemy\"\n        }\n      ]\n    }\n  ]\n}\n</pre>\n\n== Settings ==\n{| class=\"fandom-table sortable\"\n! Field !! What it does\n|-\n| <code>QuestName</code> || Shown in the bar and in the ''Quest complete'' message\n|-\n| <code>QuestDescription</code> || What the contact says about the quest in the bar\n|-\n| <code>ID</code> || A number identifying the quest in saves and in other quests' requirements. Pick one nobody uses; the game's own quests use 100002 to 100044\n|-\n| <code>Lang</code> || <code>en</code>, <code>ru</code>, <code>es</code>, <code>pt</code> or <code>cn</code>. A mod quest is only offered in that game language\n|-\n| <code>StationName</code> || The station whose bar offers it, by its exact name\n|-\n| <code>CharName</code> || The contact's name\n|-\n| <code>CharImage</code> || The contact's portrait, from the list below. Anything else shows Tourist1\n|-\n| <code>RequestedQuestIDCompleted</code> || Quests to finish first, as text: <code>\"100030;100003\"</code>. 0 means the main story is past its 68th step. A quest with unfinished requirements is not listed at all\n|-\n| <code>MinKarma</code>, <code>MaxKarma</code> || The player's [[Combat#Karma|karma]] must be in this range, checked when they accept. -101 and 101 mean no limit\n|-\n| <code>Faction</code>, <code>FactionMinRep</code> || Reputation needed with <code>GreatEmpire</code>, <code>TradeFederation</code>, <code>StellarAlliance</code>, <code>Independent</code> or <code>PirateClan</code>, checked when they accept\n|-\n| <code>OwnStationRequired</code> || <code>true</code>: offered only once [[Your space station|the player's own station]] is repaired\n|-\n| <code>isRandomSpaceQuest</code> || <code>true</code>: never offered in a bar; starts by itself (below)\n|-\n| <code>Reward</code>, <code>KarmaReward</code> || Ignored for mods (below)\n|}\n\n'''Portraits''' for <code>CharImage</code> and a dialogue line's <code>character</code>:\n<code>Tourist1</code>, <code>Pirate1</code>, <code>Tourist2</code>, <code>Pirate2</code>, <code>Tourist3</code>, <code>Pirate3</code>, <code>Tourist4</code>, <code>Pirate4</code>, <code>Pirate5</code>, <code>Pirate6</code>, <code>Henry</code>, <code>Informant</code>, <code>Eva</code>, <code>Edmond Anger</code>, <code>Police Forces</code>, <code>Assistant</code>, <code>Marcus</code>, <code>David Evans</code>, <code>RT-01</code>, <code>Dr. Landau</code>, <code>G. Hopper</code>, <code>Automaton</code>, <code>Walker</code>, <code>Yuri Grom</code>, <code>None</code>, <code>Kaito</code>, <code>Dina</code>, <code>Daily Task</code>, <code>Expedition</code>, <code>Victor</code>, <code>Ruby</code>, <code>Yana Seest</code>\n\n=== Quests that start in space ===\nWith <code>isRandomSpaceQuest</code> set, the quest starts by itself when the player\n'''arrives in a system''' (<code>\"RandomSpaceQuestTrigger\": \"warp\"</code>) or '''scans a\nplanet''' (<code>\"planetScan\"</code>) within <code>RandomQuestRadius</code> light years of\nthe point <code>RandomQuestX</code>, <code>RandomQuestY</code> on the\n[https://galaxy-genome.github.io/map/ galaxy map] (Sol is 0, 0).\n<code>RandomSpaceQuestChance</code> is the chance each time, from 0.0 to 1.0. It only\nstarts when one of the player's three quest slots is free and the quest has not been\nfinished before.\n\n=== What a mod quest pays ===\n'''A mod's own <code>Reward</code> and <code>KarmaReward</code> are ignored.''' Only the\ngame's own quests pay what they say. A mod quest pays at most '''250 CR''', worked out\nfrom the quest itself:\n* '''150 CR''' if the ships ordered to attack the player cost more than the rest of the ships it spawns, otherwise '''50 CR''' if any ship attacks the player,\n* plus '''20 CR''' for each step that ends on arriving in a system.\n\nA ship counts as attacking only when a <code>shipControl</code> order gives it\n<code>\"SetTarget\": \"player\"</code> and <code>\"Attack\": true</code>, or it is the target of a\npirate-hunt mission.\n\n== Bar rumors ==\n<code>BarRumors</code> is a list of gossip lines: <code>{\"text\": \"...\", \"type\": \"global\"}</code>.\nA <code>global</code> rumor is heard in every bar; any other type only in the bar of the\nquest's own station.\n\n== Steps ==\nThe quest runs its steps in order. Each step shows its dialogue, spawns its ships,\ngives its orders, then waits for its <code>completeAction</code>. After the last step the\nquest is complete and paid.\n\n{| class=\"fandom-table sortable\"\n! Field !! What it does\n|-\n| <code>name</code> || For you; not shown\n|-\n| <code>TODO</code> || The line in the player's journal while the step is active\n|-\n| <code>questID</code> || A label dialogue options jump to. Steps nobody jumps to can all be 0\n|-\n| <code>isCheckPoint</code> || <code>true</code>: the quest is saved on entering this step, and a reload resumes here. The game keeps no record of a quest before its first checkpoint\n|-\n| <code>dialogText</code> || Messages shown when the step starts: <code>Name</code>, <code>showTimeSec</code>, <code>text</code> (under about 320 characters), <code>character</code>, <code>options</code>\n|-\n| <code>dialogTextRepeat</code>, <code>repeatTextTimeSec</code> || A reminder shown every so many seconds while the step waits. 999999999 for never\n|-\n| <code>completeAction</code> || What finishes the step, from the actions below\n|-\n| <code>failureActions</code> || Actions that fail the quest, separated by <code>;</code>\n|-\n| <code>shipSpawn</code>, <code>shipControl</code> || Ships to spawn and orders to give (below)\n|-\n| <code>task_on_station</code> || A mission offered at a station during the step (below)\n|}\n\n* '''Choices.''' <code>options</code> puts buttons under a message: <code>\"2=Head straight for Wolf 359;10=Check Ross 720 first;\"</code>. A button jumps to the step whose <code>questID</code> is that number; <code>-1</code>, or a number no step has, carries on in order.\n* '''Actions are written without <code>BUTTON_</code>.''' The game adds that prefix itself, so <code>BUTTON_ACTION_SHIP_DESTROYED_Hunter</code> never matches.\n* '''A failure needs every listed action.''' <code>\"A;B\"</code> fails the quest only once both have happened during the step. A failed quest can be taken again from the start.\n* '''Don't make a fight a checkpoint.''' A player who reloads would be put straight back into it.\n* '''Steps only advance while no dialogue window is open.'''\n\n=== Ships ===\n<code>shipSpawn</code> adds ships when the step starts. A ship with the same\n<code>Name</code> as one already there is not added.\n\n{| class=\"fandom-table sortable\"\n! Field !! What it does\n|-\n| <code>Name</code> || The pilot's name, which orders and actions refer to\n|-\n| <code>shipModel</code> || Which ship, from the list below\n|-\n| <code>shipLevel</code> || How well equipped: <code>Harmless</code>, <code>Novice</code>, <code>Competent</code>, <code>Expert</code>, <code>Master</code>, <code>Dangerous</code>\n|-\n| <code>shipBehavior</code> || How it acts, from the list below. Default Trader\n|-\n| <code>autoLVL</code> || <code>true</code>: a combat ship costing 70% to 130% of the player's, at Master level\n|-\n| <code>spawnX</code>, <code>spawnY</code> || Where, in light seconds from the system's centre\n|-\n| <code>distanceFromPlayer</code> || Used when spawnX and spawnY are both 0: how far from the player, in a random direction; 0 is half a screen\n|-\n| <code>color</code> || A tint, as a number\n|}\n\n<code>shipControl</code> gives orders to ships already there:\n{| class=\"fandom-table sortable\"\n! Field !! What it does\n|-\n| <code>ShipName</code> || The ship's Name, or <code>player</code>\n|-\n| <code>SetTarget</code> || <code>player</code> or another ship's Name; a miner can take <code>self</code> to stay put\n|-\n| <code>Attack</code> || <code>true</code>: attack the target\n|-\n| <code>Destroy</code> || <code>true</code>: the ship is destroyed on the spot\n|-\n| <code>shipBehavior</code> || Switch it to another behaviour\n|}\n\n'''Ship models''' (the key, then the ship):\n{| class=\"fandom-table sortable\"\n! shipModel !! Ship\n|-\n| <code>anglerb</code> || Angler\n|-\n| <code>anglerm</code> || Angler-Mother\n|-\n| <code>atom</code> || Atom\n|-\n| <code>automaton</code> || Automaton\n|-\n| <code>barracuda</code> || Barracuda\n|-\n| <code>behemoth</code> || Behemoth\n|-\n| <code>buran</code> || Vanger\n|-\n| <code>cardinal</code> || Cardinal\n|-\n| <code>chaser</code> || Chaser\n|-\n| <code>delver</code> || Delver\n|-\n| <code>discordia</code> || Discordia\n|-\n| <code>gladiator</code> || Gladiator\n|-\n| <code>goliath</code> || Goliath\n|-\n| <code>grinder</code> || Grinder\n|-\n| <code>hawk</code> || Hawk\n|-\n| <code>hyperion</code> || Hyperion\n|-\n| <code>ion</code> || Ion\n|-\n| <code>keeper</code> || Keeper\n|-\n| <code>kraken</code> || Kraken\n|-\n| <code>leviathan</code> || Leviathan\n|-\n| <code>mantis</code> || Mantis\n|-\n| <code>mvalkyrie</code> || Valkyrie M\n|-\n| <code>nemesis</code> || Nemesis\n|-\n| <code>overseer</code> || Overseer\n|-\n| <code>pangolin</code> || Pangolin\n|-\n| <code>pangolinmk2</code> || Pangolin MK2\n|-\n| <code>phasis</code> || Prometheus\n|-\n| <code>phoenix</code> || Phoenix\n|-\n| <code>pilgrim</code> || Pilgrim\n|-\n| <code>porter</code> || Porter\n|-\n| <code>reaper</code> || Reaper\n|-\n| <code>sarffgiant</code> || Zentarks Hunter\n|-\n| <code>sarffscout</code> || Zentarks Scout\n|-\n| <code>scorpion</code> || Scorpion\n|-\n| <code>specter</code> || Specter\n|-\n| <code>therion</code> || Therion\n|-\n| <code>titan</code> || Reaper\n|-\n| <code>valkiria</code> || Valkyrie\n|-\n| <code>valkyrie</code> || Valkyrie\n|-\n| <code>vanger</code> || Vanger\n|-\n| <code>viking</code> || Viking\n|-\n| <code>vortex</code> || Vortex\n|-\n| <code>wasp</code> || Wasp\n|-\n| <code>zeus</code> || Zeus\n|}\nKeys are lowercase and exact. The Falcon, Thorn and Rogue cannot be spawned. In a mod,\n<code>anglerm</code>, <code>anglerb</code> and <code>automaton</code> are always hostile.\n\n'''Behaviours''': <code>Player</code>, <code>TraderNoWeapons</code>, <code>Miner</code>, <code>Explorer</code>, <code>Trader</code>, <code>Pirate</code>, <code>LawForces</code>, <code>Fighter</code>, <code>Enemy</code>, <code>Ally</code>, <code>AllyAFK</code>, <code>Mercenary</code>, <code>Automaton</code>, <code>Zentarks</code>, <code>Angler</code>\n\n=== Station missions ===\n<code>task_on_station</code> offers a mission card at a station while the step is active.\n\n{| class=\"fandom-table sortable\"\n! Field !! What it does\n|-\n| <code>Type</code> || <code>PirateHunt</code>, <code>FindGoods</code>, <code>TransferGoods</code>, <code>Mining</code>, <code>Courier</code>, <code>Tourist</code>, <code>MoneyHelp</code>, <code>BugHunt</code>, <code>RescueMission</code>, <code>CaravanHunt</code>, <code>ContractMurder</code>, <code>Intimidate</code>\n|-\n| <code>Level</code> || Reputation needed: <code>Low</code>, <code>Proven</code>, <code>Confidence</code>, <code>Ally</code>\n|-\n| <code>HomeStation</code> || The station offering it\n|-\n| <code>TargetSystem</code>, <code>TargetStation</code> || Where it goes. A target station equal to the home station is swapped for another within 100 ly\n|-\n| <code>TargetShipType</code>, <code>TargetShipName</code>, <code>TargetShipHull</code> || For a pirate hunt: the ship (by the names below), the pilot, and the hull left from 0 to 1\n|-\n| <code>TargetGoods</code>, <code>TargetGoodsCount</code> || Cargo and tons, from the list below; anything else is Water\n|-\n| <code>Reward</code> || Credits, at most 100,000\n|-\n| <code>Reputation</code> || Reputation gained, at most 3\n|-\n| <code>Story</code> || <code>true</code>: a story mission, which cannot fail if the player dies\n|}\n\n'''TargetShipType''' takes each ship's name as the game spells it internally, which is the\nname shown except for: <code>Angler-B</code> (Angler), <code>Mother</code> (Angler-Mother), <code>Avant</code> (Barracuda), <code>KLA8M</code> (Behemoth), <code>KLA9</code> (Leviathan), <code>KLA-6</code> (Pangolin), <code>PangolinMK2</code> (Pangolin MK2), <code>Phasis</code> (Prometheus), <code>Titan</code> (Reaper), <code>MValkyrie</code> (Valkyrie M), <code>Buran</code> (Vanger), <code>Vertex</code> (Vortex), <code>VertexF</code> (Vortex), <code>SarffGiant</code> (Zentarks Hunter), <code>sarffScout</code> (Zentarks Scout).\nAnything else is an Ion.\n\n'''Cargo''': <code>Narcotics</code>, <code>Slaves</code>, <code>BasicMedicines</code>, <code>NanoMedicines</code>, <code>Grain</code>, <code>Fish</code>, <code>Tea</code>, <code>Meat</code>, <code>FruitAndVegetables</code>, <code>ComputerComponents</code>, <code>Robotics</code>, <code>PersonalWeapons</code>, <code>BattleWeapons</code>, <code>Leather</code>, <code>NaturalFabrics</code>, <code>SyntheticFabrics</code>, <code>MilitaryFabrics</code>, <code>Aluminium</code>, <code>Gold</code>, <code>Titanium</code>, <code>Copper</code>, <code>Iron</code>, <code>Platinum</code>, <code>Thorium</code>, <code>Uranium</code>, <code>Samarium</code>, <code>Hafnium</code>, <code>Thallium</code>, <code>Tantalum</code>, <code>SurvivalEquipment</code>, <code>Clothing</code>, <code>DomesticAppliances</code>, <code>Oil</code>, <code>HydrogenFuel</code>, <code>Water</code>, <code>LiquidOxygen</code>, <code>Diamonds</code>, <code>Alexandrite</code>, <code>Bouxite</code>, <code>Gallite</code>, <code>Coltan</code>, <code>Bromellite</code>, <code>Rutile</code>, <code>Uraninite</code>, <code>Monazite</code>, <code>Painite</code>, <code>Lepidolite</code>, <code>LithiumHydroxide</code>, <code>MethaneClathrate</code>, <code>EscapePod</code>, <code>AnglerEye</code>, <code>AnglerFang</code>, <code>AutomatonComponent</code>, <code>EscapePodRare</code>, <code>EscapePodPirate</code>, <code>EscapePodRarePirate</code>, <code>Zentarks Diamond</code>, <code>Drone</code>, <code>VoidOpal</code>, <code>Musgravite</code>\n\n== Actions ==\nThe actions the game's own side quests use:\n\n{| class=\"fandom-table sortable\"\n! Action !! Happens when\n|-\n| <code>ACTION_DIALOG_COMPLETE</code> || the step's dialogue is closed\n|-\n| <code>ACTION_WARP_BEGIN</code> || the player starts a warp jump\n|-\n| <code>ACTION_WARP_END</code> || any warp jump ends\n|-\n| <code>ACTION_WARP_END_SYSTEM_</code> || the player arrives in that system: ACTION_WARP_END_SYSTEM_Sirius\n|-\n| <code>ACTION_WARP_IN_SYSTEM_</code> || the player jumps into that system\n|-\n| <code>ACTION_CLICK_STATION_</code> || the player opens that station's menu, docking there. OWN is the player's own station\n|-\n| <code>ACTION_CLICK_PLANET_</code> || the player selects that planet\n|-\n| <code>ACTION_SCAN_PLANET_</code> || the player scans that planet\n|-\n| <code>LAND_ON_PLANET_</code> || the player lands on that planet\n|-\n| <code>LEAVE_PLANET</code> || the player leaves a planet's surface\n|-\n| <code>ACTION_SHIP_DESTROYED_</code> || the ship with that Name is destroyed\n|-\n| <code>ACTION_SELECT_SHIP_</code> || the player selects that ship\n|-\n| <code>ACTION_SHIP_WARPED_</code> || that ship jumps away\n|-\n| <code>SHIP_STOP_</code> || a ship stops at a place: SHIP_STOP_Kaito_at_player\n|-\n| <code>PLAYER_SHIP_STOP</code> || the player's ship stops\n|-\n| <code>NO_ENEMY</code> || no hostile ships are left\n|-\n| <code>TIME_TICK_</code> || that many seconds into the step\n|-\n| <code>COLLECT_CARGO_</code> || cargo of that kind is collected\n|-\n| <code>PLANET_MINING_END</code> || mining on a planet's surface ends\n|-\n| <code>ACTION_SEISMIC_CHRG_</code> || a seismic charge reaches 33, 66 or 100 percent\n|-\n| <code>ACTION_SEISMIC_BOOM_S</code> || a seismic charge detonates successfully\n|-\n| <code>ACTION_SEISMIC_BOOM_F</code> || a seismic charge fails\n|-\n| <code>OWNSTATION_UPGRADE_BAR</code> || the player upgrades the Bar on their own station\n|-\n| <code>OWNSTATION_UPGRADE_TRADE</code> || the player upgrades the Trade Port on their own station\n|-\n| <code>ACTION_GATES_REPAIR</code> || a warp gate is repaired\n|-\n| <code>SCREEN_PORT_BAR</code> || the player opens a station's bar\n|-\n| <code>CLICK_ACCEPT_STORY_MISSION</code> || the player accepts a story mission\n|-\n| <code>GET_STORY_REWARD</code> || the player collects a story mission's reward\n|-\n| <code>SCREEN_ACTION_ROUTE_SYSTEM_</code> || the player plots a route to that system\n|}\n\nA name ending in <code>_</code> takes a name or number straight after it.\n\nEverything else the game reports, usable the same way:\n<code>ENGINE_LEFT</code>, <code>ENGINE_RIGHT</code>, <code>SYS_OBJ_SELECT_SHIP</code>, <code>SYS_OBJ_SELECT_PLANET</code>, <code>SYS_OBJ_SELECT_CARGO</code>, <code>SYS_OBJ_SELECT_STATION</code>, <code>SCREEN_MODULES</code>, <code>SCREEN_SYSTEM_OBJECTS</code>, <code>SCREEN_SYSTEM_OBJECTS_MAP</code>, <code>ACTION_AUTOPILOT</code>, <code>ACTION_FLIGHT_ASSIST</code>, <code>SCREEN_CARGO</code>, <code>ACTION_WARP_JUMP</code>, <code>SCREEN_MISSIONS_SHIP</code>, <code>SCREEN_REPAIR_SHIP</code>, <code>DRONE_COLLECTORS</code>, <code>SCREEN_SPECS</code>, <code>SCREEN_FLEET_SHIP</code>, <code>ACTION_SELECT_PLANET_WITH_STATION</code>, <code>SCREEN_ACTION_REPAIR_ALL</code>, <code>SCREEN_ACTION_REFUEL</code>, <code>SCREEN_PORT_SHIPYARD</code>, <code>SCREEN_PORT_MODULES</code>, <code>SCREEN_PORT_MARKET</code>, <code>SCREEN_PORT_MISSIONS</code>, <code>SCREEN_PORT_SERVICE</code>, <code>SCREEN_PORT_DISCOVERIES</code>, <code>SCREEN_PLANET_INFO</code>, <code>ACTION_PLANET_SCAN</code>, <code>ACTION_PLANET_LANDING</code>, <code>ACTION_ZOOMSWITCH</code>, <code>ACTION_CHAFF_LAUNCHER</code>, <code>ACTION_SPECTRUM</code>, <code>ACTION_HEATSINK</code>, <code>ACTION_MISSILE_DEF</code>, <code>ACTION_SHIELD_CELL</code>, <code>ACTION_FIGHTERS</code>, <code>ACTION_SILENT_MODE</code>, <code>SCREEN_GALAXY_MAP</code>, <code>SCREEN_ACTION_MAP_ROUTE</code>, <code>SCREEN_ACTION_MAP_ADD_POINT</code>, <code>SCREEN_MAP_BOOKMARK_ADD</code>, <code>SCREEN_MAP_BOOKMARKS</code>, <code>SCREEN_GALAXY_MAP_FILTERS</code>, <code>ACTION_POWER_SYS</code>, <code>ACTION_POWER_WEP</code>, <code>ACTION_POWER_ENG</code>, <code>ACTION_ATTACK</code>, <code>ACTION_FIRE</code>, <code>ACTION_BRAKE</code>, <code>ACTION_FN1</code>, <code>ACTION_FN2</code>, <code>ACTION_FN3</code>, <code>ACTION_BOOST</code>, <code>ACTION_SHOW_EXTERNAL</code>, <code>ACTION_BOTTOM_MENU</code>, <code>ACTION_SETTINGS</code>, <code>ACTION_QUICKSAVE</code>, <code>ACTION_HELP</code>, <code>ACTION_ACHIVES</code>, <code>ACTION_SHOW_SHIP_MENU</code>, <code>ACTION_SHOW_STATION_MENU</code>, <code>CLICK_GREEN_GOODS</code>, <code>CLICK_RED_GOODS</code>, <code>CLICK_BUY_GREEN_GOODS</code>, <code>CLICK_SELL_GREEN_GOODS</code>, <code>CLICK_SELL_GOODS_WITH_PROFIT</code>, <code>CLICK_SHIPYARD_MODULES_SHIELDS</code>, <code>CLICK_SELECT_ENEMY</code>, <code>CLICK_SHIPYARD_MODULES_SHIELDS_2D</code>, <code>ACTION_SHIPYARD_MODULES_SHIELDS_2D_BUY</code>, <code>CLICK_TURN_ON_MODULE</code>, <code>CLICK_CHANGE_MODULE_PRIORITY</code>, <code>ACTION_PIRATE_SPAWN</code>, <code>ACTION_CARAVAN_SPAWN</code>, <code>ACTION_MISSION_HUNT_COMPLETE</code>, <code>ACTION_MISSION_MINING_COMPLETE</code>, <code>ACTION_MISSION_RESCUE_COMPLETE</code>, <code>ACTION_MISSION_BUGHUNT_COMPLETE</code>, <code>SCAN_CARGO</code>, <code>SET_AS_TARGET</code>, <code>ATTACK_NPC</code>, <code>PLANET_TAKEOFF</code>, <code>PLANET_MINING</code>, <code>PLANET_LEFT</code>, <code>PLANET_RIGHT</code>, <code>PLANET_ENGINES</code>, <code>PLANET_MOTOR_MODE</code>, <code>PLANET_MINING_DONE_</code>, <code>COLLECT_MATERIAL_</code>, <code>ACTION_SCAN_PLANET_TYPE_</code>, <code>ACTION_PLAYER_DIST_</code>, <code>ACTION_MATERIAL_BELT_</code>, <code>ACTION_WARP_TRACK_</code>, <code>ACTION_NEBULA_</code>, <code>SHIPSHOP</code>, <code>MODULESSHOP</code>, <code>ENGINEER_SCREEN</code>, <code>GARAGE_SCREEN</code>, <code>RESCUE_SCREEN</code>, <code>LEADER_BOARD_PLANETS</code>, <code>LEADER_BOARD_SYSTEMS</code>, <code>LEADER_BOARD_BATTLES</code>, <code>EVENT_SPAWN_PIRATES</code>, <code>EVENT_SPAWN_NPC_KILLTARGET</code>, <code>EVENT_SPAWN_PIRATE_MISSION</code>, <code>EVENT_SPAWN_REPAIR</code>, <code>EVENT_SPAWN_REFUEL</code>, <code>EVENT_SPAWN_WRECK</code>, <code>EVENT_SPAWN_ZENTARKS</code>, <code>EVENT_SPAWN_BUGHUNT</code>, <code>EVENT_ACTIVATE_WRECK</code>, <code>EVENT_ACTIVATE_REPAIR</code>, <code>EVENT_ACTIVATE_REFUEL</code>, <code>EVENT_ACTIVATE_PIRATE_MISSION</code>, <code>EVENT_ACTIVATE_PIRATES</code>, <code>EVENT_ACTIVATE_MURDERCONTRACT</code>, <code>EVENT_ACTIVATE_INTIMIDATE</code>, <code>EVENT_ACTIVATE_ALIENBUGS</code>, <code>EVENT_END_PIRATES</code>, <code>EVENT_END_ZENTARKS</code>, <code>MINING_PIRATE_SPAWN</code>, <code>SCANNED_ATTACKED_BY_PIRATE</code>, <code>SCREEN_OWNSTATION</code>, <code>EVENT_OWNSTATION_PIRATES</code>, <code>EVENT_END_OWNSTATION_PIRATES</code>, <code>EVENT_END_BUGSKILLED</code>, <code>ACTION_MISSION_ILLEGAL_COMPLETE</code>, <code>WARP_ALIEN_HOOK</code>\n\n== Stars, planets and stations ==\n<code>StarsStations.json</code> holds up to three lists: <code>Stars</code>, <code>Planets</code>\nand <code>Stations</code>.\n\n{| class=\"fandom-table sortable\"\n! List !! Fields\n|-\n| <code>Stars</code> || <code>Name</code>; <code>X</code>, <code>Y</code>, <code>Z</code> in light years; <code>security</code>: <code>Anarchy</code>, <code>Low</code>, <code>Medium</code>, <code>High</code>, <code>Only</code>, <code>NoOne</code>, <code>Conflict</code>; <code>type</code>: a star type. Reusing an existing system's name changes that system instead; Sagittarius A* cannot be changed\n|-\n| <code>Planets</code> || <code>Name</code>; <code>system</code>; <code>type</code>: a planet type; <code>dist</code> (orbit, rounded down to 100 for planets); <code>sput</code> (moons); <code>size</code>; <code>rings</code>; optional <code>mater1</code>, a cargo type. They start out discovered\n|-\n| <code>Stations</code> || <code>Name</code>; <code>StarSystem</code>; <code>PlanetID</code>, the Nth body listed for that system, which must be a planet; <code>type</code>: <code>OrbitalDark</code>, <code>OrbitalWhite</code>, <code>NovaStation</code>, <code>FarmStation</code>, <code>StationHighTech</code>, <code>AsteroidStation</code>; <code>Faction</code>: <code>Russian</code> (United Empire), <code>USA</code> (Trade Federation), <code>China</code> (Interstellar Alliance), <code>Independent</code>, <code>Pirates</code>\n|}\n\n'''The factions have different names here than in a quest's settings.''' A station with a\nfield missing is skipped, as is a planet at an orbit its system already uses.\n\n'''Star types''': <code>M-RedDwarf</code>, <code>K-YellowOrange</code>, <code>G-WhiteYellow</code>, <code>F-White</code>, <code>A-BlueWhite</code>, <code>B-BlueWhite</code>, <code>O-BlueWhite</code>, <code>WolfRayetStar</code>, <code>WC-WolfRayetStar</code>, <code>WN-WolfRayetStar</code>, <code>WNC-WolfRayetStar</code>, <code>WO-WolfRayetStar</code>, <code>DA-WhiteDwarf</code>, <code>DAV-WhiteDwarf</code>, <code>DAZ-WhiteDwarf</code>, <code>DB-WhiteDwarf</code>, <code>DBV-WhiteDwarf</code>, <code>DC-WhiteDwarf</code>, <code>DCV-WhiteDwarf</code>, <code>DO-WhiteDwarf</code>, <code>DOV-WhiteDwarf</code>, <code>DQ-WhiteDwarf</code>, <code>DX-WhiteDwarf</code>, <code>HerbigAeStar</code>, <code>HerbigBeStar</code>, <code>L-BrownDwarf</code>, <code>T-BrownDwarf</code>, <code>TauriG</code>, <code>TauriK</code>, <code>TauriF</code>, <code>TauriM</code>, <code>Y-BrownDwarf</code>, <code>BursterPulsar</code>, <code>RadioPulsar</code>, <code>MillisecondPulsar</code>, <code>SoftGammaRepeaterMagnetar</code>, <code>AnomalousX-rayMagnetar</code>, <code>BlackHole</code>, <code>K-RedGiant</code>, <code>M-RedGiant</code>, <code>G-YellowGiant</code>, <code>F-YellowGiant</code>, <code>M-RedSupergiant</code>, <code>F-YellowSupergiant</code>, <code>A-BlueWhiteSupergiant</code>, <code>B-BlueWhiteSupergiant</code>, <code>O-BlueSupergiant</code>, <code>O-Hypergiant</code>, <code>CarbonC-RStar</code>, <code>CarbonC-HdStar</code>, <code>CarbonC-HStar</code>, <code>CarbonC-JStar</code>, <code>CarbonC-NStar</code>, <code>CarbonC-SStar</code>, <code>CarbonM-SStar</code>, <code>S-Star</code>\n\n'''Planet types''': <code>EarthLikePlanet</code>, <code>GasGiantClassI</code>, <code>GasGiantClassII</code>, <code>GasGiantClassIII</code>, <code>GasGiantClassIV</code>, <code>GasGiantClassV</code>, <code>HeliumRichGasGiant</code>, <code>GasGiantwithAmmoniaLife</code>, <code>GasGiantwithWaterLife</code>, <code>WaterWorld</code>, <code>IcePlanet</code>, <code>RockPlanet</code>, <code>HighMetalPlanet</code>, <code>MetalRichPlanet</code>, <code>AmmoniaPlanet</code>, <code>WaterGiant</code>\n", "Modules": "\nModules are what your hull actually does. Every one takes a slot, most take\n'''mass''', and mass is subtracted from how far you can jump, so outfitting is a\nseries of trades rather than a shopping list.\n\n== Grades ==\nModules come in five grades, '''E''' to '''A'''. A better grade performs better,\nbut it is not simply \"buy A\" \u2014 grade also changes '''mass''', and not in one\ndirection. Comparing one warp drive class across its grades:\n\n{| class=\"fandom-table\"\n! Grade !! Mass\n|-\n| E || 2.5\n|-\n| D || 1\n|-\n| C || 2.5\n|-\n| B || 3.5\n|-\n| A || 2.5\n|}\n\n'''D is the lightest.''' That is why experienced players fit D almost everywhere\nand spend the weight budget on the one module where raw performance wins, the\nwarp drive.\n\nTwo lines do not follow that shape. '''Shields''' lose mass steadily from E to A,\nso there the best grade is also the lightest. '''Fuel tanks''' are sold at C grade\nonly.\n\n=== A bigger class at D beats a smaller class at A ===\nGrade is the expensive axis and class is the cheap one, which is worth knowing\nbefore spending a fortune on an A. A '''4D''' Fuel Scoop against a '''3A''':\n\n{| class=\"fandom-table\"\n!  !! Scoop speed !! Mass !! Power !! Cost (CR)\n|-\n| 3A || 0.176 || 0.4 || 0.48 || 901,000\n|-\n| 4D || 0.196 || 0.4 || 0.33 || 44,000\n|}\n\nThe 4D scoops faster, draws less power, weighs the same and costs a twentieth as\nmuch. Check the class your hull will take before paying for grade: see\n[[Ships#What a hull will take|Ships]].\n\n== Cargo racks ==\nEight classes, capacity doubling each time, and '''no mass at any of them''', so\nthe only cost is credits and a slot. The table, and what a full load is worth,\nare in [[Trading#Cargo racks|Trading]].\n\n== Fuel tanks and scooping ==\nTank size sets how far you can travel between stars.\n\n{| class=\"fandom-table sortable\"\n! Class !! Fuel !! Cost (CR)\n|-\n| 1C || 2 || 1,000\n|-\n| 2C || 4 || 3,800\n|-\n| 3C || 8 || 7,090\n|-\n| 4C || 16 || 25,090\n|-\n| 5C || 32 || 98,970\n|-\n| 6C || 64 || 345,000\n|-\n| 7C || 128 || 1,780,930\n|}\n\nA '''Fuel Scoop''' refills the tank from a star, and that is what makes deep\nspace possible at all. Only some [[The galaxy#Star types|star types]] can be scooped, so a\nlong route is really a route between the ones that can, and an unscoopable star\nis a dead end however convenient it looks.\n\nHold a middle distance while scooping: too close and the ship overheats, too far\nand the scoop stops collecting.\n\n== Scanners ==\nThe '''Planet Scanner''' is what earns you money from exploring, and its range is\nthe whole point \u2014 a longer scanner discovers planets from further out, so you fly\nless per system. The '''1D''' costs 1,000 CR, weighs nothing and more than doubles\nwhat the average system pays you for turning up; every grade after it costs\nbetween eleven and three hundred times as much for roughly a tenth of that gain.\nSee [[Exploration#What each grade is actually worth|Exploration]].\n\nOther scanners do narrower jobs:\n* '''Cargo Scanner''' \u2014 reads another ship's hold. ''\"Turns on automatically when there is a target.\"''\n* '''[https://galaxy-genome.github.io/map/?module=PirateScanner Criminals Scanner]''' \u2014 reads whether a target is wanted, and '''increases the elimination reward'''. See [[Combat]].\n* '''Energy wakes scanner''' and '''Spectrum Analyzer''' \u2014 specialist survey gear.\n\n== Mining modules ==\n'''Mining Laser''', '''Seismic charges''' and the '''Collector Drone Controller'''\nare covered in full on [[Mining]], including which ships can see where to aim.\n\n== Weapons and defence ==\nWeapon choice is a question of '''thermal''' against '''kinetic''' damage, and\nthe defensive modules are mostly about managing '''heat'''. Both are covered on\n[[Combat]].\n\n\n== Modules you cannot simply buy ==\n'''Nothing in an outfitter is gated by faction, reputation or standing.''' Walk\nin with the credits and it is yours, which is the opposite of how\n[[Ships|ships]] work.\n\nThree modules are different. They appear in no shop at all until you unlock\nthem, and from that moment '''every''' shop carries them, whatever its purpose.\n\n{| class=\"fandom-table sortable\"\n! Module !! How it unlocks\n|-\n| Warp Drive Booster || Reach '''Arena level 60''', or visit one particular system. See [[Spoilers#The Warp Drive Booster|Spoilers]]\n|-\n| Gauss Gun || Complete the side quest ''[[Side quests#Dissection|Dissection]]'' (Dr. Landau, [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab])\n|-\n| Shadow jump module || Complete the side quest ''[[Side quests#Pets|Pets]]'' (Yuri Grom, [https://galaxy-genome.github.io/map/?system=HIP%201296 Echo Science Hub]) and win Rating battle level 77. See [[Modules#How to get one|How to get one]]\n|}\n\nThe '''Warp Drive Booster''' is the one that matters, because jump\nrange is what opens the galaxy up. It is also the reason a pilot who wants to\nexplore ends up fighting first.\n\n\n=== Shadow jump module ===\n''\"A module that replaces the afterburner with Zentarks technology for local\nteleportation.\"''\n\n'''It takes over the boost button.''' With one fitted, pressing boost no longer\nlights the afterburner; it teleports you. Which means fitting it costs you boost\nentirely, and there is no way to have both.\n\nWhere you land depends on whether you have a target selected:\n\n* '''With a target within 700 units''' you arrive '''400 units in front of it''', facing the way it faces.\n* '''With no target, or one further than 700 units''', you jump '''800 units ahead''' of your own heading.\n\nThe jump takes '''2 seconds''', during which your ship fades out and back in, and\nit draws the same power the afterburner would have. That two-second window is the\nwhole risk: you are committed, visible and not shooting.\n\nIt exists in exactly one version, '''3D''', at '''3,200,000 CR''' and 4\nmass \u2014 heavy for a class 3 module, and there is no lighter grade to fall back on.\n\n==== How to get one ====\n'''No outfitter stocks it until two things are true.''' From then on every\noutfitter does, whatever its purpose.\n\n# '''Complete the side quest ''[[Side quests#Pets|Pets]]'' (Yuri Grom, [https://galaxy-genome.github.io/map/?system=HIP%201296 Echo Science Hub]).''' It ends in [https://galaxy-genome.github.io/map/?system=26%20Andromedae 26 Andromedae], where you destroy the ''Zentarks Hunter'' at the planet Zenus 2.\n# '''Win [[Combat#Rating battles|Rating battle]] level 77''', the last one fought against human pilots, with its 820,000 CR prize. The 6 alien levels after it only appear once ''Pets'' has been started, and none of them is needed.\n\n''Pets'' is the last of a chain of\n'''14 side quests'''. Each quest needs the ones in\nits ''Needs first'' column finished, so work down the table; anything with\nnothing to wait on can be done in any order.\n\n{| class=\"fandom-table\"\n! Quest !! Contact !! Station !! Needs first !! Reward (CR)\n|-\n| [[Side quests#Asteroid belt|Asteroid belt]] || Olivia || [https://galaxy-genome.github.io/map/?system=Stein%202051 GIF Orbital] ||  || 350,000\n|-\n| [[Side quests#Field testing|Field testing]] || Edmond Anger || [https://galaxy-genome.github.io/map/?system=LP%20104-2 Mark-01 Outpost] ||  || 400,000\n|-\n| [[Side quests#Relax and steam|Relax and steam]] || Kaito || [https://galaxy-genome.github.io/map/?system=LHS%203595 Kuaku Station] ||  || 150,000\n|-\n| [[Side quests#Cloaking|Cloaking]] || Kaito || [https://galaxy-genome.github.io/map/?system=LHS%203595 Kuaku Station] || Relax and steam || 350,000\n|-\n| [[Side quests#With one eye|With one eye]] || Dr. Landau || [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] ||  || 250,000\n|-\n| [[Side quests#Pathfinder|Pathfinder]] || Dr. Landau || [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] || With one eye || 450,000\n|-\n| [[Side quests#Trap|Trap]] || Dr. Landau || [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] || Pathfinder || 300,000\n|-\n| [[Side quests#Dissection|Dissection]] || Dr. Landau || [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] || Trap || 450,000\n|-\n| [[Side quests#Missing convoy|Missing convoy]] || Dina || [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] ||  || 350,000\n|-\n| [[Side quests#Bug hunters|Bug hunters]] || Dina || [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] || Dissection, Missing convoy || \n|-\n| [[Side quests#Together - we are force|Together - we are force]] || Dina || [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] || Asteroid belt, Field testing, Cloaking, Bug hunters || \n|-\n| [[Side quests#Shoulder to shoulder|Shoulder to shoulder]] || Dina || [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] || Together - we are force || \n|-\n| [[Side quests#Hunter and prey|Hunter and prey]] || Yuri Grom || [https://galaxy-genome.github.io/map/?system=Ross%20720 Meridian City] || Shoulder to shoulder || 450,000\n|-\n| [[Side quests#Pets|Pets]] || Yuri Grom || [https://galaxy-genome.github.io/map/?system=HIP%201296 Echo Science Hub] || Hunter and prey || 450,000\n|}\n\n== Going further ==\nAny module can be pushed past its shop grade by an engineer, paid in materials\nyou collect by landing on planets. See [[Crafting]].\n\n", "Galaxy Genome Map": "\nThe '''[https://galaxy-genome.github.io/map/ Galaxy Genome Map]''' answers the question every one of these\nguides ends on: '''where do I actually go?'''\n\nIt draws every catalogued system and generates the rest exactly the way the game\ndoes, so a system you have never visited already knows its planets, its belts and\nwhat percentage of each ore they hold. It runs in a browser, including on a\nphone, and nothing needs installing.\n\nThe sidebar is a stack of sections named for what you are doing in the game.\nEach one folds shut, so only the question you are asking takes up room.\n\n== Route ==\nClick a system, or type its name, and it becomes your '''current system'''. Every\ntooltip then says how far that system is from you and the fewest jumps it could\ntake at your '''Max jump'''.\n\nWith an origin set, just '''point at another system''' and the map plots the\ncourse to it as you move. Click to keep it as the destination. The section folds\ndown to a single line, ''origin \u2192 destination'', with the jumps and light years\nflown and the longest single jump on the way.\n\n* [https://galaxy-genome.github.io/map/?from=Sol&to=Rakdos&jump=10 Sol to Rakdos at 10 ly] against [https://galaxy-genome.github.io/map/?from=Sol&to=Rakdos&jump=33 the same trip at 33 ly]\n\nRoutes run through generated space and through warp gates, so the answer is the\nreal one rather than a catalogue-only guess. '''Escape''' drops the destination,\nthen the origin. Double-click the origin box to change it.\n\n== Show me\u2026 ==\nWhole questions, one tap each. A chip sets the filters, opens only the section\nthat holds its answer and says how many systems qualify. Hover or long-press one\nfor what it means.\n\n* '''High-value scans''': systems that bank 500,000 CR on arrival with a 1D scanner, framed from Sol\n* '''Best outfitters''': every Hi-Tech station\n* '''Your station's five''': the systems your abandoned [[Your space station|space station]] can be waiting in\n* '''Black market run''': stations that sell contraband\n* '''Engineers''' and '''Warp gates''', with spoilers on\n\n== Exploration ==\nA [[Exploration|scan]] can be worth 1,500 CR or 1,150,000 CR, and the difference is\ninvisible until you arrive. Set your '''Planet Scanner''' first, because every\nvalue on the map answers to it: stars pay the moment you drop out of warp, planets\nonly once they are inside your scanner's range.\n\n* '''Min value''' keeps systems banking at least that much '''on arrival'''. Tick ''Use one-hop value'' to count the one body worth crossing the system for as well.\n* '''Planet type present''', '''Min planets''' and '''StarHunter class''' narrow it by what the system holds.\n\nSystems the game already counts as ''explored'' score zero, so nothing on the list\nis a wasted trip.\n\n* [https://galaxy-genome.github.io/map/?value=500000&scanner=1D Systems that pay 500,000 CR on arrival with a 1D]\n* [https://galaxy-genome.github.io/map/?ptype=WaterGiant Systems with a Water Giant], the best single object there is\n* [https://galaxy-genome.github.io/map/?startype=WolfRayetStar Where the Wolf Rayet Stars are]\n\nSwap the scanner to '''1A''' and the list grows; swap it to ''none fitted'' and it\nnearly empties, which is the clearest argument for buying a scanner there is.\n\n== Mining ==\n[[Mining|Mining]] pays on percentage, not luck. Pick an ore and the '''Min %'''\nbox starts a quarter of the way into that ore's range; raise it to find the rich\nbelts.\n\n* [https://galaxy-genome.github.io/map/?ore=Painite&pct=40 Painite belts at 40% or better]\n* [https://galaxy-genome.github.io/map/?ore=Alexandrite Anywhere holding Alexandrite]\n\n== Trading ==\nA station's market is one kind of thing, so these choices are one at a time:\n'''sells contraband''', '''buys contraband''', '''best ore price''', '''buys\ntrophies''' or '''no market at all'''. Each chip shows how many systems match.\n\n== Outfitting ==\n[[Stations]] stock different things, the game never says which is which, and a\nwasted docking is a wasted hour.\n\nPick a '''Module for sale''' and the map marks every system that stocks it.\n'''Full grade only''' is on by default, so the marks are the shops selling every\nclass ('''\u203a\u203a'''); turn it off to include shops capped lower ('''\u203a'''). The tooltip\nnames the station and gives its model, which is the only handle the game gives\nyou once you are in the system.\n\n'''Shop purpose''' and '''Faction''' pick one of each.\n\n* [https://galaxy-genome.github.io/map/?module=FuelScoop Stations selling a Fuel Scoop]\n* [https://galaxy-genome.github.io/map/?faction=United%20Empire&filters=station Where United Empire stations are], for the [[Ships|ships]] only they sell\n* [https://galaxy-genome.github.io/map/?purpose=HiTech Every Hi-Tech station]\n\n== Security ==\nOne security level at a time, from High down to Anarchy and Conflict.\n\n* [https://galaxy-genome.github.io/map/?security=A The anarchy systems]\n\n== Crafting ==\n[[Crafting|Craft materials]] come from planet surfaces, and only four planet\ntypes can be landed on.\n\n* [https://galaxy-genome.github.io/map/?landable=3&lymax=200 Systems with 3 or more landable planets within 200 ly]\n\n=== Calculators ===\nPick a '''ship''', add your '''cargo and fuel''', and choose a warp drive,\nshields and thrusters. The calculator gives the results in the game's own units:\n'''jump range''' in light years, top speed and acceleration, turn rate and shield\nstrength. '''Set''' hands the jump range to the Route section, so routes are\nplanned at what that build really flies.\n\nIt also warns when the load pushes a drive past the game's '''150 ly ceiling''',\nwhere the range drops back to 30, and says how many tonnes it takes to get there.\nSee [[Navigation]] for why.\n\n== Wiki pages ==\nEvery article on this wiki, one pick away. On a wide screen the page slides in\nbeside the map; on a phone it takes the whole screen.\n\n== Highlights, Jump to and Legend ==\n* '''Highlights''' turn on the gold marks for million-credit scans and the sector borders.\n* '''Jump to''' flies to Sol, The Void, Sagittarius A*, Isar, Terminus or the whole galaxy. Where a place has a warp gate, the '''\u21c4''' button flies to the gate's other end.\n* The four rarest stars (Preon, Quark, Wolf Rayet and Soft Gamma Repeater Magnetar) are drawn as '''gold diamonds at every zoom'''.\n\n== Things worth knowing ==\n* '''Spoilers are off by default.''' Engineers, warp gates and The Void stay hidden until you tick ''show spoilers''.\n* It '''speaks five languages''', using the game's own words for ores, planets and ships. Tap the flag to switch.\n* Every setting lives in the address bar, so a link you share opens on exactly what you were looking at.\n* It is '''not''' made by SKV Games and knows nothing about your save. It knows what the game generates, not what you have done.\n", "The galaxy": "\nOnly a small part of the galaxy is hand-built. The rest is '''generated''': the\ngame fills space from a density map, and every system's stars, planets and belts\ncome from a seed derived from its position. That is why a system you have never\nvisited already has fixed contents, and why they are the same for every player.\n\n* '''14,906''' systems are catalogued, with real star names. Of those, '''5,340''' lie in the region reachable from Sol.\n* Everything beyond them is generated on demand and named after its sector and cell, like ''Actox Bw-Ar D68''.\n\nGenerated systems are ordinary in every way that matters: they have planets,\nbelts, ores and scan value, and you can route through them. What they never have\nis a [[Stations|station]], an engineer or a mission.\n\nThe [https://galaxy-genome.github.io/map/ Galaxy Genome Map] renders both kinds together.\n\n== What the whole galaxy is worth ==\nEvery one of the '''72,057,512''' systems in the galaxy has been built\nand valued, so these are counts rather than estimates. The figures are what a\nsystem banks '''for turning up''', with the '''1D''' scanner fitted: every star,\nplus every planet already inside 230 light seconds. Systems the game treats as\n''explored'' are left out, because they pay nothing.\n\n{| class=\"fandom-table sortable\"\n! Banked for turning up !! Systems !! Within 1,000 ly !! Within 5,000 ly !! Nearest\n|-\n| 500,000 CR or more || 3,842,657 || 1,686 || 60,772 || Prime uu-uo D3, 301 ly\n|-\n| 1,000,000 CR or more || 823,487 || 355 || 13,094 || Prime uu-uo D3, 301 ly\n|-\n| 2,000,000 CR or more || 17,469 || 3 || 259 || Algira Dx-Bc D1, 377 ly\n|}\n\nHalf the galaxy pays less than '''5,300 CR''' for turning up and\nthe mean is '''93,378 CR''', so the tail is the whole story: a system\nthat banks two million turns up about once in every\n'''4,125'''.\n\n'''The nearest system that banks a million sits at 301 ly''' \u2014\n1 light year outside the 300 ly bubble\nwhere nothing pays at all. See\n[https://galaxy-genome.github.io/map/?system=Prime%20uu-uo%20D3 Prime uu-uo D3].\n\n=== What the scanner is worth ===\nWith no [[Exploration#The Planet Scanner|Planet Scanner]] fitted, only '''227'''\nsystems in the galaxy bank a million for turning up, and every one of them holds\na Quark star, a Wolf Rayet or a Magnetar: the star is the whole payout.\n\nFit the '''1D''', which costs 1,000 CR and weighs nothing, and the figure becomes\n'''823,487'''. That is the single largest change any module\nmakes to anything in this game, and it is the first thing you can afford.\n\n=== The best there is ===\n[https://galaxy-genome.github.io/map/?system=Jola%20Du-Ai%20B2 Jola Du-Ai B2] banks\n'''4,062,800 CR the moment you drop out of warp''' and asks\nnothing else of you. It sits 9,122 ly from Sol.\n\n[https://galaxy-genome.github.io/map/?system=WHS%20Ae-Ax%20E22 WHS Ae-Ax E22] is the best ''one hop'' in the\ngalaxy: 3,330,400 CR on arrival, and\n'''4,430,400 CR''' once you cross to the single body worth\nflying to. It is 15,022 ly out.\n\n== Star types ==\n'''58''' star types exist. Whether a star is '''fuel scoopable''' decides\nwhether you can refuel there, which is what makes deep-space travel possible at\nall, so it matters more than any other column here.\n\n'''31''' of them appear in the catalogue of named systems; the rest\nturn up only in generated space, which is most of the galaxy. Every name here\nlinks to the map filtered to that star.\n\nThe counts are exact. The galaxy holds '''98,624,412''' stars in total, and\nthey are placed by a seeded generator, so every one of them can be enumerated\nrather than estimated. That is a few thousand more than the system count above,\nbecause a catalogued star takes the place of a generated one and keeps its own\nname.\n\n{| class=\"fandom-table sortable\"\n! Star !! Scan value (CR) !! Rarity !! Scoopable !! In the galaxy\n|-\n| [https://galaxy-genome.github.io/map/?startype=Preonstar Preon star] || 13,000,000 || Hypothetical ||  || 1\n|-\n| [https://galaxy-genome.github.io/map/?startype=Quarkstar Quark star] || 1,800,000 || Hypothetical ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=WolfRayetStar Wolf Rayet Star] || 1,500,600 || Hypothetical ||  || 3\n|-\n| [https://galaxy-genome.github.io/map/?startype=SoftGammaRepeaterMagnetar Soft Gamma Repeater Magnetar] || 920,000 || Very rare ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=WN-WolfRayetStar WN - Wolf Rayet Star] || 450,000 || Very rare ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=O-BlueWhite O - Blue White] || 450,000 || Rare || yes || 67\n|-\n| [https://galaxy-genome.github.io/map/?startype=WNC-WolfRayetStar WNC - Wolf Rayet Star] || 430,000 || Very rare ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=WC-WolfRayetStar WC - Wolf Rayet Star] || 400,000 || Very rare ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=O-Hypergiant O - Hypergiant] || 290,000 || Very rare || yes || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=DOV-WhiteDwarf DOV - White Dwarf] || 280,000 || Very rare ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=DX-WhiteDwarf DX - White Dwarf] || 250,000 || Very rare ||  || 2\n|-\n| [htt
