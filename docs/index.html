21,982 ly || Trading station || [[Stations#Types|Industrial]] || Independent\n|-\n| Namannic U9 Hub || [https://galaxy-genome.github.io/map/?system=Hyota Hyota] || -9,559, 19,795 \u00b7 21,982 ly || Military station || [[Stations#Types|Military]] || Independent\n|-\n| Januplex Hub || [https://galaxy-genome.github.io/map/?system=Pyrenanis Pyrenanis] || -9,565, 19,817 \u00b7 22,005 ly || HiTech station || [https://galaxy-genome.github.io/map/?purpose=HiTech High tech] || Independent\n|-\n| Scibase Station || [https://galaxy-genome.github.io/map/?system=Pyrenanis Pyrenanis] || -9,565, 19,817 \u00b7 22,005 ly || Military station || [[Stations#Types|Military]] || Independent\n|-\n| New Abode Orbital || [https://galaxy-genome.github.io/map/?system=Guang Guang] || -9,543, 19,811 \u00b7 21,990 ly || Industrial station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || Independent\n|-\n| Stelent Orbital || [https://galaxy-genome.github.io/map/?system=Lethya Lethya] || -9,554, 19,815 \u00b7 21,998 ly || Industrial station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || Independent\n|-\n| Object 42 Station || [https://galaxy-genome.github.io/map/?system=Object%2042 Object 42] || -4,608, -16,094 \u00b7 16,741 ly || Industrial station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || Independent\n|-\n| Kowald Station || [https://galaxy-genome.github.io/map/?system=Isar Isar] || -9,530, 19,808 \u00b7 21,981 ly || Trading station || [[Stations#Types|Industrial]] || Independent\n|-\n| Terminus Starport || [https://galaxy-genome.github.io/map/?system=Terminus Terminus] || -24,039, -975 \u00b7 24,059 ly || HiTech station || [https://galaxy-genome.github.io/map/?purpose=HiTech High tech] || United Empire\n|-\n| Abyss Station || [https://galaxy-genome.github.io/map/?system=Breya Breya] || -29,893, 32,934 \u00b7 44,477 ly || Military station || [[Stations#Types|Military]] || Independent\n|}\n", "Mining": "\nAsteroids are broken up for ore and the pieces collected into your hold. You need\na mining weapon fitted and free cargo space to hold what you cut loose. Ore is\nsold at any station's market.\n\nMost systems have at least one asteroid belt, and '''every belt holds three\nores''' in fixed proportions, decided when the system was made. A belt listed at\n50% Painite yields Painite about half the time you mine it, and it will still do\nso next month.\n\n== The equipment ==\n\n=== Mining Laser ===\nThe ordinary way in. ''\"Allows to extract minerals and metals from asteroids.\nActivated automatically when you tap and hold the asteroid down.\"'' Hold on a rock\nand it cuts; anything it frees drifts loose for you to collect.\n\n=== Seismic charges ===\nA launcher that ''\"destroys the integrity of asteroids, allowing access to more\nvaluable resources.\"'' Some asteroids hold '''deep materials''' that a laser\ncannot reach; charges crack them open. Any ship that has a slot for them can\ncarry them.\n\n=== The Miner ability ===\nTwo ships, the '''Delver''' and the '''Grinder''', carry an ability the shop\nlists as '''Miner'''. While you are in attack mode it '''recolours every asteroid\nthat holds deep materials''', so you can see at a glance which rocks are worth\nspending a charge on instead of testing them one by one.\n\n{| class=\"fandom-table sortable\"\n! Ship !! Role !! Price (CR)\n|-\n| Delver || Freighter || 29,450,900\n|-\n| Grinder || Freighter || 215,060,890\n|}\n\nBoth are freighters, which is the point: hauling capacity and serious mining\nbelong together. Neither is a requirement for mining, only a convenience, and a\nlarge one on a belt you intend to strip.\n\n=== Collector Drone Controller ===\n''\"Drone control module for faster cargo collection from outer space. Uses drones\nfrom cargo rack.\"'' Drones fetch what you cut loose so you can keep cutting.\nWithout one you still collect, just slowly and by hand, which on a rich belt is\nmost of your session.\n\n'''Where to buy drones.''' Not the module shop. Click the system, open the\n'''service''' screen (the wrench, where you repair, refuel and resupply), and\nscroll to the bottom \u2014 '''Drones''' is a separate section of its own.\n\n==== How many drones you need ====\nThe controller's class sets how many drones can be '''in the air at once''', so\nthat is the number you want aboard. One drone with a 4-drone controller works; it\njust does a quarter of the work.\n\n{| class=\"fandom-table sortable\"\n! Controller !! Grade !! Drones at once !! Drone speed !! Mass !! Cost (CR)\n|-\n| 1E || E || 1 || 15 || 1 || 600\n|-\n| 1D || D || 1 || 20 || 0.75 || 1,200\n|-\n| 3E || E || 2 || 15 || 2 || 5,500\n|-\n| 3D || D || 2 || 20 || 1.5 || 11,000\n|-\n| 5E || E || 3 || 15 || 8 || 45,000\n|-\n| 5D || D || 3 || 20 || 6 || 89,000\n|-\n| 7E || E || 4 || 15 || 32 || 425,000\n|-\n| 7D || D || 4 || 20 || 24 || 789,000\n|}\n\n==== Drones are cargo, and they can be lost ====\nA drone is an item in your hold, not part of the module. Launching one frees a\nslot when it comes back, so the controller is never used up. The '''drone''' can\nbe, in two ways:\n\n* It is '''damaged''' on the way and does not return.\n* It returns and '''your hold is full''', so there is nowhere to put it. The game says ''\"No space for drone\"'' and the drone is gone.\n\nThat second one catches people out. Filling your hold with ore is exactly when\nyour drones are most likely to die, so leave room for them to come home.\n\n== What the ores are worth ==\n{| class=\"fandom-table sortable\"\n! Ore !! Sells for (CR/t)\n|-\n| [https://galaxy-genome.github.io/map/?ore=Alexandrite Alexandrite] || 84\n|-\n| [https://galaxy-genome.github.io/map/?ore=Monazite Monazite] || 52\n|-\n| [https://galaxy-genome.github.io/map/?ore=Painite Painite] || 44\n|-\n| [https://galaxy-genome.github.io/map/?ore=Diamonds Diamonds] || 40\n|-\n| [https://galaxy-genome.github.io/map/?ore=Bromellite Bromellite] || 32\n|-\n| [https://galaxy-genome.github.io/map/?ore=MethaneClathrate Methane Clathrate] || 10\n|-\n| [https://galaxy-genome.github.io/map/?ore=LithiumHydroxide Lithium Hydroxide] || 8\n|-\n| [https://galaxy-genome.github.io/map/?ore=Uraninite Uraninite] || 8\n|-\n| [https://galaxy-genome.github.io/map/?ore=Gallite Gallite] || 8\n|-\n| [https://galaxy-genome.github.io/map/?ore=Lepidolite Lepidolite] || 6\n|-\n| [https://galaxy-genome.github.io/map/?ore=Coltan Coltan] || 3\n|-\n| [https://galaxy-genome.github.io/map/?ore=Rutile Rutile] || 3\n|-\n| [https://galaxy-genome.github.io/map/?ore=Bouxite Bouxite] || 2\n|}\n\n== Mining for contracts ==\nStations post '''Mining''' missions asking for a set tonnage of one ore, with\n'''12 hours''' to deliver, which suits a belt you already know.\n\nWhat they pay depends almost entirely on your standing at that station. The same\ncontract runs from '''180,000 CR''' as a stranger to over '''3,000,000 CR''' once you\nare Allied there. See [[Missions]].\n\n== Finding a belt worth the trip ==\nChecking systems one at a time is slow. The [[Galaxy Genome Map]] filters by ore\nand by minimum percentage, so you can ask for\n[https://galaxy-genome.github.io/map/?ore=Painite&pct=40 belts at least 40% Painite] and route to the nearest.\n", "Trading": "\nEvery station has a market. Buy a commodity where it is cheap, carry it somewhere\nit is not, and keep the difference. Nothing shoots at you, and unlike\n[[Exploration|scanning]] it pays from the first hour.\n\nThe whole of it comes down to one number: '''how many tons you can carry'''.\nEverything else is arithmetic you can do in advance, and this page does it.\n\n== How a price is made ==\nA station quotes '''1,000 CR a ton''' times the commodity's base\nprice, moved by two things and nothing else.\n\n'''The demand tier.''' Each market type a station carries is ranked, and the\nrank sets the multiplier. The game shows it as ''Demand'' in the market list and\nas a ''Profit'' percentage on the trade screen.\n\n{| class=\"fandom-table sortable\"\n! Demand !! It sells to you at !! It buys from you at\n|-\n| highest || x0.76 || x1.24\n|-\n| second || x0.84 || x1.16\n|-\n| rest || x0.92 || x1.08\n|-\n| neutral || \u2014 || x1.00 exactly\n|}\n\n'''Your trader rank.''' The bonus is subtracted from what you pay and added to\nwhat you are paid, so it counts twice.\n\nAt the best tier on both ends that makes the margin\n'''48% of base price''' at your first rank and\n'''68%''' at your last. At the worst tier\nit is only 16% \u2014 so the same run can be worth\nthree times as much depending on which lines the two stations happened to roll.\n\n== Your hold is the only limit ==\nThe market generator computes a stock figure for every line and '''nothing ever\nreads it'''. No station runs out, and no station refuses a full load. What caps\na transaction is the free space in your hold and the credits in your account.\n\nThat makes the strategy trivial to state: '''carry the most expensive thing on\noffer'''. A ton is a ton, so the margin per ton is the base price times the\nspread, and the ranking below never changes.\n\n== What to carry ==\n'''36''' commodities can be bought and sold. Margin is at the best\ndemand tier on both ends, at your first trader rank.\n\n{| class=\"fandom-table sortable\"\n! Commodity !! Market !! Base price (CR/t) !! Margin (CR/t)\n|-\n| Slaves || Black market || 7,200 || 3,456\n|-\n| Tretonin || Black market || 4,200 || 2,016\n|-\n| Hafnium || Metals || 3,100 || 1,488\n|-\n| Platinum || Metals || 2,200 || 1,056\n|-\n| Robotics || Technology || 1,000 || 480\n|-\n| Battle Weapons || Weapons || 1,000 || 480\n|-\n| Gold || Metals || 850 || 408\n|-\n| Samarium || Metals || 820 || 394\n|-\n| Computer Components || Technology || 800 || 384\n|-\n| Personal Weapons || Weapons || 800 || 384\n|-\n| Leather || Textiles || 800 || 384\n|-\n| Thorium || Metals || 780 || 374\n|-\n| Military Fabrics || Textiles || 700 || 336\n|-\n| Nano Medicines || Medicines || 600 || 288\n|-\n| Uranium || Metals || 390 || 187\n|-\n| Thallium || Metals || 320 || 154\n|-\n| Basic Medicines || Medicines || 300 || 144\n|-\n| Natural Fabrics || Textiles || 300 || 144\n|-\n| Tantalum || Metals || 290 || 139\n|-\n| Copper || Metals || 230 || 110\n|-\n| Fish || Food || 200 || 96\n|-\n| Synthetic Fabrics || Textiles || 200 || 96\n|-\n| Titanium || Metals || 200 || 96\n|-\n| Liquid Oxygen || Chemicals || 170 || 82\n|-\n| Meat || Food || 150 || 72\n|-\n| Oil || Chemicals || 150 || 72\n|-\n| Tea || Food || 120 || 58\n|-\n| Domestic Appliances || Consumer items || 120 || 58\n|-\n| Fruit And Vegetables || Food || 110 || 53\n|-\n| Hydrogen Fuel || Chemicals || 110 || 53\n|-\n| Grain || Food || 100 || 48\n|-\n| Aluminium || Metals || 100 || 48\n|-\n| Iron || Metals || 100 || 48\n|-\n| Survival Equipment || Consumer items || 100 || 48\n|-\n| Clothing || Consumer items || 80 || 38\n|-\n| Water || Chemicals || 60 || 29\n|}\n\nTwo things fall out of that table.\n\n'''The two best cargoes in the game are illegal.''' Slaves and Tretonin pay more\nper ton than anything you can carry openly, and they are the reason the\n[[#The black market|black market]] section below exists.\n\n'''Hafnium is the best legal cargo''', at\n1,488 CR a ton. It is an ordinary\nMetals good, so any station whose rotation lands Metals will stock it, and\nnothing about carrying it is risky.\n\n== Cargo racks ==\nCapacity doubles each class while the price roughly triples. Racks have '''no\nmass''', so the only cost is credits and a slot.\n\n{| class=\"fandom-table sortable\"\n! Class !! Capacity (t) !! Cost (CR) !! A full load of Hafnium earns\n|-\n| 1D || 2 || 1,000 || 2,976\n|-\n| 2D || 4 || 3,140 || 5,952\n|-\n| 3D || 8 || 10,835 || 11,904\n|-\n| 4D || 16 || 34,280 || 23,808\n|-\n| 5D || 32 || 111,670 || 47,616\n|-\n| 6D || 64 || 361,783 || 95,232\n|-\n| 7D || 128 || 1,120,380 || 190,464\n|-\n| 8D || 256 || 3,820,900 || 380,928\n|}\n\nA rack pays for itself in one or two runs at every class, which is why tonnage is\nusually a better purchase than a new ship. What limits you is '''internal slots''':\na hull has a fixed number and everything optional competes for them.\n\n'''Everything you carry competes for the space''', including things you may not\nthink of as cargo:\n* '''Drones''' are one ton each. A 4-drone controller wants four tons standing empty. See [[Mining]].\n* '''Mission cargo''' must fit before the board will let you accept a job.\n* Returning drones need somewhere to land, or they are destroyed.\n\n== The market rotates ==\nEvery station is dealt '''three market types''': one it sells, one it buys at a\npremium, one it buys at the neutral price. They come from a single rotating index\nthat walks the whole station list, so no two neighbours are dealt the same hand,\nand the index advances on a clock.\n\nThe consequence is that '''a station's stock is not a property of the station'''.\nCome back later and it is selling something else. The game's own galaxy map has an\n''Availability of Goods'' filter that shows the current state; the\n[[Galaxy Genome Map|map here]] shows the parts that never change, which the game\nnever tells you at all.\n\nTwo market types are never dealt out:\n* '''Minerals''' are removed from every station's selling and neutral-buying hands, so they can only ever be sold to a station, never bought from one.\n* '''Other''' is not in the rotation at all. It has exactly one buyer, below.\n\n== Minerals are sell-only ==\nThe fifteen Minerals goods are what [[Mining|mining]] produces, and '''every one\nof them has its base price multiplied by forty'''. That single line in the\nconstructor is why a hold of ore beats a hold of anything else by an order of\nmagnitude.\n\n{| class=\"fandom-table sortable\"\n! Ore !! Base price (CR/t) !! A station pays up to\n|-\n| Void Opal || 600,000 || 744,000\n|-\n| Musgravite || 400,000 || 496,000\n|-\n| [[Mining#What the ores are worth|Alexandrite]] || 84,000 || 104,160\n|-\n| [[Mining#What the ores are worth|Monazite]] || 52,000 || 64,480\n|-\n| [[Mining#What the ores are worth|Painite]] || 44,000 || 54,560\n|-\n| [[Mining#What the ores are worth|Diamonds]] || 40,000 || 49,600\n|-\n| [[Mining#What the ores are worth|Bromellite]] || 32,000 || 39,680\n|-\n| [[Mining#What the ores are worth|Methane Clathrate]] || 10,000 || 12,400\n|-\n| [[Mining#What the ores are worth|Lithium Hydroxide]] || 8,800 || 10,912\n|-\n| [[Mining#What the ores are worth|Uraninite]] || 8,400 || 10,416\n|-\n| [[Mining#What the ores are worth|Gallite]] || 8,000 || 9,920\n|-\n| [[Mining#What the ores are worth|Lepidolite]] || 6,000 || 7,440\n|-\n| [[Mining#What the ores are worth|Coltan]] || 3,600 || 4,464\n|-\n| [[Mining#What the ores are worth|Rutile]] || 3,200 || 3,968\n|-\n| [[Mining#What the ores are worth|Bouxite]] || 2,000 || 2,480\n|}\n\nBecause Minerals never appear on the selling side, there is no way to buy ore and\nresell it. You have to dig it.\n\n'''Mining Platform''' in [https://galaxy-genome.github.io/map/?system=HR%201163 HR 1163] is a fixed exception to the whole rotation: it\nalways buys Minerals, and the generator gives everything it buys the '''top\ndemand tier''', not just the first line. It is the one guaranteed best price for\nore in the game.\n\n== Selling without flying ==\nA repaired [[Your space station|station of your own]] runs its own trade routes:\nmark cargo in its store for sale and it sells to the stations around it while you\nare somewhere else entirely.\n\n== The black market ==\nSlaves and Tretonin are worth more per ton than anything legal, and the rules for\nmoving them are strict, fixed, and never explained in game.\n\n'''You can only buy them in Anarchy.''' A station's black market stock is deleted\nanywhere else.\n\n'''You can only sell them in Medium, High or Conflict Zone security.''' Low\nsecurity and Anarchy both have their black-market buying deleted, so the system\nyou bought in will not take them back. '''53''' systems will.\n\n'''There is no neutral price for contraband.''' The neutral-buying hand is\ndeleted for it everywhere, so a sale is always at the premium tier.\n\nOnly these stations are ever dealt the black market to sell, and only while their\nsystem is Anarchy:\n\n{| class=\"fandom-table sortable\"\n! Station !! System !! Location\n|-\n| Storm Hub || [https://galaxy-genome.github.io/map/?system=LHS%202447 LHS 2447] || 25, 10 \u00b7 27 ly\n|-\n| Jack Outpost || [https://galaxy-genome.github.io/map/?system=LHS%201920 LHS 1920] || 26, -30 \u00b7 40 ly\n|-\n| Faos Station || [https://galaxy-genome.github.io/map/?system=Ross%20302 Ross 302] || -39, -16 \u00b7 42 ly\n|-\n| Meridian City || [https://galaxy-genome.github.io/map/?system=Ross%20720 Ross 720] || -18, 50 \u00b7 53 ly\n|-\n| Saraf Station || [https://galaxy-genome.github.io/map/?system=GD%2069 GD 69] || -12, -60 \u00b7 61 ly\n|-\n| Sokol Platform || [https://galaxy-genome.github.io/map/?system=LTT%206774 LTT 6774] || 15, 61 \u00b7 63 ly\n|-\n| Nova Citadel || [https://galaxy-genome.github.io/map/?system=71%20Orionis 71 Orionis] || 14, -66 \u00b7 67 ly\n|-\n| Olymp City || [https://galaxy-genome.github.io/map/?system=Ibre Ibre] || -2,252, -4,002 \u00b7 4,562 ly\n|}\n\nSeven of them are split into two halves and only one half is holding it at a\ntime. What decides the half is not a clock: the market counter advances by the\ngoods '''you''' move \u2014 three per unit bought or sold, one per unit of a goods\nmission \u2014 and everything turns over every '''4,000''' on that counter.\nEach turnover flips the half.\n\n{| class=\"fandom-table\"\n! When the counter is even !! When it is odd !! Always\n|-\n| Meridian City, Storm Hub, Nova Citadel, Faos Station || Sokol Platform, Jack Outpost, Saraf Station || Namannic U9 Hub, Olymp City\n|}\n\nSo the reliable source is '''Olymp City''', dealt it whatever the count, at\n4,562 ly out \u2014 that distance is the trade-off.\nThe map marks which half each of the others is in:\n[https://galaxy-genome.github.io/map/?filters=sellsBlack every station that is ever dealt it].\n\n=== Getting caught ===\nCarrying contraband invites a cargo scan. ''Cargo scanning required, please stop\nand wait.'' You have two answers.\n\n* '''Show fake documents''' is a coin flip. Win and the cargo is made legal. Lose and you pay '''800 CR a ton''' in fines in that system and '''3 karma'''.\n* '''Run away''' is a certainty: '''500 CR a ton''', and no karma.\n\nBluffing is cheaper in credits on average and more expensive in\n[[Reputation and ranks#Karma|karma]]. Fines are held against the '''system''',\nnot against you globally, so an unpaid fine closes that system's services until\nyou settle it. See [[Combat#Bounties and fines|Combat]].\n\n== Trophies have one buyer ==\nThe '''Other''' market never enters the rotation, so the four things in it can\nonly be sold at '''Frontier Lab''' in [https://galaxy-genome.github.io/map/?system=93%20Ceti 93 Ceti], which is handed Other as its\npremium-buying hand permanently.\n\n{| class=\"fandom-table sortable\"\n! Item !! Base price (CR) !! Frontier Lab pays\n|-\n| Zentarks Stone || 450,000 || 558,000\n|-\n| Automaton Component || 300,000 || 372,000\n|-\n| Angler Eye || 150,000 || 186,000\n|-\n| Angler Fang || 25,000 || 31,000\n|}\n\nIf you are hunting an [[Spoilers|Angler]] or holding a Zentarks Stone, that is\nwhere it is worth something. Anywhere else it is ballast.\n\n== Four stations that cannot trade ==\nWolf 851 and Zeta Aquilae have their markets removed\noutright. The stations are still there, still repair and refuel, and still show\nin the system, but no goods are bought or sold at any of them.\n\n{| class=\"fandom-table sortable\"\n! Station !! System\n|-\n| Freedom Hub || [https://galaxy-genome.github.io/map/?system=Zeta%20Aquilae Zeta Aquilae]\n|-\n| Haven Station || [https://galaxy-genome.github.io/map/?system=Zeta%20Aquilae Zeta Aquilae]\n|-\n| Mercy Orbital || [https://galaxy-genome.github.io/map/?system=Zeta%20Aquilae Zeta Aquilae]\n|-\n| New Horizon || [https://galaxy-genome.github.io/map/?system=Wolf%20851 Wolf 851]\n|}\n\nBoth systems read as ''Anarchy'' on the tooltip, and they are the only stations\nin the game where the market screen is empty.\n\n== Trader rank ==\nRank is measured by '''the margin you have earned''', not by turnover. The number\nthat accrues is the price times the quantity times the distance from the neutral\nprice \u2014 so buying and selling at exactly x1.00 raises your rank by nothing at all,\nhowever much money moves.\n\n{| class=\"fandom-table sortable\"\n! Rank !! Margin earned (CR) !! Trade bonus !! Best margin\n|-\n| Penniless || 0 || +0% || 48%\n|-\n| Mostly Penniless || 10,000 || +1% || 50%\n|-\n| Penniless Peddler || 100,000 || +2% || 52%\n|-\n| Dealer || 750,000 || +3% || 54%\n|-\n| Merchant || 3,800,000 || +4% || 56%\n|-\n| Broker || 33,000,000 || +5% || 58%\n|-\n| Entrepreneur || 130,000,000 || +6% || 60%\n|-\n| Tycoon || 380,000,000 || +8% || 64%\n|-\n| Prime || 600,000,000 || +10% || 68%\n|}\n\nThe bonus is small but it applies to both ends of every transaction, so reaching\n'''Prime''' widens the best margin from 48% to\n68%, which is 1.42 times the income for the\nsame flying. See [[Reputation and ranks]].\n\n== Your own station ==\nA repaired [[Spoilers|space station]] of your own trades without you. List cargo\nfor sale, and it finds stations within its trade range that buy that market type,\ntaking the best one per commodity:\n\n* '''x1.2''' where the buyer wants it at the neutral price\n* '''x1.4''' where the buyer wants it at the premium\n\nThat x1.4 is better than the x1.24 you can get in person, so anything\nyour station can sell is worth listing rather than hauling. Upgrading the Trade\nPort raises both the range and the profit.\n", "Missions": "\nMissions are the backbone of income at every stage, not just the early one. Every\n[[Stations|station]] has a board, and each job pays some mix of '''credits''',\n'''materials''' and '''[[Reputation and ranks|reputation]]''' with that station and its\n[[Factions|faction]].\n\nThree things will stop you accepting one: not enough free cargo space, not enough\ncredits for the cargo insurance, or too many missions already active.\n\n== Reputation multiplies the reward ==\nThis is the single most important thing about missions. A job's payout is its\nbase reward raised by your '''standing at that station''', and the step between\ntiers is a multiplication, not an addition:\n\n{| class=\"fandom-table sortable\"\n! Standing !! Station reputation !! Mining pays !! Courier pays\n|-\n| Neutral || 0 || 180,000 || 10,000\n|-\n| Confiding || 10 || 468,000 || 15,000\n|-\n| Friendly || 30 || 1,216,800 || 22,500\n|-\n| Allied || 90 || 3,163,680 || 33,750\n|}\n\nThe same Mining contract is worth '''18x more''' at Allied than at Neutral.\nWorking one station until you are trusted there beats taking the first job you\nsee at a new one, and it is why the same mission can look worthless one week and\nexcellent the next.\n\nEach offer also rolls between '''80% and 120%''' of that figure, so two identical\ncontracts on the same board will not pay the same.\n\n== The jobs ==\n{| class=\"fandom-table sortable\"\n! Mission !! Time limit !! Minimum standing !! At Neutral !! At Allied\n|-\n| Courier job || 2 h || Neutral || 10,000 || 33,750\n|-\n| Deliver || 2 h || Neutral || 70,000 || 560,000\n|-\n| Donation || 2 h || Confiding, always || 80,000 || 851,840\n|-\n| Station needs || 12 h || Neutral || 90,000 || 958,320\n|-\n| Take down pirate || 2 h || Neutral || 100,000 || 1,757,600\n|-\n| Alien Hunt || 2 h || Neutral || 100,000 || 1,757,600\n|-\n| Elimination || 2 h || Neutral || 120,000 || 2,109,120\n|-\n| Intimidate || 2 h || Neutral || 130,000 || 1,797,120\n|-\n| Robbery || 2 h || Confiding || 150,000 || 2,073,600\n|-\n| Mining || 12 h || Neutral || 180,000 || 3,163,680\n|-\n| Transport || 100 h || Neutral || 220,000 || 4,330,260\n|-\n| Rescue Mission || 100 h || Neutral || 280,000 || 5,511,240\n|}\n\nEvery card carries its own standing, and the board greys out anything above what\nyou have earned at that station. Most jobs roll that tier rather than fixing it,\nso a board can offer the same job at two different tiers on the same visit.\n\n== Job descriptions ==\nWhat each job on the board actually asks of you. The figures are the base reward\nbefore the reputation multiplier above.\n\n* '''Courier job''' \u2014 carry a sealed packet to another station within 15 ly. No cargo space needed and no combat. It scales worse than anything else, 1.5x a tier against 2.6x for the best jobs, and most Courier cards are '''fixed at Neutral''' whatever your standing, because the generator uses them to guarantee low-tier work is always on the board. Those pay exactly 10,000 CR for ever. The ones that do roll a tier reach 33,750 at Allied, which is still the worst on the board.\n* '''Deliver''' \u2014 buy a named good and take it to a named station. You supply the cargo, so you need the hold space and the credits up front.\n* '''Station needs''' \u2014 the same trade inward: bring a named good back to the station offering the job. The quantity is '''(tier + 1) squared, times 2 to 5''' units, so the same job at Ally asks for several times what it asks at Low.\n* '''Mining rush''' \u2014 mine a named mineral and bring it back. The tier is set by the mineral rather than by you: the cheap ores are Low jobs and anything at or above a basic cost of 1 is a Very High one, which is why the board pays so much better once you can work the rare belts. Never fewer than 2 units. See [[Mining]].\n* '''Donation''' \u2014 you pay the station rather than being paid. The reward figure is applied to your balance as a '''negative''', and what you get back is [[Reputation and ranks|reputation]] with that station and its [[Factions|faction]]. Nothing to fly to and nothing to carry: it is reputation bought with credits.\n* '''Transport''' \u2014 carry a passenger to a system '''100 ly per tier''' away, up to 400 at Very High. The pay is the base scaled by how far you actually went against that target, so the long runs pay disproportionately. A hundred hours on the clock, and the passenger will ask to be dropped somewhere along the way.\n* '''Rescue Mission''' \u2014 the best-paying job in the game. A named ship is stranded in a distant system, out of fuel or badly damaged, and wants what you carry. The distance model and the hundred-hour limit match Transport.\n* '''Take down pirate''' \u2014 destroy a named pirate ship in a system within 15 ly. What you are sent against is set by the tier, from an Ion at Low to a Goliath or a Titan at Very High. Three hulls carry '''1,600,000 CR''' on top of the reward, Hyperion, Titan and Discordia, and a Nemesis carries 400,000. See [[Combat]].\n* '''Elimination''' \u2014 the same fight against a target who is not a pirate, at a station of another faction. Same hulls, same bonuses.\n* '''Alien Hunt''' \u2014 an Angler mother and her brood, in a system within 100 ly. One fixed danger level whatever your standing, so the tier changes the pay and nothing else.\n* '''Robbery''' \u2014 destroy a hauler and take its cargo. Never offered at Low.\n* '''Intimidate''' \u2014 frighten a captain rather than kill him, and that distinction is the whole job.\n\n=== Robbery ===\n* The target is a named freighter with an escort, and the cargo is always one of six: Battle Weapons, Basic Medicines, Nano Medicines, Robotics, Natural Fabrics or Leather.\n* Bring back '''15 units per tier''', plus up to 4 more.\n* A Hyperion, Titan or Discordia target carries far more, and the quantity asked of you rises with it.\n* The hold space has to be free before the cargo drops, or you cannot collect it.\n\n=== Intimidate ===\n* Kill the escort first: one ship at Low and Medium, two at High, more above.\n* Then damage the named target until its hull is '''under 30%''' and stop.\n* It surrenders, the mission completes, and it flies away.\n* '''Destroying it fails the mission.''' There is no partial credit.\n\n=== The rare boards ===\nAt any station within '''100 ly of Sol''', each board refresh has a '''1 in 20'''\nchance of carrying one of three jobs that pay orders of magnitude more than\nanything else, and that '''never expire''':\n\n* A Courier job to '''[https://galaxy-genome.github.io/map/?system=Lone%20Star Laickoms Station]''', 12,000,000 CR and up.\n* A Courier job to '''[https://galaxy-genome.github.io/map/?system=J3571 Astro City]''', 5,600,000 CR and up.\n* A Transport run to '''[https://galaxy-genome.github.io/map/?system=Sagittarius%20A%2A Sagittarius A*]''', 30,000,000 CR and up.\n\nAll three are offered at Confiding, so they are reachable early. Checking the\nboards around Sol is worth the detour on its own:\n[https://galaxy-genome.github.io/map/?filters=station&lymax=100 every station inside 100 ly].\n\nStation needs, Mining rush, Deliver and Robbery take the goods out of your hold\non completion and count the payout toward your [[Trading#Trader rank|trader\nrank]], so they are trade jobs as much as they are missions.\n\n== Reading the board ==\n* '''Courier''' and '''Deliver''' are where you start. Short timers, small cargo, no combat. Courier scales the worst of anything on the board, so leave it behind.\n* '''Mining''' and '''Station needs''' give you twelve hours, enough to fly somewhere specific and return. See [[Mining]].\n* '''Transport''' and '''Rescue Mission''' allow a hundred hours and pay the most. Tourist runs are capped separately, so you cannot fill the board with them.\n* The combat jobs, '''Take down pirate''', '''Elimination''', '''Robbery''' and '''Alien Hunt''', want a ship that can fight before you accept one.\n\nMissions expire. The timer runs whether or not you are flying toward them.\n", "Combat": "\nCombat is where the late game money is: bounties, pirate contracts, and the\n'''fleet''' that [[Reputation and ranks|combat rank]] eventually unlocks. It is\nalso the fastest way to lose a ship you spent hours paying for.\n\n== Attack mode ==\nPutting your cannons out changes how your ship behaves, and the game will tell\nyou so:\n\n* ''\"Speed limit: turn off cannons\"'' \u2014 you are slower with weapons deployed.\n* ''\"WARP ERROR: TURN OFF CANNONS\"'' \u2014 you cannot jump until you stow them.\n\nSo you cannot flee a fight by warping out until you have disengaged first. Decide\nbefore you commit.\n\n\n== Weapons ==\nEleven weapon lines, and they divide on two axes: '''what damage they do''', and\n'''how far they reach'''. Everything else is detail.\n\n{| class=\"fandom-table sortable\"\n! Weapon !! Damage !! Range !! Shot speed !! Ammo cost !! What it is\n|-\n| [https://galaxy-genome.github.io/map/?module=LaserWeapon Beam Laser] || Thermal || 12 || 3000 || - || Continuous beam. Strong against shields, weak against armour\n|-\n| [https://galaxy-genome.github.io/map/?module=PulseLaserWeapon Pulse Laser] || Thermal || 14 || 1000 || 0.3 || The starting weapon. Intermittent blasts, same thermal profile\n|-\n| [https://galaxy-genome.github.io/map/?module=TitanLanceWeapon Energy Lance] || Thermal || 40 || 3000 || 0.3 || Damage climbs the longer the beam holds. Class 5 fits only the ''Titan''\n|-\n| [https://galaxy-genome.github.io/map/?module=PlasmaGunWeapon Plasma Cannon] || Thermal || 30 || 400 || 0.3 || Slow slugs, heavy damage, hard to land at range\n|-\n| [https://galaxy-genome.github.io/map/?module=CannonWeapon Cannon] || Kinetic || 15 || 1300 || 0.3 || Rapid-fire machine gun. Strong against armour, weak against shields\n|-\n| Fragment Cannon || Kinetic || 8 || 400 || 0.5 || Shotgun. Devastating up close, useless beyond a few units\n|-\n| [https://galaxy-genome.github.io/map/?module=RailgunWeapon Railgun] || Thermal and kinetic || 40 || 1500 || 10 || '''Partially passes through shields.''' The generalist answer\n|-\n| Gauss Gun || Thermal and kinetic || 16 || 3000 || - || The Railgun's harder-hitting cousin, at a third of the range\n|-\n| [https://galaxy-genome.github.io/map/?module=MissileWeapon Missiles] || Explosion || 25 || 400 || 10 || Tracking warheads. Countered by chaff\n|-\n| [https://galaxy-genome.github.io/map/?module=TorpedoWeapon Torpedoes] || Explosion || 45 || 200 || 50 || The longest reach in the game, and the slowest shot\n|-\n| [https://galaxy-genome.github.io/map/?module=MineWeapon Mines] || Explosion || 5 || 10 || 75 || Dropped, not fired. Arm after a delay when something approaches\n|}\n\n'''Range is the constraint people underrate.''' A Fragment Cannon reaches 8 and a\nTorpedo reaches 45 \u2014 nearly six times as far. A loadout that mixes them wastes\none of them in any given fight, because you cannot be at both ranges at once.\n\n'''Shot speed decides whether you can hit anything.''' A Beam Laser and an Energy\nLance arrive instantly at 3,000. A Plasma Cannon or a Torpedo travels at 400 or\n200, which against a moving target at long range means leading it badly or\nmissing. Slow and heavy only pays against something large or stationary.\n\n'''Ammo cost is a running bill.''' Lasers and the Gauss Gun cost nothing per shot.\nA Torpedo costs 50 and a Mine 75, so those are weapons you spend rather than\nfire.\n\n=== The Railgun is the safe default ===\nIt ''\"inflicts both thermal and kinetic damage\"'' and '''partially passes through\nshields''', which means it is the one weapon that never has a bad matchup. Every\nother choice is a bet on what you will meet: thermal strips shields and struggles\nwith armour, kinetic does the reverse. Carrying a Railgun is how you stop\nguessing, at the price of never being the best answer to anything.\n\nIt is sold at '''HiTech''' stations only.\n\n== Damage types ==\nShields resist one kind of damage and armour resists the other, and the hull's\n'''Armour Hardness''' rating governs how well it shrugs off each \u2014 which is why\ntwo ships with the same hull number do not die at the same rate.\n\nThe practical shape of it: bring '''thermal''' to strip shields and '''kinetic'''\nto break hull, or carry a '''Railgun''' and ignore the distinction, since part of\nits damage passes through shields either way. Which weapon deals which is in the\ntable above.\n\n== Shields, hull and heat ==\n'''Shields''' absorb damage until they fail, then the '''hull''' takes it.\n\n'''Heat''' is the resource that actually constrains a long fight. Firing builds\nit, and a '''Shield Cell Bank''' recharges your shields fast at the cost of ''\"an\nincreased heat load.\"'' A '''Heatsink Launcher''' ''\"allows to reset ship heat in\na moment\"'', which is the button that keeps you in a fight you would otherwise\nhave to break off. Those two pull against each other, and a fight that goes long\nis usually decided by which one you pressed first.\n\n{| class=\"fandom-table sortable\"\n! Module !! What the game says it does\n|-\n| [https://galaxy-genome.github.io/map/?module=Shields Shields] || ''\u201cEnergy shield which can take a certain amount of damage before the hull is damaged.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=ShieldsBooster Shields Booster] || ''\u201cIncrease the strength of a ship's shields which allows to take more damage.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=ShieldCellBank Shield Cell Bank] || ''\u201cEnergy capacitor for quick recovery of shields. Its usage increases heat load.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=Heatsink Heatsink Launcher] || ''\u201cAllows to reset ship heat in a moment.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=HullReinforcement Hull Reinforcement] || ''\u201cAdditional parts of ship hull which allow to take more damage before the spacecraft is totally destroyed.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=DefenceTurret Defence Turret] || ''\u201cAutomatic missile defense system. Shoots down most of the missiles approaching your ship.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=ChaffLauncher Chaff Launcher] || ''\u201cDeploys a payload of signal-disrupting chaff that instantly breaks tracking locks from weapons of enemy ships.\u201d''\n|-\n| [https://galaxy-genome.github.io/map/?module=RepairModule Repair Module] || ''\u201cAllows to repair other modules in case there are enough spare parts.\u201d''\n|}\n\n'''Grade beats class on shields.''' A higher grade raises shield strength without\nthe mass a bigger class costs you, and mass is jump range. See\n[[Modules#Grades|Modules]].\n\n== Unique abilities in a fight ==\nThree ships fight in a way no amount of outfitting reproduces. All three are\ntop-tier faction hulls, so these are late-game answers to late-game problems, not\nchoices you make early. See [[Ships#Unique abilities|Ships]] for the full list.\n\n=== Multi-target cannons fire ===\nThe '''Hyperion''' does not fire where you are looking. Every time\nits guns cycle they pick a target at random from everything currently in range,\nso a burst sprays across the whole group rather than concentrating on one hull.\n\n'''That is a trade, not an upgrade.''' Against a pack of weak pirates it is\nstrictly better, because everything in the swarm is taking damage at once and\nnothing gets to sit at full health. Against one heavy target it is strictly\nworse, because you cannot make it focus. Choose the Hyperion for\nthe fights it suits and expect it to feel wrong in the others.\n\n=== Big cannon ===\nThe '''Reaper''' is the only ship in the game with a '''class-5\nweapon hardpoint'''. Everything else tops out at class 4, which means the Titan\nmounts a weapon nothing else can carry: the '''[[Combat#Weapons|Energy Lance]]'''.\n\nThe Lance is ''\"an energy weapon that continuously emits a laser beam\"'' dealing\nthermal damage, and its defining property is that '''the longer the beam\ncontinues, the more damage is dealt'''. It rewards holding a target rather than\ntapping at it, which is the opposite of how most weapons in the game play. It\ncomes in classes 2 through 4 as well, so smaller ships can carry one; only the\n5D fits the Titan's big mount. It is sold at '''HiTech''' stations.\n\n=== Aircraft carrier ===\nFighter hangars launch fighters that fight alongside you, and most ships that can\ncarry one cap out well below the largest class. The '''Discordia'''\nships with the '''largest hangar in the game fitted as standard''', which is the\nwhole point of the hull: it is a platform for its fighters rather than for its\nown guns.\n\n\n== Rating battles ==\nThe game's arena. You take on a fixed ladder of opponents one at a time, and the\ngame calls it '''Rating battles''' wherever it names it.\n\n'''83''' levels. The prize rises by a flat 10,000 CR a rung:\n\n reward = 80,000 + (level - 1) x 10,000\n\nSo level 1 pays 80,000 CR and level 83 pays\n900,000 CR. Clearing the whole ladder is\n'''40,670,000 CR'''.\n\n=== Where they are held ===\nBattles run at '''anarchy systems with a station, within 100 ly of Sol''', and\nthe ladder cycles through them in order, so each system hosts roughly every ninth\nlevel.\n\n{| class=\"fandom-table sortable\"\n! System !! Distance\n|-\n| [https://galaxy-genome.github.io/map/?system=LHS%202447 LHS 2447] || 27 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=LP%20104-2 LP 104-2] || 39 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=LHS%201920 LHS 1920] || 40 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=Ross%20302 Ross 302] || 42 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=LTT%207448 LTT 7448] || 46 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=Ross%20720 Ross 720] || 53 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=GD%2069 GD 69] || 61 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=LTT%206774 LTT 6774] || 63 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=71%20Orionis 71 Orionis] || 67 ly\n|}\n\nThat is the whole pool. All of them are close enough to reach early, which is the\npoint: the ladder is meant to be started long before you can fight the top of it.\n\n=== What you face ===\nLevel 1 is a single '''Ion''', the ship you start the game in. The\nladder climbs through Atom and Chaser hulls, then\ninto multi-ship fights, and ends with fleets of up to '''five''' opponents \u2014\nZentarks Hunters and Automatons at once.\n\nTwo things to know before you start one:\n\n* '''Attacking early forfeits the match.'''  ''\"Violation of the rules. You attacked before the battle began.\"''\n* '''Mods disable it entirely.''' ''\"Ranked battles are not available with active mods.\"''\n\n=== Why it matters beyond the money ===\n'''Rating battles gate the Warp Drive Booster''', the only module\nthat extends jump range past what a drive alone gives. It unlocks at\n'''level 60''', by which point the ladder has paid out\n22,500,000 CR.\n\nThere is a second route that skips the fighting entirely; see\n[[Spoilers#The Warp Drive Booster|Spoilers]].\n\nWinning level 77, the last against human pilots, is half of\nunlocking the '''Shadow jump module'''; the other half is a side quest chain. See\n[[Modules#How to get one|Modules]].\n\n== Bounties and fines ==\nKills on wanted ships produce '''bounty claims''', which you cash at a station\nlike [[Exploration|discoveries]]. Your own crimes produce '''fines'''. A station\nwill refuse you service until both are settled: ''\"You must get the reward and/or\npay the fines.\"''\n\nA '''Criminals Scanner''' ''\"scans the ship for the presence on the wanted list\"''\nand, crucially, '''increases the elimination reward'''. If you intend to hunt, it\npays for itself.\n\nLaw ships patrol and will scan you for illegal cargo, holding you in place while\nthey do: ''\"Cargo scanning required, please stop and wait.\"''\n\n== Pirates ==\nPirates interdict you and will often make an offer first: ''\"Drop the cargo \u2013 and\nI will let you go!\"'' Paying is a real option, and a cheap one if your hold is\nfull of ore you can mine again.\n\nDestroyed pirates leave '''escape pods''', which are cargo you can collect and\nsell. The game tracks a daily '''pirates destroyed''' count.\n\n== Karma ==\nKarma is not a rank you earn, it is a record of how you behave, and the game\ngives it names too:\n\n''Despised \u00b7 Disliked \u00b7 Average \u00b7 Liked \u00b7 Revered''\n\nIt moves both ways. Clearing pirate activity from a system is worth\n'''+2'''; destroying law enforcement costs you. It matters because\n[[Side quests|side quests]] check it in '''both directions''' \u2014 some will not\ntalk to you until your record is clean, and others will not talk to you unless it\nis dirty. A spotless record closes doors as surely as a bad one.\n", "Side quests": "{{spoiler}}\n'''42 side quests ship with the game.''' 30 are offered by a named contact in a station's bar, many of them in chains where one must be finished before the next appears; the other 12 start by themselves, out in space. Mods add more in exactly the same format.\n\nYou can have '''three side quests''' under way at once. A quest saves at its checkpoints, so a reload puts you back at the last one it reached. If a ship you are protecting is destroyed, the quest fails and is offered again from the start.\n\nA quest whose earlier quests are unfinished, or that needs your own station repaired, is simply not listed at the bar. The rest are listed, and accepting one checks your [[Combat#Karma|karma]] in both directions and your reputation with a faction, telling you which falls short.\n\n== All side quests ==\n{| class=\"fandom-table sortable\"\n! Quest !! Contact !! Where !! Needs first !! Reward (CR)\n|-\n| [[Side quests#Convoy|Convoy]] || Billy Baker || [https://galaxy-genome.github.io/map/?system=LHS%203356 Urta Outpost] ||  || 450,000\n|-\n| [[Side quests#Asteroid belt|Asteroid belt]] || Olivia || [https://galaxy-genome.github.io/map/?system=Stein%202051 GIF Orbital] ||  || 350,000\n|-\n| [[Side quests#Molehole|Molehole]] || Harry Walker || [https://galaxy-genome. tadel] ||  || 150\n|-\n| [[Side quests#Don't ask questions|Don't ask questions]] || Saimon || [https://galaxy-genome.github.io/map/?system=LPM%20616 Ferbean Station] ||  || 100,000\n|-\n| [[Side quests#Hunter and prey|Hunter and prey]] || Yuri Grom || [https://galaxy-genome.github.io/map/?system=Ross%20720 Meridian City] || Shoulder to shoulder || 450,000\n|-\n| [[Side quests#Pets|Pets]] || Yuri Grom || [https://galaxy-genome.github.io/map/?system=HIP%201296 Echo Science Hub] || Hunter and prey || 450,000\n|-\n| [[Side quests#Message for Emily|Message for Emily]] ||  || [https://galaxy-genome.github.io/map/?at=25%2C25898&ly=1500&draw=%7B%22circle%22%3A%5B25%2C25898%2C500%5D%7D within 500 ly of 25,25898] ||  || 110,500\n|-\n| [[Side quests#Record from the avenger|Record from the avenger]] ||  || [https://galaxy-genome.github.io/map/?at=600%2C-1078&ly=90&draw=%7B%22circle%22%3A%5B600%2C-1078%2C30%5D%7D within 30 ly of 600,-1078] ||  || 110,500\n|-\n| [[Side quests#One way road|One way road]] ||  || [https://galaxy-genome.github.io/map/?at=-10%2C407&ly=40&draw=%7B%22circle%22%3A%5B-10%2C407%2C2%5D%7D within 2 ly of -10,407] ||  || 110,500\n|-\n| [[Side quests#Searching for the reapers|Searching for the reapers]] ||  || [https://galaxy-genome.github.io/map/?at=-3375%2C-10414&ly=1500&draw=%7B%22circle%22%3A%5B-3375%2C-10414%2C500%5D%7D within 500 ly of -3375,-10414] ||  || 110,500\n|-\n| [[Side quests#Navigation error|Navigation error]] ||  || [https://galaxy-genome.github.io/map/?at=-496%2C-331&ly=69&draw=%7B%22circle%22%3A%5B-496%2C-331%2C23%5D%7D within 23 ly of -496,-331] ||  || 110,500\n|-\n| [[Side quests#Pretty simple|Pretty simple]] ||  || [https://galaxy-genome.github.io/map/?at=816%2C-44&ly=40&draw=%7B%22circle%22%3A%5B816%2C-44%2C10%5D%7D within 10 ly of 816,-44] ||  || 110,500\n|-\n| [[Side quests#Born explorer|Born explorer]] ||  || [https://galaxy-genome.github.io/map/?at=-2033%2C6686&ly=45&draw=%7B%22circle%22%3A%5B-2033%2C6686%2C15%5D%7D within 15 ly of -2033,6686] ||  || 110,500\n|-\n| [[Side quests#No chance|No chance]] ||  || [https://galaxy-genome.github.io/map/?at=360%2C-717&ly=69&draw=%7B%22circle%22%3A%5B360%2C-717%2C23%5D%7D within 23 ly of 360,-717] ||  || 110,500\n|-\n| [[Side quests#Hope for salvation|Hope for salvation]] ||  || [https://galaxy-genome.github.io/map/?at=249%2C-886&ly=69&draw=%7B%22circle%22%3A%5B249%2C-886%2C23%5D%7D within 23 ly of 249,-886] ||  || 110,500\n|-\n| [[Side quests#Don't expect salvation|Don't expect salvation]] ||  || [https://galaxy-genome.github.io/map/?at=-1448%2C13452&ly=90&draw=%7B%22circle%22%3A%5B-1448%2C13452%2C30%5D%7D within 30 ly of -1448,13452] ||  || 110,500\n|-\n| [[Side quests#Canyon race|Canyon race]] ||  || [https://galaxy-genome.github.io/map/?at=-4608%2C-16094&ly=450&draw=%7B%22circle%22%3A%5B-4608%2C-16094%2C150%5D%7D within 150 ly of -4608,-16094] ||  || 110,500\n|-\n| [[Side quests#Misjudgment|Misjudgment]] ||  || [https://galaxy-genome.github.io/map/?at=-29894%2C32934&ly=24000&draw=%7B%22circle%22%3A%5B-29894%2C32934%2C8000%5D%7D within 8,000 ly of -29894,32934] ||  || 110,500\n|}\n\n== From station bars ==\nListed so that a quest comes after everything it needs.\n\n=== Convoy ===\n''\"Hey buddy! Can you give me a minute? I saw your ship at the docks. I assume that you will be interested in the work of guarding a transport ship. If you agree, I will tell you the details.\"''\n\n* '''Contact:''' Billy Baker at [https://galaxy-genome.github.io/map/?system=LHS%203356 Urta Outpost] (LHS 3356)\n* '''[[Combat#Karma|Karma]]:''' at least 20\n* '''Reward:''' 450,000 CR, karma +2\n\n'''Walkthrough'''\n# Got a job offer. I will have to accompany the transport ship. Details will be obtained in LTT 7448 system. \u2014 ''arrive in LTT 7448''\n# Fly to the Ferma Platform Station in LTT 7448 \u2014 ''dock at Ferma Platform''\n# I met with Billy. Now I need to accompany him. The intermediate point of the route is LFT 1454. \u2014 ''arrive in LFT 1454''\n# I continue to guard the cargo ship. The next waypoint is LHS 3577. \u2014 ''arrive in LHS 3577''\n# Almost the entire route has been completed. It remains to move to the last point - Ross 302. \u2014 ''arrive in Ross 302''\n# We have reached the end point of the route (Ross 302). There is only one station in the system - we go there.\n# We were attacked by pirates in the Ross 302 system. Could it be otherwise? We'll have to fight. \u2014 ''Pirate 1 destroyed''\n# We won the battle with the pirates and now we need to get to the station in the Ross 302 system \u2014 ''dock at Faos Station''\n# We successfully flew to the station. Billy thanked me for my help.\n\n=== Asteroid belt ===\n''\"Hey! I need help mining resources to modify modules. I'll pay well for such a simple job.\"''\n\n* '''Contact:''' Olivia at [https://galaxy-genome.github.io/map/?system=Stein%202051 GIF Orbital] (Stein 2051)\n* '''[[Combat#Karma|Karma]]:''' at least -10\n* '''Reward:''' 350,000 CR, karma +2\n* '''Leads to:''' [[Side quests#Together - we are force|Together - we are force]]\n\n'''Walkthrough'''\n# Olivia suggested looking for the required ore in the Eta Cassiopeiae system. \u2014 ''arrive in Eta Cassiopeiae''\n# We jumped into the Eta Cassiopeiae system. Olivia suggested scanning the nearest asteroid belt with the spectrometer. \u2014 ''find Rutile in a belt''\n# The required ore was not found in the previous system. Flying in Ross 318. \u2014 ''arrive in Ross 318''\n# You need to scan the asteroid belt in Ross 318 with a spectrometer. \u2014 ''find Bromellite in a belt''\n# We found the required resource in the Ross 318 asteroid belt. You need to get *Bromelite*. \u2014 ''collect Bromellite''\n# We were attacked by a pirate when we had already mined the ore we needed. We'll have to fight. \u2014 ''Pirate destroyed''\n# We successfully dealt with the pirate. Time to get back to the Stein 2051 system. \u2014 ''arrive in Stein 2051''\n# We flew to the Stein 2051 system. I need to drop off Olivia at the station. \u2014 ''dock at GIF Orbital''\n# I refused to take Olivia with me. I need to find *Bromellite* myself. \u2014 ''collect Bromellite''\n# I managed to get *Bromellite*, but a pirate attacked me. I'll have to fight.\n# Pirates attacked me. Luckily, a bounty hunter came after them. It won't be an easy fight. \u2014 ''Pirate destroyed''\n# I managed to destroy the pirates. Now you need to return to the Stein 2051 system and deliver the ore to the station. \u2014 ''dock at GIF Orbital''\n# I have successfully delivered the *Bromellite* ore to Olivia.\n# I have successfully delivered the *Bromelite* ore to Olivia.\n\n=== Molehole ===\n''\"You know what's the worst thing about my job? This is when you make incredible efforts to counteract the interference of other factions in the affairs of our faction, and some bastard appears behind your back, which leaks all the information to the enemy. This undermines trust from inside... I will not pull the cat's tail and I will say it straight - I need a mercenary with a good reputation to figure out the mole.\"''\n\n* '''Contact:''' Harry Walker at [https://galaxy-genome.github.io/map/?system=Wolf%20359 Manson Orbital] (Wolf 359)\n* '''[[Combat#Karma|Karma]]:''' at least 0\n* '''[[Reputation and ranks|Reputation]]:''' at least 100 with [[Factions#Trade Federation|Trade Federation]]\n* '''Reward:''' 300,000 CR, karma +1\n\n'''Walkthrough'''\n# I agreed to help Trade Federation find the traitor. I need to fly to the *Procyon* system. \u2014 ''arrive in Procyon''\n# You need to get to the *Uma Hub* station in the *Procyon* system. \u2014 ''dock at Uma Hub''\n# We flew up to the station and found our target. Need to select it to get data when he uses the warp.\n# Wait until our target goes to warp.\n# Our target has gone into the warp, presumably into the Wolf 1453 system. \u2014 ''arrive in Wolf 1453''\n# We jumped after the target in the *Wolf 1453* system. You need to fly to the station and see what happens next.\n# The ship we were pursuing has gone into the warp in an unknown direction. Maybe he has jumped into the LHS 1920 system. We need to check it out. \u2014 ''arrive in LHS 1920''\n# We guessed the direction. Our target has jumped into the LHS 1920 system. Now we need to follow him and not attract attention.\n# We were ambushed. It is not yet known what will happen next.\n# While we were talking, help arrived. The chances are now equal. Need to destroy *Ryan Rich* \u2014 ''Ryan Rich destroyed''\n# We have destroyed the target. Now I need to return to the Manson Orbital station in the Wolf 359 system. \u2014 ''dock at Manson Orbital''\n# The goal is reached, and Harry Walker is delivered to the station.\n\n=== Storm clouds are gathering ===\n''\"Hey commander, what's your name? We are currently in dire need of experienced pilots. The confrontation with the Trade Federation intensifies. The time has come for decisive action and I need reliable people. Are you ready to serve for the benefit of the United Empire?\"''\n\n* '''Contact:''' Yuri Gromov at [https://galaxy-genome.github.io/map/?system=58%20Ophiuchi Gromov Platform] (58 Ophiuchi)\n* '''[[Combat#Karma|Karma]]:''' at most 30\n* '''[[Reputation and ranks|Reputation]]:''' at least 100 with [[Factions#United Empire|United Empire]]\n* '''Reward:''' 300,000 CR, karma -2\n* '''Leads to:''' [[Side quests#Where and when|Where and when]]\n\n'''Walkthrough'''\n# I need to fly to Yar Hub station for further instructions. \u2014 ''dock at Yar Hub''\n# I met my companion. Now we need to go to the Barnard's Star system at the Nexus Station. \u2014 ''arrive in Barnard's Star''\n# We have reached the desired system (Barnard's Star). We need to get to the Nexus Station. \u2014 ''dock at Nexus Station''\n# Nikolai has mined Trade Federation ships. You have to wait for what happens next.\n# My partner destroyed the Trade Federation ships. Something went wrong and one charge did not work. You need to leave the system as soon as possible.\n# We are being pursued. You need to destroy the enemy ship. \u2014 ''TF Guard 1 destroyed''\n# The enemies are all coming. Need to do something.\n# Help came to us. We need to return to *Gromov Platform* station in system *58 Ophiuchi*. \u2014 ''dock at Gromov Platform''\n# I brought Nikolai to the station. There will be an our work report.\n\n=== Field testing ===\n''\"I'm sorry to disturb you, but I need an assistant to run my science experiments. I think you should do a great job in this role.\"''\n\n* '''Contact:''' Edmond Anger at [https://galaxy-genome.github.io/map/?system=LP%20104-2 Mark-01 Outpost] (LP 104-2)\n* '''Reward:''' 400,000 CR, karma +1\n* '''Leads to:''' [[Side quests#Together - we are force|Together - we are force]]\n\n'''Walkthrough'''\n# Dr. Edmond Anger turned out to be a rather... talkative man. But in the end, he said that we need to get into *Alpha Circini* system. \u2014 ''arrive in Alpha Circini''\n# Dr. Anger does not stop talking the whole flight. We'll have to endure it... \u2014 ''arrive in Alpha Circini''\n# Prior to the start of the experiment, Dr. Anger said that three beacons needed to be installed in the *Alpha Circini* system. The first one is near the planet *Viva*. \u2014 ''select the planet Viva''\n# The first beacon in the *Alpha Circini* system has been installed. We put the second beacon on Termus. \u2014 ''select the planet Termus''\n# We installed two beacons in the *Alpha Circini* system. We need to put the last beacon on the planet *Klou*. \u2014 ''select the planet Klou''\n# All beacons have been installed. We need to return to the center of the *Alpha Circini* system.\n# Everything is ready to start the experiment. It remains to wait...\n# Released the first drone. We must destroy it. \u2014 ''AI BOT 1 destroyed''\n# Dr. Anger asks about the continuation of the experiment\n# Released the second drone. We must destroy it! \u2014 ''AI BOT 2 destroyed''\n# Dr. Anger asks about the continuation of the experiment\n# Released the third drone. We must destroy it! \u2014 ''AI BOT 3 destroyed''\n# Dr. Anger asks about the continuation of the experiment\n# Released the fourth drone. We must destroy it!\n# During the experiment, a merchant ship flew into the system. We need to protect it from aggressive drones. \u2014 ''AI BOT 4 destroyed''\n\n=== With one eye ===\n''\"I seem to know you. You are exactly who I need. Would you like to participate in the study of something unusual, perhaps even frightening? Not to say that it will be absolutely safe, but certainly exciting.\"''\n\n* '''Contact:''' Dr. Landau at [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] (93 Ceti)\n* '''[[Combat#Karma|Karma]]:''' at least -10\n* '''Reward:''' 250,000 CR, karma +1\n* '''Leads to:''' [[Side quests#Pathfinder|Pathfinder]]\n\n'''Walkthrough'''\n# Dr. Landau speaks in riddles and does not provide any details. All that remains is to do as he said - move to the HIP 28711 system. \u2014 ''arrive in HIP 28711''\n# We have arrived at the HIP 28711 system. We need to move away from the center of the system. Maybe we'll find something.\n# We flew farther from the star, but found nothing. You need to jump to HR 1284. \u2014 ''arrive in HR 1284''\n# And again nothing. The system was empty. The next waypoint is HIP 18033. \u2014 ''arrive in HIP 18033''\n# The new HIP 18033 system also failed to find anything interesting. Let's fly away to the gas giant.\n# An unknown ship appeared before us. Further monitoring is needed. First, let's select this ship.\n# An unknown ship appeared before us. Gotta follow him\n# The alien ship is preparing to jump. We need to scan its warp trail.\n# We've tracked the alien warp trail, but haven't dared to follow it yet. We need to get back to 93 Ceti. \u2014 ''arrive in 93 Ceti''\n# We have received a lot of information about an unknown alien ship. Now Dr. Landau must analyze the data. You need to return to the Frontier Lab station in the 93 Ceti system. \u2014 ''dock at Frontier Lab''\n# I have completed the work that Dr Landau assigned.\n\n=== Pathfinder ===\n''\"I'm glad to see you. Well, have you decided to continue our research activities? I'm ready to take off right now.\"''\n\n* '''Contact:''' Dr. Landau at [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] (93 Ceti)\n* '''Needs first:''' [[Side quests#With one eye|With one eye]]\n* '''[[Combat#Karma|Karma]]:''' at least -10\n* '''Reward:''' 450,000 CR, karma +1\n* '''Leads to:''' [[Side quests#Trap|Trap]]\n\n'''Walkthrough'''\n# There are still many questions. Perhaps a visit to HIP 17892 system will give us more answers.\n# Our path lies in HIP 17892 \u2014 ''arrive in HIP 17892''\n# We've found an alien ship. We need to select it before we lose sight of it.\n# An alien ship is being monitored. We must not lose sight of them.\n# The alien ship prepared to jump. We need to trace its destination.\n# You need to follow the ship to the Electra system. \u2014 ''arrive in Electra''\n# We have moved to the Electra system. You need to follow the alien ship.\n# Automaton has reached the only planet in the Electra system. Ship is no longer moving. You need to go down to the surface of the planet.\n# You need to land on the planet.\n# We need to land on the Hellhound planet in the Electra system. \u2014 ''land on Hellhound''\n# We have landed on the planet Hellhound. Let's try to get some resources.\n# We need to continue excavation on the planet Hellhound\n# We need to continue mining on the planet Hellhound\n# We found something interesting. Unknown alloy. We need to keep mining.\n# We found unknown details on the planet. We need to get back to the ship.\n# We found unknown details on the planet. We need to return to the Frontier Lab station in the 93 Ceti system. Dr. Landau need to research \u200bour find. \u2014 ''dock at Frontier Lab''\n\n=== Trap ===\n''\"Do you think I'm drinking at a bar for no reason? Do you think I just decided to relax? No. I just got stuck. Dead end, you understand? I certainly have ideas how to continue our work, but this idea will seem crazy to you.\"''\n\n* '''Contact:''' Dr. Landau at [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] (93 Ceti)\n* '''Needs first:''' [[Side quests#Pathfinder|Pathfinder]]\n* '''[[Combat#Karma|Karma]]:''' at least -30\n* '''Reward:''' 300,000 CR, karma +2\n* '''Leads to:''' [[Side quests#Dissection|Dissection]]\n\n'''Walkthrough'''\n# Dr. Landau has an idea. He wants to check it in the *Alcyone* system. \u2014 ''arrive in Alcyone''\n# We need to get into the Alcyone system. \u2014 ''arrive in Alcyone''\n# We have moved to the Alcyone system. We need to fly farther from the star to amplify the emitter signal.\n# After turning on the emitter, several Automatons gathered around our ship. Dr. Landau is preparing to establish contact with them. We need to stop the ship.\n# We've made contact with the Automatons. You need to talk with them.\n# We were followed. It was Yuri Gromov. He decided to destroy a group of Automatons. We have no choice but to return to the station in the 93 Ceti system. \u2014 ''arrive in 93 Ceti''\n# We need to get back to the station in the 93 Ceti system. \u2014 ''dock at Frontier Lab''\n# Quest end\n\n=== Dissection ===\n''\"What happened is terrible. Perhaps we won't get another chance to talk to them... Automatons have become aggressive. Now we have to act in less scientific ways.\"''\n\n* '''Contact:''' Dr. Landau at [https://galaxy-genome.github.io/map/?system=93%20Ceti Frontier Lab] (93 Ceti)\n* '''Needs first:''' [[Side quests#Trap|Trap]]\n* '''Reward:''' 450,000 CR\n* '''Leads to:''' [[Side quests#Bug hunters|Bug hunters]]; completing it puts the Gauss Gun in every outfitter\n\n'''Walkthrough'''\n# Prepare for the battle with Automaton. You need to jump into the HIP 21040 system. \u2014 ''arrive in HIP 21040''\n# Need to fly farther from the star\n# We need to stop the ship.\n# We were attacked by an automaton. Need to destroy it \u2014 ''Automaton destroyed''\n# You need to pickup an automaton component \u2014 ''collect AutomatonComponent''\n# You need to return to the station in the 93 Ceti system \u2014 ''dock at Frontier Lab''\n# Dr. Landau developed an improved Gauss cannon.\n\n=== Golden fever ===\n''\"Haven't seen you here before. What fate brought you to us? Were you also promised mountains of gold? There is nothing here, you can not even try. Well, if you just want to talk, you can keep me company. I'm just about to fly out to the neighboring system.\"''\n\n* '''Contact:''' Tommy Clark at [https://galaxy-genome.github.io/map/?system=HR%201163 Farm Station] (HR 1163)\n* '''[[Combat#Karma|Karma]]:''' at least -30\n* '''[[Reputation and ranks|Reputation]]:''' at least 50 with [[Factions#Independent|Independent]]\n* '''Reward:''' 250,000 CR, karma +2\n* '''Leads to:''' [[Side quests#Last flight|Last flight]]\n\n'''Walkthrough'''\n# I agreed to take part in the mining of ore from asteroids. I need to get to the *Mining Platform* station, which is located in the same system. \u2014 ''dock at Mining Platform''\n# I agreed to take part in the mining of ore from asteroids. Our path lies in the *HD 25508* system. \u2014 ''arrive in HD 25508''\n# We have reached the *HD 25508* system. We need to check the first asteroid belt with a spectrometer. \u2014 ''find MethaneClathrate in a belt''\n# We have reached the *HD 25508* system. We need to check the second asteroid belt with a spectrometer. \u2014 ''find Diamonds in a belt''\n# We found diamonds in the second asteroid belt of the *HD 25508* system. Now I need to get a few. \u2014 ''collect Diamonds''\n# There was a skirmish with another miner. You have to wait.\n# Tommy didn't like the presence of another miner. Fortunately, his old friend was nearby. She stopped the verbal altercation. \u2014 ''arrive in HR 1163''\n# We got diamonds. Time to go back to HR 1163 \u2014 ''arrive in HR 1163''\n# We have reached the *HR 1163* system. You need to take Tommy to the Mining Platform. \u2014 ''dock at Mining Platform''\n# I brought Tommy to the station. This is where our paths diverge.\n\n=== Last flight ===\n''\"Are you the pilot that flew with Tommy? Would you like to earn some credits? I need a ship to escort me to the Core systems. Now the situation is very turbulent, it will not hurt to play it safe.\"''\n\n* '''Contact:''' Rimma at [https://galaxy-genome.github.io/map/?system=HR%201163 Mining Platform] (HR 1163)\n* '''Needs first:''' [[Side quests#Golden fever|Golden fever]]\n* '''[[Combat#Karma|Karma]]:''' at least -30\n* '''[[Reputation and ranks|Reputation]]:''' at least 80 with [[Factions#Independent|Independent]]\n* '''Reward:''' 250,000 CR, karma +2\n\n'''Walkthrough'''\n# I agreed to accompany the cargo ship. I need to follow the Rimma route so as not to get lost. The next star to jump is *HD 25508*. \u2014 ''arrive in HD 25508''\n# The next point of our route is *HIP 19364*. \u2014 ''arrive in HIP 19364''\n# The next point of our route is *HIP 19754*. \u2014 ''arrive in HIP 19754''\n# Rimma's ship has a malfunction. You need to return to the *HR 1163* system at the *Mining Platform* station to get the necessary spare parts. \u2014 ''dock at Mining Platform''\n# I reported the ship's breakdown. Now I need to return to the *HIP 19754* system and help repair the ship. \u2014 ''arrive in HIP 19754''\n# Spare parts for the Rimma ship have been delivered. We need to wait what happened next.\n# While we were repairing the ship, we were attacked by our new acquaintances. We'll have to fight. \u2014 ''Mark Ruf destroyed''\n# I helped Rimma. Now our paths diverge.\n\n=== Trifling matter ===\n''\"Hey bro, wanna smoke? Not? Well, that's right. At this station, you still can't get normal stuff. But I know where it is and who will pay well for it. Don't want to earn extra money? It will only be necessary to escort my ship to the place where the cargo will be sold.\"''\n\n* '''Contact:''' Johan Jansson at [https://galaxy-genome.github.io/map/?system=LHS%201827 Megalopolis City] (LHS 1827)\n* '''[[Combat#Karma|Karma]]:''' at most 2\n* '''Reward:''' 350,000 CR, karma -2\n\n'''Walkthrough'''\n# I agreed to guard a ship with illegal cargo. I hope I don't regret this decision. I need to get into *LHS 1920*. \u2014 ''arrive in LHS 1920''\n# Need to get into the *LHS 1920* system \u2014 ''arrive in LHS 1920''\n# We have reached the system *LHS 1920*. Now we need to get to the *Jack Outpost* station. \u2014 ''dock at Jack Outpost''\n# We have taken the load. Now we need to deliver it to the *Ross 318* system. \u2014 ''arrive in Ross 318''\n# I need to escort Johan's ship to *Ziran Station* in the *Ross 318* system.\n# We have sold part of the cargo, now we need it in the *Alpha Centauri* system. \u2014 ''arrive in Alpha Centauri''\n# I need to escort Johan's ship to *Quark Station* in the *Alpha Centauri* system.\n# We've delivered the second part of the cargo, but it looks like we're being watched. I need to jump into any system.\n# We jumped out into the neighboring system. It looks like no one is following us.\n# We were attacked by the guardians of the system. I need to fight them. \u2014 ''Guardian 2 destroyed''\n# We successfully fought the guards. Now we need to get into *LHS 1920* \u2014 ''arrive in LHS 1920''\n# We've reached *LHS 1920*. We need to escort the ship to Jack Outpost.\n# I successfully escorted Johan to the station.\n\n=== Missing convoy ===\n''\"You're out of your element here. First time here? I'm most likely looking at an experienced smuggler... no... maybe you're a battle-hardened bounty hunter? And what am I guessing?! More to the point - several cargo ships were missing, which delivered materials for my workshop. As you understand, I need to find him and as soon as possible. Are you in business?\"''\n\n* '''Contact:''' Dina at [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] (Eta Serpentis)\n* '''Reward:''' 350,000 CR, karma +2\n* '''Leads to:''' [[Side quests#Bug hunters|Bug hunters]]\n\n'''Walkthrough'''\n# I agreed to help find the missing ships. We need to move to LHS 463 system. \u2014 ''arrive in LHS 463''\n# We didn't find anything in the previous system. We move to the next - LHS 470. \u2014 ''arrive in LHS 470''\n# Again, we found nothing. We continue the search and now we fly to the LP 336-6 system. \u2014 ''arrive in LP 336-6''\n# We have moved to LP 336-6 system. You need to get as far away from the star as possible.\n# We found one of the missing ships. Some creatures attacked him. We need to destroy them. \u2014 ''Angler destroyed''\n# We have destroyed an unknown creature. Now you need to help Boris. The necessary spare parts can be obtained at the Huton Orbital station in the Altair system. \u2014 ''dock at Huton Orbital''\n# Spare parts needed for repairs were loaded onto the ship. You need to return to the LP 336-6 system to Boris's ship. \u2014 ''arrive in LP 336-6''\n# Moved to the LP 336-6 system. Now you need to fly away from the star to the distance where there was a battle with an unknown creature.\n# There were no Boris' and Dina's ships in the system. You need to return to Shahta Outpost station in the Eta Serpentis system \u2014 ''dock at Shahta Outpost''\n# Need to take the reward from Dina\n\n=== Relax and steam ===\n''\"Well, why don't they bring Shochu or at least Sake into this hole? I seem to have answered myself... this is a damn hole... Wait a minute! And I know you, gaijin! Are you the smuggler everyone is talking about? Perhaps you are the one who can help me, not for free of course.\"''\n\n* '''Contact:''' Kaito at [https://galaxy-genome.github.io/map/?system=LHS%203595 Kuaku Station] (LHS 3595)\n* '''Reward:''' 150,000 CR\n* '''Leads to:''' [[Side quests#Cloaking|Cloaking]]\n\n'''Walkthrough'''\n# We need to get to the LFT 90 system. \u2014 ''arrive in LFT 90''\n# We need to get to the Shangpin Orbital station on the LFT 90 system. \u2014 ''dock at Shangpin Orbital''\n# Wait for Kaito at the station.\n# We need to fly away from the star at a distance of 3000 light seconds.\n# You need to stop the ship.\n# Wait until Kaito flies up to our ship.\n# The stolen ship was destroyed. You need to jump into the LHS 3595 system. \u2014 ''arrive in LHS 3595''\n# Fly to the Kuaku Station int the LHS 3595 system. \u2014 ''dock at Kuaku Station''\n# Receive a reward from Kaito at Kuaku Station\n\n=== Cloaking ===\n''\"I really hoped to see you here again. Have you considered my offer?\"''\n\n* '''Contact:''' Kaito at [https://galaxy-genome.github.io/map/?system=LHS%203595 Kuaku Station] (LHS 3595)\n* '''Needs first:''' [[Side quests#Relax and steam|Relax and steam]]\n* '''Reward:''' 350,000 CR\n* '''Leads to:''' [[Side quests#Together - we are force|Together - we are force]]\n\n'''Walkthrough'''\n# It is necessary to equip the ship with a mining laser and a cargo rack. Next, we need to jump into the SPOCS 253 system. \u2014 ''arrive in SPOCS 253''\n# We need to get into SPOCS 253 \u2014 ''arrive in SPOCS 253''\n# We need to fly to Huashi Base station in SPOCS 253 system. \u2014 ''dock at Huashi Base''\n# Get a job at the Huashi Base station in SPOCS 253.\n# We need to get 2 units of uranite. According to Kaito, there is uraninite in the asteroid belt in the SPOCS 253 system. \u2014 ''collect Uraninite''\n# You need to help a miner in trouble and destroy the pirate.\n# ''Covex destroyed''\n# You need to get 1 more unit of Uraninite. According to Kaito, there is uranite in the asteroid belt in the SPOCS 253 system. \u2014 ''collect Uraninite''\n# We've mined enough ore. You need to return to the Huashi Base station in the SPOCS 253 system. \u2014 ''dock at Huashi Base''\n# You have to wait until Kaito finishes his business at the station.\n# Everything didn't go according to plan. You need to destroy enemy ships. \u2014 ''Security 2 destroyed''\n# We need to get back to Kuaku Station in the LHS 3595 system.\n\n=== Bug hunters ===\n''\"Attacks are becoming more frequent. One of my ships was badly damaged this week and one... destroyed. Losing money is one thing, but when your friends die... you have to do something...\"''\n\n* '''Contact:''' Dina at [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] (Eta Serpentis)\n* '''Needs first:''' [[Side quests#Dissection|Dissection]], [[Side quests#Missing convoy|Missing convoy]]\n* '''Reward:''' 120 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' [[Side quests#Together - we are force|Together - we are force]]\n\n'''Walkthrough'''\n# Dina is determined to destroy the bugs. The only person who can tell us where to look for the bugs is Dr. Landau. We need to get to the station in the 93 Ceti system.\n# We need to get to the station in the 93 Ceti system. \u2014 ''arrive in 93 Ceti; dock at Frontier Lab''\n# We've got a lead. Need to check the R CrA system \u2014 ''arrive in R CrA''\n# We need to scan planet A2 in the R CrA system \u2014 ''scan the planet R CrA A2''\n# Need to explore all systems in the CrA Nebula \u2014 ''arrive in HIP 93425''\n# We found a large concentration of anglers. Need to get back to the Eta Serpentis system\n# We found a large concentration of anglerfish. Need to get back to the Eta Serpentis system \u2014 ''arrive in Eta Serpentis''\n# You need to return to the Shahta Outpost station in the Eta Serpentis system. \u2014 ''dock at Shahta Outpost''\n\n=== Together - we are force ===\n''\"The situation is as follows: I have two ships. I will pilot one ship and one of my mechanics will be on the other ship. Perhaps my old friend will join us, she has a good ship, but the probability is not great. These forces will obviously not be enough.\"''\n\n* '''Contact:''' Dina at [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] (Eta Serpentis)\n* '''Needs first:''' [[Side quests#Bug hunters|Bug hunters]], [[Side quests#Asteroid belt|Asteroid belt]], [[Side quests#Field testing|Field testing]], [[Side quests#Cloaking|Cloaking]]\n* '''Reward:''' 110 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' [[Side quests#Shoulder to shoulder|Shoulder to shoulder]]\n\n'''Walkthrough'''\n# You need to go to the LP 104-2 system. Perhaps Dr. Anger can help us. \u2014 ''arrive in LP 104-2''\n# You need to get to the Mark-01 Outpost station in the LP 104-2 system \u2014 ''dock at Mark-01 Outpost''\n# Dr. Edmond Anger was not difficult to persuade. Now you need to visit Olivia. She is located at the GIF Orbital station in the Stein 2051 system. \u2014 ''dock at GIF Orbital''\n# We need to find Olivia. Looks like she went to explore space. There is a clue: it is where the lone tauri is hidden behind the fog. \u2014 ''arrive in T Tauri''\n# Now you need to visit Kaito at Kuaku Station in LHS 3595 \u2014 ''dock at Kuaku Station''\n# Kaito didn't agree to help for free. I need to intercept the convoy and steal the particle accelerator in the GD 69 system. \u2014 ''arrive in GD 69''\n# It was not possible to prepare an ambush for the convoy, they were waiting for me. I'll have to fight on the rules of the enemy. I need to destroy the freighter ship. \u2014 ''FREIGHTER destroyed''\n# Give Kaito Particle Accelerator at Kuaku Station in LHS 3595 \u2014 ''dock at Kuaku Station''\n# Kaito agreed to help. You need to return to the Shahta Outpost station in the Eta Serpentis system \u2014 ''dock at Shahta Outpost''\n# I managed to find help for the decisive battle.\n\n=== Shoulder to shoulder ===\n''\"According to my information, the anglers are already moving in our direction. We can't wait any longer, we need to move forward.\"''\n\n* '''Contact:''' Dina at [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Shahta Outpost] (Eta Serpentis)\n* '''Needs first:''' [[Side quests#Together - we are force|Together - we are force]]\n* '''Reward:''' 70 CR (the file names no reward, so the game works one out)\n* '''Leads to:''' [[Side quests#Engineering survey|Engineering survey]]; [[Side quests#Hunter and prey|Hunter and prey]]\n\n'''Walkthrough'''\n# You need to get to the HR 6454 system. \u2014 ''arrive in HR 6454''\n# You need to wait for the rest of the group.\n# You need to destroy all anglers.\n# You have destroyed all anglers. You need to say goodbye to your teammates.\n\n=== Where and when ===\n''\"You proved yourself as a skilled pilot. I want to invite you to perform another very important task. You know the Empire will pay handsomely for the work.\"''\n\n* '''Contact:''' Yuri Gromov at [https://galaxy-genome.github.io/map/?system=58%20Ophiuchi Gromov Platform] (58 Ophiuchi)\n* '''Needs first:''' [[Side quests#Storm clouds are gathering|Storm clouds are gathering]]\n* '''[[Reputation and ranks|Reputation]]:''' at least 100 with [[Factions#United Empire|United Empire]]\n* '''Reward:''' 320,000 CR\n* '''Leads to:''' [[Side quests#Pitfall|Pitfall]]\n\n'''Walkthrough'''\n# We need to get into the Altair system to meet with the informant. \u2014 ''arrive in Altair''\n# We need to fly to the planet Jokoma in the Altair system. \u2014 ''select the planet Jokoma''\n# The informant will arrive after a while. In the meantime, you need to move to the Barnard's Star system. \u2014 ''arrive in Barnard's Star''\n# The informant will arrive after a while. In the meantime, you need to move to the Ross 154 system \u2014 ''arrive in Ross 154''\n# We have arrived at the Ross 154 system. We need to wait a bit.\n# We were attacked by a pirate in the Ross 154 system. We need to destroy him \u2014 ''Pirate destroyed''\n# Need to get back into the Altair system \u2014 ''arrive in Altair''\n# We need to get back to the Gromov Platform Station [System 58 Ophiuchi] \u2014 ''dock at Gromov Platform''\n# We need to report the results to Yuri Grom\n\n=== Pitfall ===\n''\"Nikolay finished preparing for the operation. Soon we need to fly to the gather point with our fleet. There is no more time. Are you in?\"''\n\n* '''Contact:''' Yuri Grom at [https://galaxy-genome.github.io/map/?system=58%20Ophiuchi Gromov Platform] (58 Ophiuchi)\n* '''Needs first:''' [[Side quests#Where and when|Where and when]]\n* '''[[Reputation and ranks|Reputation]]:''' at least 130 with [[Factions#United Empire|United Empire]]\n* '''Reward:''' 450,000 CR\n\n'''Walkthrough'''\n# You need to gather with your fleet in the Wolf 1061 system. \u2014 ''arrive in Wolf 1061''\n# We have teamed up with our fleet and are ready to intercept the convoy. You need to get into the LTT 3572 system. \u2014 ''arrive in LTT 3572''\n# We jumped into the LTT 3572 system. Now we need to wait for the convoy to arrive.\n# It was an ambush. Now we need to take the fight and try to survive. \u2014 ''TF Ship 4 destroyed''\n# We managed to get out of the battle alive, but the losses are very heavy. Now you need to return to the station * Gromov Platform * [system * 58 Ophiuchi *]. \u2014 ''dock at Gromov Platform''\n# We need to report the results to Yuri Gromov\n\n=== Live bait ===\n''\"You have performed well. I have one case that might be of interest to you. I can't guarantee safety, but you're used to danger, aren't you?\"''\n\n* '''Contact:''' Cms Pearson at [https://galaxy-genome.github.io/map/?system=Wolf%20359 Manson Orbital] (Wolf 359)\n* '''Needs first:''' the main story, past its 68th step\n* '''Reward:''' 400,000 CR\n* '''Leads to:''' [[Side quests#The hunt continues|The hunt continues]]\n\n'''Walkthrough'''\n# Need to get to the Alpha Centauri system \u2014 ''arrive in Alpha Centauri''\n# Take the task of delivering cargo to the *Lem Hub* station in the *Alpha Centauri* system\n# It is necessary to provoke a pirate so that he attacks our ship.\n# We need to deliver the cargo to the station in the *Sirius* system.\n# You need to return to the *Manson Orbital* station in the *Wolf 359* system \u2014 ''dock at Manson Orbital''\n\n=== The hunt continues ===\n''\"I already thought you decided n
