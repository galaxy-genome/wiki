ub.io/map/?startype=TauriM Tauri M] || 1,200 || Rare ||  || 3\n|-\n| [https://galaxy-genome.github.io/map/?startype=TauriF Tauri F] || 1,200 || Rare ||  || 3\n|-\n| [https://galaxy-genome.github.io/map/?startype=TauriK Tauri K] || 1,200 || Uncommon ||  || 16\n|-\n| [https://galaxy-genome.github.io/map/?startype=S-Star S - Star] || 1,200 || Uncommon ||  || 3\n|-\n| [https://galaxy-genome.github.io/map/?startype=TauriG Tauri G] || 1,200 || Uncommon ||  || 10\n|-\n| [https://galaxy-genome.github.io/map/?startype=Y-BrownDwarf Y - Brown Dwarf] || 1,200 || Uncommon ||  || 0\n|-\n| [https://galaxy-genome.github.io/map/?startype=A-BlueWhite A - Blue White] || 1,200 || Common || yes || 838\n|-\n| [https://galaxy-genome.github.io/map/?startype=G-WhiteYellow G - White Yellow] || 1,200 || Common || yes || 740\n|-\n| [https://galaxy-genome.github.io/map/?startype=T-BrownDwarf T - BrownDwarf] || 1,200 || Common ||  || 315\n|-\n| [https://galaxy-genome.github.io/map/?startype=F-White F - White] || 1,200 || Common || yes || 1,729\n|-\n| [https://galaxy-genome.github.io/map/?startype=L-BrownDwarf L - Brown Dwarf] || 1,200 || Common ||  || 454\n|-\n| [https://galaxy-genome.github.io/map/?startype=K-YellowOrange K - Yellow Orange] || 1,200 || Common || yes || 906\n|-\n| [https://galaxy-genome.github.io/map/?startype=M-RedDwarf M - Red Dwarf] || 1,200 || Common || yes || 2,334\n|}\n\n== Nebulae ==\n'''16''' nebulae are placed around the galaxy. They are landmarks rather\nthan destinations in themselves, though some are worth travelling to.\n\n{| class=\"fandom-table sortable\"\n! Nebula !! Location !! Size (ly)\n|-\n| Pleiades || -77, -344 \u00b7 353 ly || 80\n|-\n| Helix || -225, 307 \u00b7 380 ly || 16\n|-\n| CrA || 1, 388 \u00b7 388 ly || 40\n|-\n| Hind || -37, -558 \u00b7 560 ly || 20\n|-\n| IC 6404 || 60, 570 \u00b7 573 ly || 40\n|-\n| LBN 623 || -500, -333 \u00b7 600 ly || 50\n|-\n| Eskimo || 227, -698 \u00b7 734 ly || 10\n|-\n| Witch Head || 360, -718 \u00b7 803 ly || 70\n|-\n| Pencil || 816, -44 \u00b7 817 ly || 25\n|-\n| California || -338, -927 \u00b7 987 ly || 80\n|-\n| Orion || 610, -1,090 \u00b7 1,249 ly || 50\n|-\n| Barnards Loop || 600, -1,200 \u00b7 1,342 ly || 280\n|-\n| Flame || 625, -1,198 \u00b7 1,351 ly || 17\n|-\n| Horsehead || 700, -1,300 \u00b7 1,476 ly || 50\n|-\n| Messier 78 || 659, -1,434 \u00b7 1,578 ly || 40\n|-\n| Eagle || -2,036, 6,687 \u00b7 6,990 ly || 45\n|}\n\n== Um, what? How did you do that? ==\nThe counts on this page are not estimates or samples. Every star in the galaxy\nwas counted.\n\nThat is possible because '''the galaxy is not stored anywhere'''. Nobody sat down\nand placed 72 million stars, and the game does not ship a list of them. What it\nships is a '''recipe''': a picture of where space is crowded, and a set of rules\nfor turning any position in that picture into the stars that live there.\n\nWhen you warp somewhere, the game is not looking the system up. It is working it\nout, from scratch, on the spot. Fly away and it forgets; fly back and it works\nout the same answer again.\n\nThat is why a system you have never visited already has fixed contents, and why\nyour galaxy and every other player's are identical. There is nothing to\ndisagree about. Same recipe, same result, every time, for everyone.\n\n=== So it can be run outside the game ===\nA recipe can be followed by anyone who has it. The rules were read out of the\ngame and rewritten so they could be run without playing, and then simply pointed\nat every part of the galaxy in turn, writing down what came back.\n\n{| class=\"fandom-table\"\n!  !! \n|-\n| Places in the galaxy that hold stars || 2,950,361\n|-\n| Stars worked out and identified || 98,615,614\n|-\n| Distinct kinds of star found || 90\n|}\n\nSo when this page says there are 3 Wolf Rayet\nStars, that is not a guess from a sample. Something looked at all\n98,624,412 stars, and 3 of them were Wolf\nRayet Stars.\n\nThe catalogue's own 8,798 stars are added on top of the\n98,615,614 the generator places, because a few kinds exist only there. The\n[[Spoilers|Preon star]] is the extreme case: the generator will never make one,\nand the galaxy holds exactly one.\n\nOne star is not in that count. The '''Preon star''' is never generated anywhere;\nthere is exactly one in the galaxy and it was placed by hand. It is the single\nmost valuable thing you can discover, and it is on the [[Spoilers]] page.\n\n=== The part that is easy to get wrong ===\nFollowing the recipe slightly wrong does not produce an error. It produces a\ndifferent galaxy, one that looks completely believable and is completely wrong.\n\nSo the numbers here were checked against real systems in the real game until they\nagreed, rather than trusted because the program ran without complaining.\n\n=== What this cannot tell you ===\nIt knows what the game '''makes'''. It does not know what '''you''' have done:\nwhat you have already scanned, what a mission will pay you today, or anything\nelse that lives in your save. Where a number here disagrees with your game, your\ngame is right.\n\n=== Thank you, SKV Games ===\nNone of this would be here without '''SKV Games''', who own Galaxy Genome and who\nwere asked, plainly, whether this could be built and published \u2014 and said yes.\n\nThey did not have to. A studio is well within its rights to say no to having its\ngame taken apart and written up by strangers, and plenty would. Instead the\nanswer was immediate and generous, and the result is a reference far more\ndetailed than a fan site has any business having.\n\nSo if this wiki saves you an evening of guesswork, the credit for that belongs\nwith the people who made the game and then let us do this with it. Go buy their\ngame. It is good, and it is the reason any of us are here.\n", "Spoilers": "\n{{spoiler}}\nEverything on this page is something the game means you to find for yourself.\nNothing else on this wiki gives any of it away.\n\n== Engineers ==\nEngineers raise a module past the grade any shop will sell you, and they are paid\nin [[Crafting#Craft materials|craft materials]] rather than credits.\n\nThere are five of them, each holding '''two postings''': one in the core systems\nand one out in deep space. The same engineer offers the same work at either.\n\n{| class=\"fandom-table sortable\"\n! Engineer !! Posting !! Station !! System !! Location\n|-\n| Dina || core || Shahta Outpost || [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Eta Serpentis] || -28, 54 \u00b7 61 ly\n|-\n| Dina || deep space || Avanpost Hub || [https://galaxy-genome.github.io/map/?system=Vega%206 Vega 6] || -2,222, -3,966 \u00b7 4,546 ly\n|-\n| Dr Landau || core || Frontier Lab || [https://galaxy-genome.github.io/map/?system=93%20Ceti 93 Ceti] || -44, -388 \u00b7 390 ly\n|-\n| Dr Landau || deep space || Element Orbital || [https://galaxy-genome.github.io/map/?system=Octanur Octanur] || -2,229, -3,965 \u00b7 4,549 ly\n|-\n| Edmond Anger || core || Mark-01 Outpost || [https://galaxy-genome.github.io/map/?system=LP%20104-2 LP 104-2] || 34, 20 \u00b7 39 ly\n|-\n| Edmond Anger || deep space || Ziyou Base || [https://galaxy-genome.github.io/map/?system=Z-635 Z-635] || -2,252, -3,955 \u00b7 4,551 ly\n|-\n| Kaito || core || Kuaku Station || [https://galaxy-genome.github.io/map/?system=LHS%203595 LHS 3595] || -22, -4 \u00b7 22 ly\n|-\n| Kaito || deep space || Huaisi Starport || [https://galaxy-genome.github.io/map/?system=Hauron Hauron] || -2,233, -3,990 \u00b7 4,572 ly\n|-\n| Olivia Hopper || core || GIF Orbital || [https://galaxy-genome.github.io/map/?system=Stein%202051 Stein 2051] || -9, -15 \u00b7 17 ly\n|-\n| Olivia Hopper || deep space || Galar Orbital || [https://galaxy-genome.github.io/map/?system=Galar Galar] || -2,203, -4,008 \u00b7 4,574 ly\n|}\n\n=== What each one can raise ===\n{| class=\"fandom-table sortable\"\n! Engineer !! Module !! Max level\n|-\n| Dina || Cannon || 3\n|-\n| Dina || Fragment Cannon || 2\n|-\n| Dina || Fragment Cannon || 3\n|-\n| Dina || Missiles || 3\n|-\n| Dina || Torpedoes || 3\n|-\n| Dr Landau || Gauss Gun || 3\n|-\n| Dr Landau || Sensors || 3\n|-\n| Dr Landau || Shields || 5\n|-\n| Dr Landau || Warp Drive || 5\n|-\n| Edmond Anger || Life Support || 5\n|-\n| Edmond Anger || Power Distributor || 3\n|-\n| Edmond Anger || Power Plant || 2\n|-\n| Edmond Anger || Sensors || 5\n|-\n| Kaito || Beam Laser || 3\n|-\n| Kaito || Energy Lance || 3\n|-\n| Kaito || Plasma Cannon || 3\n|-\n| Kaito || Pulse Laser || 3\n|-\n| Kaito || Railgun || 3\n|-\n| Olivia Hopper || Life Support || 3\n|-\n| Olivia Hopper || Power Plant || 3\n|-\n| Olivia Hopper || Thrusters || 5\n|}\n\n== Landmarks ==\nNamed places the game marks on the galaxy map. Most sit far outside settled space\nand are a destination in their own right.\n\n{| class=\"fandom-table sortable\"\n! Landmark !! Location\n|-\n| Abyss || -29,893, 32,934 \u00b7 44,477 ly\n|-\n| Beagle point || -145, 68,096 \u00b7 68,096 ly\n|-\n| Bright Hub || -336, 3,954 \u00b7 3,968 ly\n|-\n| Dark Object || -4,608, -16,070 \u00b7 16,718 ly\n|-\n| Distant Colony || -9,530, 19,808 \u00b7 21,981 ly\n|-\n| Foundation || -24,039, -975 \u00b7 24,059 ly\n|-\n| Mining Corp || -341, -964 \u00b7 1,023 ly\n|-\n| Research Station || -1,710, 13,665 \u00b7 13,772 ly\n|-\n| The Void || -2,236, -3,998 \u00b7 4,581 ly\n|-\n| Traveler's Hub || -1,806, -2,595 \u00b7 3,162 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=Sagittarius%20A%2A Sagittarius A*] || 25, 25,899 \u00b7 25,899 ly\n|}\n\n'''[https://galaxy-genome.github.io/map/?system=Sagittarius%20A%2A Sagittarius A*]''' is the one the game does\nnot mark, and the only one that changes what you can buy. See below.\n\n== Expeditions ==\n'''13''' of the [[The galaxy#Nebulae|nebulae]] are expedition targets.\n\n{| class=\"fandom-table sortable\"\n! Nebula !! Location !! Size (ly)\n|-\n| Hind || -37, -558 \u00b7 560 ly || 20\n|-\n| IC 6404 || 60, 570 \u00b7 573 ly || 40\n|-\n| LBN 623 || -500, -333 \u00b7 600 ly || 50\n|-\n| Eskimo || 227, -698 \u00b7 734 ly || 10\n|-\n| Witch Head || 360, -718 \u00b7 803 ly || 70\n|-\n| Pencil || 816, -44 \u00b7 817 ly || 25\n|-\n| California || -338, -927 \u00b7 987 ly || 80\n|-\n| Orion || 610, -1,090 \u00b7 1,249 ly || 50\n|-\n| Barnards Loop || 600, -1,200 \u00b7 1,342 ly || 280\n|-\n| Flame || 625, -1,198 \u00b7 1,351 ly || 17\n|-\n| Horsehead || 700, -1,300 \u00b7 1,476 ly || 50\n|-\n| Messier 78 || 659, -1,434 \u00b7 1,578 ly || 40\n|-\n| Eagle || -2,036, 6,687 \u00b7 6,990 ly || 45\n|}\n\n== Anomalies ==\n{| class=\"fandom-table sortable\"\n! System !! Type !! Location\n|-\n| [https://galaxy-genome.github.io/map/?system=Caph Caph] || Storm || -48, -26 \u00b7 55 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=Wolf%20851 Wolf 851] || Storm || -58, 89 \u00b7 106 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=93%20Ceti 93 Ceti] || Storm || -44, -388 \u00b7 390 ly\n|}\n\n\n== The Warp Drive Booster ==\nThe '''Warp Drive Booster''' is the only module that extends jump\nrange beyond what a drive alone gives you, and no station sells it until you have\ndone one of two things.\n\nThe first is to reach '''Arena level 60''' in [[Combat|ranked battles]].\n\nThe second is to '''visit [https://galaxy-genome.github.io/map/?system=Sagittarius%20A%2A Sagittarius A*]''',\nthe black hole at the centre of the galaxy, 25, 25,899 \u00b7 25,899 ly from Sol.\nArriving once is enough; the game records the visit and every outfitter in the\ngalaxy stocks the Booster from then on.\n\nThat is the same trip as the '''Massive and Dangerous'''\n[[Achievements|achievement]], so the pilgrimage pays twice.\n\nIt is worth seeing what that means. The module that makes long-range travel\npossible is locked behind either a combat grind or a journey you need long-range\ntravel to survive. Going the long way is a genuine expedition: fuel, scooping,\nand a route through empty sky, and the reward is that every trip after it is\nshorter.\n\n== The Preon star ==\nExactly '''one''' [[The galaxy#Star types|Preon star]] exists. The\ngenerator never places one anywhere in the galaxy; this one was put there by\nhand.\n\nIt is worth '''13,000,000 CR''' to discover, which is more than seven times the\nnext most valuable object in the game, and finding it unlocks the achievement\n'''It Exists'''.\n\n{| class=\"fandom-table sortable\"\n! System !! Star !! Scan value (CR) !! Location\n|-\n| [https://galaxy-genome.github.io/map/?system=Object%2042 Object 42] || Preon star || 13,000,000 || -4,608, -16,094 \u00b7 22,000 ly\n|}\n\nThere is a [[Stations|station]] in the same system, so it is a place you can\nactually stop rather than a flyby.\n\n== Exploration exceptions ==\nTwo objects can be scanned within 300 ly of Sol, where every other\nsystem reads ''Explored: yes'' and pays nothing: '''Tetra''' and\n'''R CrA A2'''. See [[Exploration#You cannot scan near Sol|Exploration]].\n", "Crafting": "\nCrafting is a loop with three steps, and it is the only way to push a module past\nthe grade any shop will sell you.\n\n# Collect '''craft materials'''.\n# Carry them to an '''engineer'''.\n# Spend them on a '''module upgrade'''.\n\n'''Credits are not the constraint anywhere in that loop.''' Materials are, and\nthey are the one thing in the game you cannot buy, cannot sell, and cannot trade.\nA module upgrade is the '''only''' thing that consumes them.\n\nThat one-way door is worth saying plainly, because it sets the whole economy of\nthe thing: a material you pick up has exactly one possible future. There is no\nopportunity cost in collecting one and no market price to weigh it against.\n\n== Landing ==\nLanding needs a '''[https://galaxy-genome.github.io/map/?module=PlanetaryVehicle Planetary Vehicle]''' aboard. You take it down and\ndrive, which is a game of its own.\n\nIt is '''not''' a way to earn credits. The four landable planet types are among\nthe least valuable things to [[Exploration|scan]], so a landing run and a scanning\nrun are different trips with different targets.\n\n{| class=\"fandom-table sortable\"\n! Planet type !! Scan value (CR) !! Surface difficulty\n|-\n| [[Exploration#What each object pays|Metal Rich Planet]] || 90,000 || 0.6\n|-\n| [[Exploration#What each object pays|High Metal Planet]] || 58,000 || 0.6\n|-\n| [[Exploration#What each object pays|Rock Planet]] || 1,700 || 0.2 - 0.6 (random)\n|-\n| [[Exploration#What each object pays|Ice Planet]] || 1,500 || 0.6\n|}\n\n'''Surface difficulty''' is how rough the terrain is, and gravity rises with the\nplanet's size. A large Metal Rich Planet with broken ground is a slow, careful\ndrive; a small Rock Planet at 0.2 is an easy one. Neither changes what you find.\n\n\n== Craft materials ==\n'''32''' materials exist in three categories. '''Elements''' come out of\nthe ground, '''Materials''' are manufactured parts stripped from ships, and\n'''Data''' is pulled off things you scan or destroy.\n\n{| class=\"fandom-table sortable\"\n! Material !! Category\n|-\n| Automaton data || Data\n|-\n| Shield Analysis Data || Data\n|-\n| Special firmware || Data\n|-\n| System Guardians Data || Data\n|-\n| Warp Trail Analysis Data || Data\n|-\n| Cadmium || Element\n|-\n| Carbon || Element\n|-\n| Chromium || Element\n|-\n| Germanium || Element\n|-\n| Iron || Element\n|-\n| Manganese || Element\n|-\n| Nickel || Element\n|-\n| Phosphorus || Element\n|-\n| Polonium || Element\n|-\n| Selenium || Element\n|-\n| Sulphur || Element\n|-\n| Tellurium || Element\n|-\n| Vanadium || Element\n|-\n| Automaton component || Material\n|-\n| Chemical manipulators || Material\n|-\n| Chemical processors || Material\n|-\n| Conductive ceramics || Material\n|-\n| Conductive polymers || Material\n|-\n| Focusing Crystals || Material\n|-\n| Fragment of sensors || Material\n|-\n| Heat diffuser || Material\n|-\n| Heat exchanger || Material\n|-\n| Microresistors || Material\n|-\n| Military alloys || Material\n|-\n| Nano capacitors || Material\n|-\n| Shield emitters || Material\n|-\n| Weapon parts || Material\n|}\n\n== Where materials come from ==\n'''Landing is not the only source, and for half the list it is not a source at\nall.''' Manufactured parts and data come off ships, and several drop from\n[[Events and Tasks|star system events]] that cost you nothing but a detour.\n\n{| class=\"fandom-table sortable\"\n! What you do !! What you get !! See\n|-\n| Drive on a planet's surface || any of that planet's three, weighted || [[Crafting#Landing|Landing]]\n|-\n| Destroy a pirate || Weapon parts, Heat exchanger || [[Combat]]\n|-\n| Destroy a law enforcement ship || Shield emitters, Nano capacitors || [[Combat#Karma|Combat]]\n|-\n| Destroy an Automaton || Automaton component || [[Combat]]\n|-\n| Destroy a Hyperion || Heat diffuser, Conductive polymers || [[Ships]]\n|-\n| Destroy a Nemesis || Chemical manipulators, Conductive polymers || [[Ships]]\n|-\n| Destroy any other ship || Fragment of sensors, Microresistors || [[Combat]]\n|-\n| Search a shipwreck || Focusing Crystals, Chemical manipulators || [[Events and Tasks|Events]]\n|-\n| Help an NPC fight pirates || Military alloys, Focusing Crystals || [[Events and Tasks|Events]]\n|-\n| Help an NPC fight Anglers || Heat diffuser, Conductive polymers || [[Events and Tasks|Events]]\n|-\n| Give an NPC fuel || Fragment of sensors, Chemical processors || [[Events and Tasks|Events]]\n|-\n| Give an NPC spare parts || Conductive ceramics, Microresistors || [[Events and Tasks|Events]]\n|-\n| Clear pirate activity from a system || Special firmware || [[Events and Tasks|Events]]\n|-\n| Complete the Daily Task || x3 each of two random materials || [[Events and Tasks|Tasks]]\n|}\n\nTwo things fall out of that table.\n\n'''Combat feeds crafting as directly as landing does.''' Six of the fourteen rows\nare a ship you destroyed, and a few materials have no other source at all: an\n'''Automaton component''' only ever comes off an Automaton.\n\n'''Helping people pays in materials.''' Refuelling a stranded pilot or handing\nover spare parts costs you a little cargo and returns a material you would\notherwise have to go looking for. The events that ask are the cheapest crafting\nincome in the game.\n\n=== Which of a planet's three you get ===\nEvery planet carries '''three''' materials, fixed when the system was generated,\nso a planet that gave you what you needed will give it again. Which of the three\ncomes up on any given dig is '''weighted, and weighted against you''': the draw\nuses each material's own commonness, so a planet holding Iron alongside Polonium\nyields Iron five times as often.\n\nThat is why a specific rare element is a grind rather than a trip. The planet is\nnot the hard part; the draw is.\n\n== Engineers ==\nEngineers do the actual upgrading, and each one only works on certain modules.\nWho they are and where they are posted is a discovery the game wants you to make,\nso it lives on the [[Spoilers#Engineers|spoilers page]].\n\n== What you can upgrade ==\nEach upgrade costs a specific set of materials.\n\n{| class=\"fandom-table sortable\"\n! Module !! Upgrade !! Category !! Materials\n|-\n| [[Combat#Weapons|Beam Laser]] || Emitter power || Weapon || HeatExchanger, Manganese, ChemicalProcessors, Chromium, FocusCrystals, Phosphorus, Iron, WeaponParts\n|-\n| [[Combat#Weapons|Beam Laser]] || Aimed shooting || Weapon || Nickel, WeaponParts, Chromium, NanoCapacitors, Cadmium, ConductiveCeramics, Iron\n|-\n| [[Combat#Weapons|Cannon]] || Charging mechanism || Weapon || Iron, WeaponParts, MilitaryAlloys, Nickel, HeatExchanger\n|-\n| [[Combat#Weapons|Cannon]] || Armor-piercing || Weapon || Nickel, WeaponParts, Iron, MilitaryAlloys\n|-\n| [[Combat#Weapons|Cannon]] || Aimed shooting || Weapon || Iron, WeaponParts, Nickel, MilitaryAlloys, FocusCrystals, Vanadium, AutomatonComponent, Selenium\n|-\n| [[Combat#Weapons|Energy Lance]] || Emitter power || Weapon || HeatExchanger, Manganese, ChemicalProcessors, Chromium, FocusCrystals, Phosphorus, Iron, WeaponParts\n|-\n| Fragment Cannon || Shutter durability || Weapon || Iron, WeaponParts, Carbon, HeatExchanger, MilitaryAlloys, Nickel\n|-\n| Gauss Gun || Emitter power || Weapon || HeatExchanger, Nickel, Carbon, ConductiveCeramics, AutomatonComponent, Vanadium\n|-\n| [https://galaxy-genome.github.io/map/?module=LifeSupport Life Support] || Lightweight || Utility || MicroResistors, Phosphorus, Manganese, NanoCapacitors, ChemicalProcessors, Cadmium, HeatExchanger, Carbon, ChemicalManipulators\n|-\n| [[Combat#Weapons|Missiles]] || Explosive power || Weapon || Nickel, WeaponParts, Iron, MilitaryAlloys, HeatExchanger, Vanadium\n|-\n| [[Combat#Weapons|Missiles]] || Charging mechanism || Weapon || Iron, WeaponParts, MicroResistors, Nickel, Carbon, LegacyFirmware\n|-\n| [[Combat#Weapons|Plasma Cannon]] || Peltier elements || Weapon || HeatExchanger, Nickel, Chromium, ConductiveCeramics, HeatDispersionPlate, Vanadium\n|-\n| [[Combat#Weapons|Plasma Cannon]] || Emitter power || Weapon || Manganese, WeaponParts, NanoCapacitors, Vanadium, FocusCrystals, Tellurium\n|-\n| [https://galaxy-genome.github.io/map/?module=PowerDistributor Power Distributor] || Bandwidth to Cannons || Power || NanoCapacitors, Sulphur, MicroResistors, Nickel, HeatExchanger, Iron, Chromium, MilitaryAlloys, ChemicalManipulators, Polonium\n|-\n| [https://galaxy-genome.github.io/map/?module=PowerDistributor Power Distributor] || Bandwidth to Engines || Power || HeatExchanger, Sulphur, Manganese, NanoCapacitors, Chromium, MicroResistors, HeatDispersionPlate, Selenium, ConductivePolymers, Tellurium\n|-\n| [https://galaxy-genome.github.io/map/?module=PowerDistributor Power Distributor] || Bandwidth to System || Power || HeatExchanger, Phosphorus, Manganese, SensorFragment, ShieldsAnalysis, ChemicalProcessors, ShieldEmitters, Vanadium\n|-\n| [https://galaxy-genome.github.io/map/?module=PowerPlant Power Plant] || Power Generation || Power || HeatExchanger, Sulphur, Manganese, NanoCapacitors, Chromium, MicroResistors, ConductiveCeramics, Selenium, ConductivePolymers, Tellurium\n|-\n| [[Combat#Weapons|Pulse Laser]] || Emitter power || Weapon || HeatExchanger, Manganese, ChemicalProcessors, Chromium, FocusCrystals, Phosphorus, Iron, WeaponParts\n|-\n| [[Combat#Weapons|Pulse Laser]] || Capacitor capacitance || Weapon || ChemicalProcessors, Sulphur, HeatExchanger, Manganese, ConductiveCeramics, Vanadium, Iron, WeaponParts\n|-\n| [[Combat#Weapons|Railgun]] || Length of rails || Weapon || Iron, WeaponParts, HeatExchanger, Nickel, MilitaryAlloys, Tellurium\n|-\n| [[Combat#Weapons|Railgun]] || Conductive elements || Weapon || MicroResistors, Nickel, NanoCapacitors, Vanadium, HeatDispersionPlate, Polonium, Iron, WeaponParts\n|-\n| [https://galaxy-genome.github.io/map/?module=Sensors Sensors] || Lightweight || Utility || Phosphorus, SensorFragment, Manganese, NanoCapacitors, ChemicalProcessors, ChemicalManipulators, Vanadium\n|-\n| [https://galaxy-genome.github.io/map/?module=Sensors Sensors] || Long Range || Utility || Iron, SensorFragment, Nickel, NanoCapacitors, Phosphorus, FocusCrystals, Vanadium, Germanium, LegacyFirmware\n|-\n| [[Combat#Shields, hull and heat|Shields]] || Low Power || Defence || MicroResistors, Nickel, Iron, ShieldsAnalysis, HeatExchanger, Sulphur, ChemicalProcessors, Germanium, Polonium, SecurityFirmware\n|-\n| [[Combat#Shields, hull and heat|Shields]] || Rapid Charge || Defence || NanoCapacitors, Sulphur, ChemicalProcessors, Nickel, Iron, ShieldsAnalysis, Chromium, MilitaryAlloys, Polonium, ShieldEmitters\n|-\n| [https://galaxy-genome.github.io/map/?module=Thrusters Thrusters] || Clean Modification || Propulsion || NanoCapacitors, Sulphur, HeatExchanger, Iron, FocusCrystals, Nickel, ConductiveCeramics, Vanadium, Carbon, HeatDispersionPlate\n|-\n| [https://galaxy-genome.github.io/map/?module=Thrusters Thrusters] || Dirty Modification || Propulsion || HeatExchanger, Sulphur, MicroResistors, Nickel, Chromium, ConductiveCeramics, ChemicalManipulators, Phosphorus, AutomatonData, Selenium\n|-\n| [[Combat#Weapons|Torpedoes]] || Explosive power || Weapon || Nickel, WeaponParts, Iron, MilitaryAlloys, HeatExchanger, Vanadium\n|-\n| [[Combat#Weapons|Torpedoes]] || Charging mechanism || Weapon || Iron, WeaponParts, MicroResistors, Nickel, Carbon, LegacyFirmware\n|-\n| [[Navigation#If you cannot reach somewhere, upgrade the drive|Warp Drive]] || Jump Range || Propulsion || Sulphur, WarpAnalysis, MicroResistors, Phosphorus, Chromium, LegacyFirmware, FocusCrystals, Vanadium, AutomatonComponent, Selenium\n|-\n| [[Navigation#If you cannot reach somewhere, upgrade the drive|Warp Drive]] || Faster Boot || Propulsion || Sulphur, WarpAnalysis, ChemicalProcessors, Chromium, LegacyFirmware, Phosphorus, HeatExchanger, Vanadium, HeatDispersionPlate, Selenium\n|}\n", "Navigation": "\nGetting somewhere has two halves that work nothing like each other: '''warp\njumps''' between stars, and '''flying''' once you arrive.\n\n== Jumping between stars ==\nPlot a route on the galaxy map and jump one star at a time. The heads-up display\ncounts down '''JUMPS LEFT''' and names the '''NEXT STAR''', so a long trip is a\nsequence of identical short actions.\n\nA jump refuses to happen for five specific reasons, and the game names each:\n\n{| class=\"fandom-table\"\n! Message !! What it means\n|-\n| ''Error: Make a route'' || No destination plotted\n|-\n| ''Error: Stop the ship'' || You must be stationary to jump\n|-\n| ''WARP ERROR: TURN OFF CANNONS'' || Weapons must be stowed\n|-\n| ''Error: Not enough fuel'' || The tank will not cover the jump\n|-\n| ''No power: warp drive'' || The drive has no power allocated\n|}\n\n== If you cannot reach somewhere, upgrade the drive ==\n'''Jump range is the single thing that opens the galaxy up.''' If a system is out\nof reach, the answer is almost never a different route, it is a better\n'''[https://galaxy-genome.github.io/map/?module=DeepSpaceDrive Warp Drive]'''.\n\nRange is not a fixed number. It falls as your ship gets heavier, so a full hold\njumps shorter than an empty one, and every module you bolt on costs a little\ndistance. This is why '''D-grade modules''' are worth fitting nearly everywhere:\nthey are the lightest, and the weight you save comes back as range. See\n[[Modules#Grades|Modules]].\n\nTwo things extend range beyond the drive itself:\n* '''Warp Drive Booster''' \u2014 ''\"used to boost the output of Warp Drive, increasing jump distance.\"'' '''No shop stocks it until you unlock it''', and then every shop does. See [[Modules#Modules you cannot simply buy|Modules]]\n* A bigger '''[[Modules#Fuel tanks and scooping|Fuel Tank]]''' does not add range, but it adds how many jumps you can make before you must find a scoopable star. See [[Modules#Fuel tanks and scooping|fuel]].\n\nThe [[Galaxy Genome Map]] plans routes at whatever jump range you give it, so you\ncan see exactly what a drive upgrade would buy before you pay for it.\n\n== Warp supercharge, and the button you have to press ==\nA few things multiply your jump range outright. The ship shop calls it\n'''''Build-In Warp Supercharge''''' and prints the multiplier next to it.\n\n{| class=\"fandom-table\"\n! Source !! Multiplier !! How you get it\n|-\n| Prometheus || x3 || Built into the ship\n|-\n| Nemesis || x5 || Built into the ship\n|-\n| Neutron star || x5 || Scoop fuel from one, about six seconds\n|}\n\nThey do not stack. If you are flying a supercharged ship and scooping a neutron\nstar, you get the '''higher''' of the two, not the product.\n\n=== ROUTE only supercharges the first jump ===\n'''This is the part that makes people think their expensive ship is broken.'''\nThe two route buttons plot differently:\n\n* '''ROUTE''' plots the whole trip for you, but it only applies the multiplier to the '''first jump'''. Every leg after that is planned at your plain jump range, so a supercharged ship routes exactly like an ordinary one.\n* '''ADD''' appends one hop to the route, and it applies the multiplier to '''every''' hop.\n\nSo the way to actually use a supercharge across a long trip is to centre each\nstar in turn and press '''ADD''', building the route by hand. It is more taps,\nand it is the difference between a Nemesis jumping its range and\njumping five times its range.\n\n=== It is a fuel discount too ===\nThe multiplier does not only extend the reach. Fuel for a supercharged jump is\ncharged as though the distance were divided by the multiplier, so a x3 jump\ncosts the fuel of a jump a third as long. Over a crossing of the galaxy that\nmatters more than the range does.\n\n=== The cost ===\nEvery jump longer than your unassisted range takes '''1% off your warp drive's\nintegrity''', supercharged or not. A drive at low integrity jumps shorter, so a\nlong supercharged run degrades the very thing making it possible. Repair at any\nstation with an outfitter.\n\nScooping a neutron star until the drive takes damage is also what unlocks the\n'''Risky Refueling''' [[Achievements|achievement]].\n\n== Warp gates ==\nWarp gates are one-off links between two distant systems, and there are only\n'''3'''. Each is found broken and must\nbe repaired before it will carry you.\n\nA gate is a '''shortcut, not a key'''. Everywhere a gate reaches can be flown to\nthe long way with enough range and fuel; what it saves is the fuel and the hours.\nThe game marks a gate on the system map with its own indicator and tells you\nwhich system it connects to, so the only thing worth documenting is where that\nfar end actually is.\n\n{| class=\"fandom-table sortable\"\n! Gate !! From !! To !! Repair cost (CR) !! Repair item\n|-\n| [https://galaxy-genome.github.io/map/?from=Wolf%201462&to=Isar Wolf 1462 \u2192 Isar] || -32, 83 \u00b7 89 ly || -9,530, 19,808 \u00b7 21,981 ly || 30,000,000 || Zentarks Stone\n|-\n| [https://galaxy-genome.github.io/map/?from=LP%20157-32&to=Merida LP 157-32 \u2192 Merida] || -27, -75 \u00b7 80 ly || -2,226, -3,958 \u00b7 4,541 ly || 30,000,000 || Zentarks Stone\n|-\n| [https://galaxy-genome.github.io/map/?from=PPM%2041187&to=Terminus PPM 41187 \u2192 Terminus] || -74, -24 \u00b7 78 ly || -24,039, -975 \u00b7 24,059 ly || 30,000,000 || Zentarks Stone\n|}\n\nAll three cost the same and want the same item. The map routes through a gate\nautomatically whenever one shortens the trip.\n\n== Flying inside a system ==\nOnce you arrive, distances are measured in '''light seconds''' and your speed in\n'''ls/s'''. Planets are further apart than they look.\n\n'''[https://galaxy-genome.github.io/map/?module=Thrusters Thrusters]''' are ''\"responsible for acceleration and angular rate\nof spacecraft\"'' \u2014 how fast you get up to speed and how quickly you turn, not how\nfast you end up going.\n\n'''Autopilot''' flies you to whatever you have selected. It is the right way to\ncross a system while you do something else, and it is how you approach a station\nwithout overshooting.\n\n== Boost ==\nThe boost button, the triangle in the flight interface, is an afterburner. It\nfails in exactly two situations, and the game tells you which:\n\n* ''\"BOOST: not enough energy\"'' \u2014 your engines do not have the power. Power is divided between engines, systems and weapons, so boost competes with your shields and guns for the same budget.\n* ''\"BOOST: too high speed\"'' \u2014 you are already going too fast for it to add anything.\n\nThat first one is the one to remember: if boost keeps failing, the fix is the\npower distribution, not the engines.\n== Geeking out: what mass actually costs you ==\nMass is the price of every module, and it is not charged evenly. Three different\nthings depend on it, in three different ways.\n\n=== Jump range falls in direct proportion ===\nRange is divided by your total mass:\n\n range \u221d drive's optimal mass \u00f7 (ship + modules + cargo)\n\nStraight inverse proportion. '''Twice the mass, half the range.''' Nothing else\nin the game punishes weight this hard, which is why a warp drive is the one place\nto spend grade on performance and everywhere else to spend it on being light.\n\nNote what is inside that bracket: '''cargo counts'''. A full hold really does\njump shorter than an empty one, so the last leg home is always your longest.\n\n=== Speed falls by the square root ===\nTop speed uses a square root instead:\n\n top speed \u221d \u221a(thrusters' optimal mass \u00f7 (ship + cargo + fuel))\n\nSo the same weight that halves your range costs you only '''29%''' of your speed.\n\n{| class=\"fandom-table\"\n! Mass !! Jump range !! Top speed !! Acceleration and turn rate\n|-\n| 1.00x || 100% || 100% || 100%\n|-\n| 1.25x || 80% || 89% || 89%\n|-\n| 1.50x || 67% || 82% || 82%\n|-\n| 2.00x || 50% || 71% || 71%\n|-\n| 3.00x || 33% || 58% || 58%\n|}\n\n=== Handling is just top speed, renamed ===\nThis is the part worth knowing. '''Acceleration''' and '''turn rate''' are not\nseparate statistics: the game derives both from top speed.\n\n acceleration = top speed \u00f7 4.5 turn rate    = top speed \u00f7 10\n\nSo one number governs how fast you go, how fast you get there, and how quickly\nyou come about. Anything that raises top speed makes the ship handle better in\nevery respect, and '''[https://galaxy-genome.github.io/map/?module=Thrusters Thrusters]''' are the module that sets it.\n\n=== Putting it together ===\n* For '''exploring''', mass is everything. Fit D grades, carry no cargo you do not need, and put the savings into the drive.\n* For '''fighting''', mass is cheap. You lose a little speed and handling, and [[Combat#Shields, hull and heat|shields]] are unaffected by what you load.\n* For '''hauling''', the cargo is the point, and the cost is range on the loaded leg. Plan the route for the full hold, not the empty one.\n\n", "Achievements": "\n'''28''' achievements, awarded through Google Play. The game\nnever lists what they want, so these are the conditions the game actually checks.\n\n== Getting around ==\n{| class=\"fandom-table\"\n! Achievement !! What earns it\n|-\n| Flight to Distant Stars || Make a single jump of more than 30 ly, which needs a [[Navigation|warp drive]] to match\n|-\n| Risky Refueling || Scoop fuel from a neutron star until your warp drive is damaged, and survive. See [[Navigation#Warp supercharge, and the button you have to press|supercharge]]\n|-\n| New World || Reach the sector beyond the [https://galaxy-genome.github.io/map/?system=Merida Merida] [[Navigation#Warp gates|gate]], at -2,226, -3,958 \u00b7 4,541 ly\n|-\n| Massive and Dangerous || Visit [https://galaxy-genome.github.io/map/?system=Sagittarius%20A%2A Sagittarius A*], the black hole at the galactic centre, at 25, 25,899 \u00b7 25,899 ly\n|}\n\n== Missions and money ==\n{| class=\"fandom-table\"\n! Achievement !! What earns it\n|-\n| New Spaceship || Buy a [[Ships|ship]]\n|-\n| Collector || Own six [[Ships|ships]] at once\n|-\n| Heavy Cargo || [[Trading|Trade]] more than 500 tons in one transaction\n|-\n| Courier || Complete a [[Missions|Courier]] job\n|-\n| The Transporter || Complete a [[Missions|Deliver]] job paying 1,000,000 CR or more\n|-\n| An Experienced Miner || Complete a [[Mining|Mining]] contract paying 1,300,000 CR or more\n|}\n\n== Discovery ==\n{| class=\"fandom-table\"\n! Achievement !! What earns it\n|-\n| Almost Like Home || Discover an [[Exploration#What each object pays|Earth Like Planet]]\n|-\n| There Could Be Life Here || Discover an [[Exploration#What each object pays|Ammonia Planet]]\n|-\n| Amazing Star || Discover a [[The galaxy#Star types|Quark star]]\n|-\n| It Exists || Discover a [[The galaxy#Star types|Preon star]]\n|}\n\n== Combat ==\n{| class=\"fandom-table\"\n! Achievement !! What earns it\n|-\n| Bounty Hunter || Complete a [[Combat#Pirates|pirate hunt]]\n|-\n| There is Safety in Numbers || Complete a [[Combat#Pirates|pirate hunt]] at Allied [[Reputation and ranks|standing]]\n|-\n| Lawbreaker || Destroy a law enforcement ship, which costs you [[Combat#Karma|karma]]\n|-\n| Alien Tech || Destroy an '''Automaton''' you have a bounty on\n|-\n| Swarm Hunter || Destroy the '''Angler-Mother''', which posts a 600,000 CR bounty at [https://galaxy-genome.github.io/map/?system=Eta%20Serpentis Eta Serpentis] when it dies\n|}\n\n== Standing ==\nReaching '''Admiral''' with a faction earns one each, and topping a\n[[Reputation and ranks|rank]] track earns another.\n\n{| class=\"fandom-table\"\n! Achievement !! What earns it\n|-\n| Great Explorer || Reach the top [[Reputation and ranks|exploration rank]]\n|-\n| Galactic Merchant || Reach the top [[Reputation and ranks|trading rank]]\n|-\n| Excellent Fighter || Pass the top combat threshold, measured on trading\n|-\n| Absolute Prime || Top all three [[Reputation and ranks|rank]] tracks at once\n|-\n| The Empire Appreciates You || Reach Admiral with the [[Factions#United Empire|United Empire]]\n|-\n| Federation Elite || Reach Admiral with the [[Factions#Trade Federation|Trade Federation]]\n|-\n| Pillar of the Alliance || Reach Admiral with the [[Factions#Interstellar Alliance|Interstellar Alliance]]\n|-\n| Complete Independence || Reach Admiral with the [[Factions#Independent|Independent]]s\n|-\n| See You Again || Reach a point in the story. See [[Spoilers]]\n|}\n\n== One that is not what it looks like ==\n'''Excellent Fighter''' is checked against your '''trading''' total rather than\nyour combat total. It is earned by selling, not shooting.\n\n'''It Exists''' wants a '''Preon star'''. There is exactly one in the galaxy.\nSee [[Spoilers]].\n", "Events and Tasks": "\nTwo systems hand you work you did not go looking for. The '''Daily Task''' is one\njob a day that everyone in the game shares, and '''star system events''' are\nencounters that appear while you fly. Both pay credits, and both are a steady\nsource of [[Crafting#Where materials come from|craft materials]].\n\n== The Daily Task ==\nOne task per day, shown under '''Daily Task''', with a countdown to the reset.\n\n'''Everyone gets the same task.''' It is generated from the calendar date alone,\nwith nothing about you in it, so the task you have is the task every other player\nhas that day. It resets at '''00:00 UTC''', not at midnight where you live.\n\n'''It needs the internet.''' The clock comes from a time server rather than your\ndevice, which is why you will see ''\"No internet connection...\"'' where the task\nshould be. You cannot do a Daily Task offline, and you cannot reroll one by\nchanging your phone's clock.\n\n=== The eleven tasks ===\nHow many you must do, and what it pays, both scale with your\n[[Reputation and ranks|rank]] in whichever track the task belongs to. A higher\nrank means a longer task and a bigger payout.\n\n{| class=\"fandom-table sortable\"\n! Task !! What it asks !! How many !! Credits\n|-\n| Pirates Hunt || Destroy pirates || 1 + combat level || 80,000 each, plus 10,000 x 2^level\n|-\n| Guards Hunter || Destroy law enforcement ships || 1 + combat level / 2 || 200,000 each\n|-\n| Rare Cannon User || Kill with a named damage type || 1 + combat level || 80,000 each\n|-\n| System Explorer || Discover new systems || 4 + 3 x exploration level || 30,000 each\n|-\n| Planet Explorer || Scan planets || 4 + 3 x exploration level || 30,000 each\n|-\n| Mining Rush || Mine a named ore || 1 + trade level || 300,000 each\n|-\n| Illegal Trader || Move Slaves or Narcotics || 10 + 3 x 2^trade level || 300,000 plus 3,000 each\n|-\n| Courier Work || Complete courier jobs || rank-derived || 300,000 each\n|-\n| Module Upgrader || Install module upgrades || rank-derived || 300,000 each\n|-\n| Tourist Worker || Carry passengers || 1 + exploration level / 2 || 300,000\n|-\n| NPC Helper || Help pilots in distress || 1 + level / 2 || 200,000\n|}\n\nSome tasks name a specific target when they are generated: '''Mining Rush''' asks\nfor [[Mining|Diamonds, Monazite or Painite]], '''Illegal Trader''' for Slaves or\nNarcotics, and '''Rare Cannon User''' for a damage type you must kill with. Those\nare fixed for the day, so check before you fit out.\n\n=== Every task also pays materials ===\nOn top of the credits, finishing the Daily Task pays '''x3 of two random\nmaterials''' \u2014 one manufactured part or data fragment, one element. That holds\nwhichever task you drew, which makes the daily the most reliable\n[[Crafting|crafting]] income in the game and the only one that does not depend on\nfinding the right planet or the right ship to kill.\n\n== Star system events ==\nEvents spawn inside a system as you fly through it. Each type has a place it can\nappear \u2014 '''deep space''', '''settled space''', anywhere, or a fixed location \u2014\nso what you meet depends on where you are. Deep space, where nobody goes, has its\nown encounters.\n\n{| class=\"fandom-table sortable\"\n! Event !! Where !! What it is\n|-\n| Shipwreck || Anywhere || Salvage a derelict\n|-\n| Pirate Activity || Settled space || Pirates holding a system; clearing it pays reputation\n|-\n| Pirate vs NPC || Settled space || A trader under attack asks for help\n|-\n| Pirate vs Law || Settled space || A firefight you may join on either side\n|-\n| Pirate Station Attack || Fixed location || Pirates assaulting a station\n|-\n| Pirate Mission || Fixed location || A job offered by pirates\n|-\n| NPC Refueling || Anywhere || A pilot out of fuel\n|-\n| NPC Repair || Anywhere || A pilot needing spare parts\n|-\n| Angler vs NPC || Deep space || A pilot attacked by Anglers\n|-\n| Zentarks vs Angler || Deep space || Two factions fighting each other\n|-\n| NPC Kill Contract || Fixed location || A named target\n|-\n| Intimidate || Fixed location || A pilot who can be pressured\n|-\n| Caravan || Fixed location || A convoy under escort\n|-\n| Arena || Fixed location || Ranked battles\n|-\n| Alien Bugs Spawn || Fixed location || A swarm\n|}\n\n=== Most of them are a choice ===\nEvents arrive as someone talking to you, and you answer. A stranded pilot asks\nfor fuel; a pirate tells you to move along; a trader under attack asks for help.\nYou can always decline, and declining costs nothing.\n\n'''Pirate vs Law is the one with a real decision in it.''' Both sides pitch you\nwhile the fight is already running \u2014 ''\"I will help the guards\"'',\n''\"I will help the pirates\"'', ''\"This is not my war\"'' \u2014 and the side you pick\nmoves your standing accordingly.\n\n=== What clearing pirate activity pays ===\n'''Pirate Activity''' is the event worth going out of your way for. Clear one and\nyou get '''6 to 9 reputation''', '''1 Special firmware''' and '''+2\n[[Combat#Karma|karma]]'''.\n\nThe reputation is smarter than it looks. Rather than dumping it on the first\nstation in the system, the game '''looks for a station whose standing is not\nalready near the cap''' and pays it there. So clearing pirates works as a way to\nlift a station you have neglected, which is exactly the station gating the\n[[Ships|ship]] or [[Side quests|side quest]] you want.\n\n=== Helping pays in materials ===\nFive event types drop [[Crafting#Where materials come from|craft materials]] for\ndoing nothing more dangerous than stopping:\n\n* '''Give an NPC fuel''' \u2014 Fragment of sensors, Chemical processors\n* '''Give an NPC spare parts''' \u2014 Conductive ceramics, Microresistors\n* '''Search a shipwreck''' \u2014 Focusing Crystals, Chemical manipulators\n* '''Help an NPC against pirates''' \u2014 Military alloys, Focusing Crystals\n* '''Help an NPC against Anglers''' \u2014 Heat diffuser, Conductive polymers\n\nThose eight materials are otherwise a hunt. If you are short one for an\n[[Crafting#What you can upgrade|upgrade]], answering distress calls is the\ncheapest way to find it.\n"};

// Articles store the published map URL, because that is what gets pushed to
// Fandom. Served from localhost, the preview points at a local map instead.
const MAP_PUB = "https://galaxy-genome.github.io/map/";
const MAP_DEV = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? location.protocol + "//" + location.hostname + ":8791/" : null;
const mapUrl = u => MAP_DEV && u.startsWith(MAP_PUB) ? MAP_DEV + u.slice(MAP_PUB.length) : u;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const slug = t => encodeURIComponent(t.replace(/ /g,"_"));
const unslug = h => decodeURIComponent(h.replace(/_/g," "));

// A deliberately small wikitext subset: what these articles actually use, so the
// preview and what gets pushed to Fandom stay the same text.
function inline(s){
  s = esc(s);
  s = s.replace(/&lt;code&gt;(.+?)&lt;\/code&gt;/g, "<code>$1</code>");
  s = s.replace(/'''(.+?)'''/g, "<b>$1</b>").replace(/''(.+?)''/g, "<i>$1</i>");
  const wikilink = (target, label) => {
    const [page, sec] = target.split("#");
    const href = "#" + slug(page) + (sec ? "#" + slug(sec) : "");
    return `<a href="${href}" class="${ARTICLES[page] ? "" : "new"}">${label}</a>`;
  };
  // A file is an image on Fandom and nothing here: the preview holds no media,
  // and its options are not text to print.
  s = s.replace(/\[\[(File|Image|Category):[^\]]*\]\]/g, "");
  s = s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (m,t,l) => wikilink(t, l));
  s = s.replace(/\[\[([^\]]+)\]\]/g, (m,t) => wikilink(t, t));
  s = s.replace(/\[(https?:\/\/\S+) ([^\]]+)\]/g,
        (m, u, l) => `<a href="${mapUrl(u)}" target="_blank" rel="noopener">${l}</a>`);
  return s;
}

// The preview button: a ship's Overview, or a module's purchase screen.
const ZOOM_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>';
const zoomButton = (name, cls = "", kind = "ship") =>
  (kind === "ship" ? OVERVIEWS : MODULES)[name]
    ? `<button class="shipzoom ${cls}" data-kind="${kind}" data-ship="${esc(name)}" aria-label="Preview: ${esc(name)}" title="Preview">${ZOOM_SVG}</button>`
    : "";

// The shop's Ships list, card for card (ShipBuyPanel.as): icon beside name and
// purpose, cost, then hull, speed and steering. A faction ship is purple. On
// Fandom the same wikitext stays a plain table.
function shipGrid(head, rows){
  const col = h => head.indexOf(h);
  const [ic, nm, pu, co, hu, sp, st, fa] = ["Icon", "Ship", "Purpose", "Cost (CR)",
    "Hull", "Speed", "Steering", "Faction"].map(col);
  return '<div class="shipgrid">' + rows.map(r => {
    const img = (r[ic].match(/\[\[File:([^|\]]+)/) || [])[1];
    const gated = r[fa] ? " gated" : "";
    return `<div class="shipcard${gated}" data-ship="${esc(r[nm])}">` +
      zoomButton(r[nm], "oncard") +
      (img ? `<img src="img/${encodeURIComponent(img)}" alt="">` : "") +
      `<div class="shiptext"><div class="shipname">${inline(r[nm])} [${esc(r[pu])}]</div>` +
      `<div class="shipcost">Cost: ${esc(r[co])} CR</div>` +
      `<div class="shipstats"><span>Hull</span><span>Speed</span><span>Steering</span>` +
      `<span>${esc(r[hu])}</span><span>${esc(r[sp])}</span><span>${esc(r[st])}</span></div></div></div>`;
  }).join("") + "</div>";
}

// Hovering a ship card shows the shop's Ship Overview screen for it.
const ovTip = document.createElement("div");
ovTip.className = "shipov"; ovTip.hidden = true;
ovTip.innerHTML = '<div class="ovpanel" role="dialog" aria-modal="true" aria-label="Ship Overview">' +
  '<button class="ovclose" aria-label="Close">×</button><div class="ovbody"></div></div>';
document.body.append(ovTip);
function overviewHtml(o){
  const up = s => esc(String(s)).toUpperCase();
  const bar = t => `<div class="ovbar">${up(t)}</div>`;
  const pair = (cls, heads, vals) => `<div class="ovrow">${heads.map(h => `<div class="${cls}">${up(h)}</div>`).join("")}</div>` +
    `<div class="ovrow">${vals.map(v => `<div class="ovval">${up(v)}</div>`).join("")}</div>`;
  const rows = (heads, list) => `<div class="ovtab"><div class="ovrow">${heads.map(h => `<div class="ovwhite">${up(h)}</div>`).join("")}</div>` +
    list.map(r => `<div class="ovrow ovsmall">${r.map(c => `<div>${up(c)}</div>`).join("")}</div>`).join("") + "</div>";

  return `<div class="ovhead">Ship Overview</div><div class="ovcols"><div>` +
    bar(o.name) + `<div class="ovship"><img src="img/${encodeURIComponent(o.icon)}" alt="" onerror="this.remove()"></div>` +
    pair("ovgold", ["Price", "Purpose"], [o.sold ? o.price.toLocaleString("en-US") + " CR" : "Not for sale", o.purpose]) +
    (o.ability ? `<div class="ovplain"><span>Unique abilities</span><span>${esc(o.ability)}</span></div>` : "") +
    (o.faction ? bar("Required influence") + pair("ovgold", ["Faction", "Influence"], [o.faction, o.influence]) : "") +
    bar("Ship specs") + pair("ovwhite", o.specs.slice(0, 3).map(s => s[0]), o.specs.slice(0, 3).map(s => s[1])) +
    pair("ovwhite", o.specs.slice(3).map(s => s[0]), o.specs.slice(3).map(s => s[1])) +
    `</div><div>` + bar("Core modules") + rows(["Module", "Class", "Default"], o.core) +
    bar("Optional modules") + rows(["Type", "Class", "Default"], o.optional) + "</div></div>";
}
// The module purchase screen with nothing fitted to compare (BuySellModuleScreen.as).
function moduleHtml(o){
  const up = s => esc(String(s)).toUpperCase();
  const row = (cells, cls) => `<div class="ovrow ${cls || ""}">${cells.map(c => `<div>${up(c)}</div>`).join("")}</div>`;
  return `<div class="ovcols ovnohead"><div>` +
    `<div class="ovbar">${up(o.title)}</div>` +
    `<div class="ovship"><img class="ovicon" src="img/${encodeURIComponent(o.icon)}" alt="" onerror="this.remove()"></div>` +
    `<div class="ovdesc">${esc(o.description)}</div></div><div>` +
    `<div class="ovrow"><div></div><div class="ovgold">NEW MODULE</div></div>` +
    o.rows.map(r => row(r, "ovmid")).join("") +
    `<div class="ovbar">PARAMETERS</div>` +
    `<div class="ovrow"><div class="ovwhite">PROPERTY</div><div class="ovwhite">VALUE</div></div>` +
    o.params.map(p => row(p, "ovparam")).join("") + "</div></div>";
}

document.addEventListener("click", e => {
  const btn = e.target.closest?.(".shipzoom");
  if (btn){
    const ship = btn.dataset.kind === "ship";
    const o = (ship ? OVERVIEWS : MODULES)[btn.dataset.ship];
    if (!o) return;
    ovTip.querySelector(".ovbody").innerHTML = ship ? overviewHtml(o) : moduleHtml(o);
    ovTip.hidden = false; ovTip.querySelector(".ovpanel").scrollTop = 0;
    ovTip.querySelector(".ovclose").focus();
    return;
  }
  if (!ovTip.hidden && (e.target === ovTip || e.target.closest(".ovclose"))) ovTip.hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") ovTip.hidden = true; });

function render(wt){
  const out = [];
  const lines = wt.replace(/\r/g,"").split("\n");
  let i = 0, para = [], list = null;
  const flushPara = () => { if (para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const flushList = () => { if (list){ out.push(`</${list}>`); list=null; } };
  const flush = () => { flushPara(); flushList(); };
  while (i < lines.length){
    const ln = lines[i];
    // template
    let m = ln.match(/^\{\{(\w+)(?:\|([^}]*))?\}\}\s*$/i);
    if (m){ flush();
      const kind = m[1].toLowerCase();
      if (kind === "spoiler")
        out.push('<div class="spoilerbox"><b>Spoiler warning.</b> ' +
          (m[2] ? inline(m[2]) : "This page describes things the game intends you to discover for yourself.") +
          "</div>");
      else
        out.push(`<div class="stub"><b>Stub.</b> ${m[2] ? inline(m[2]) : "This article is incomplete."}</div>`);
      i++; continue; }
    // preformatted, as MediaWiki's <pre>
    if (ln.trim() === "<pre>"){
      flush();
      const body = [];
      for (i++; i < lines.length && lines[i].trim() !== "</pre>"; i++) body.push(lines[i]);
      i++;
      out.push(`<pre class="code">${esc(body.join("\n"))}</pre>`);
      continue;
    }
    // a picture on a line of its own: [[File:Name.png|thumb|Caption]]
    m = ln.match(/^\[\[(?:File|Image):([^|\]]+)((?:\|[^\]]*)*)\]\]\s*$/);
    if (m){ flush();
      const opts = m[2].split("|").slice(1);
      const caption = opts.filter(o => !/^(thumb|frame|left|right|center|\d+px)$/.test(o)).pop() || "";
      out.push(`<figure class="thumb"><img src="img/${encodeURIComponent(m[1])}" alt="">` +
               (caption ? `<figcaption>${inline(caption)}</figcaption>` : "") + "</figure>");
      i++; continue; }
    // table
    if (ln.startsWith("{|")){
      flush();
      const cls = (ln.match(/class="([^"]+)"/) || [,""])[1];
      const rows = []; let head = [];
      i++;
      let cur = null;
      for (; i < lines.length && !lines[i].startsWith("|}"); i++){
        const t = lines[i];
        if (t.startsWith("!")){ head = t.slice(1).split("!!").map(s => s.trim()); }
        else if (t.startsWith("|-")){ if (cur) rows.push(cur); cur = []; }
        else if (t.startsWith("|")){
          const cells = t.slice(1).split("||").map(s => s.trim());
          (cur = cur || []).push(...cells);
        }
      }
      if (cur) rows.push(cur);
      i++;
      if (/\bshipgrid\b/.test(cls)){ out.push(shipGrid(head, rows)); continue; }
      out.push('<div class="tablewrap"><table class="' + cls + '">' +
        (head.length ? "<thead><tr>" + head.map(h => `<th>${inline(h)}</th>`).join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(r => "<tr>" + r.map((c, k) => `<td>${inline(c)}` +
          (head[k] === "Ship" ? zoomButton(c, "intable")
           : head[k] === "Weapon" || head[k] === "Module" ? zoomButton(c.replace(/^\[\[[^|\]]*\|(.+)\]\]$/, "$1").replace(/^\[\S+ (.+)\]$/, "$1"), "intable", "module") : "") +
          "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    // heading
    m = ln.match(/^(={2,4})\s*(.+?)\s*\1\s*$/);
    if (m){ flush(); const lv = m[1].length;
      out.push(`<h${lv} id="${slug(m[2])}">${inline(m[2])}</h${lv}>`); i++; continue; }
    // list
    m = ln.match(/^([*#])\s*(.+)$/);
    if (m){
      flushPara();
      const want = m[1] === "*" ? "ul" : "ol";
      if (list !== want){ flushList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline(m[2])}</li>`); i++; continue;
    }
    if (!ln.trim()){ flush(); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flush();
  return out.join("\n");
}

function sortable(){
  for (const tb of document.querySelectorAll("table.sortable")){
    [...tb.tBodies[0].rows].forEach((r, n) => r.dataset.order = n);
    tb.querySelectorAll("th").forEach((th, idx) => {
      th.onclick = () => {
        const dir = th.classList.contains("asc") ? -1 : 1;
        tb.querySelectorAll("th").forEach(o => o.classList.remove("asc","desc"));
        th.classList.add(dir === 1 ? "asc" : "desc");
        const body = tb.tBodies[0];
        const num = s => { const v = +s.replace(/[,%]/g,"").replace(/[^\d.\-].*$/,""); return isNaN(v) ? null : v; };
        [...body.rows].sort((a,b) => {
          // Ship tables are built in the shop's order, cheapest first, so Ship
          // sorts by that rather than by name.
          if (th.textContent.trim() === "Ship") return (a.dataset.order - b.dataset.order) * dir;
          const x = a.cells[idx]?.textContent.trim() ?? "", y = b.cells[idx]?.textContent.trim() ?? "";
          const nx = num(x), ny = num(y);
          if (nx !== null && ny !== null) return (nx - ny) * dir;
          return x.localeCompare(y) * dir;
        }).forEach(r => body.append(r));
      };
    });
  }
}

const navEl = document.getElementById("nav");
const listEl = document.getElementById("navList");
function buildNav(){
  listEl.innerHTML = "";

  for (const [group, items] of NAV){
    const h = document.createElement("h3"); h.textContent = group; listEl.append(h);
    for (const t of items){
      const a = document.createElement("a");
      a.href = "#" + slug(t); a.textContent = t; a.dataset.t = t;
      listEl.append(a);
    }
  }
  // The same credit the map carries, in the same words.
  listEl.insertAdjacentHTML("beforeend", `<footer class="credit">
    <p>Galaxy Genome is made by SKV Games.</p>
    <p class="stores"><span>Get the game</span>
      <a href="https://play.google.com/store/apps/details?id=com.skvgames.GalaxyGenome"
         target="_blank" rel="noopener noreferrer">Google Play</a>
      <a href="https://apps.apple.com/us/app/galaxy-genome/id1566857517"
         target="_blank" rel="noopener noreferrer">App Store</a></p>
    <p class="fine">Not affiliated with or endorsed by the developer. All game data
      belongs to SKV Games.</p>
  </footer>`);
}

let current = null;
function show(title){
  if (!ARTICLES[title]) title = "Galaxy Genome Wiki";
  current = title;
  document.getElementById("title").textContent = title;
  document.getElementById("body").innerHTML = render(ARTICLES[title]);
  document.getElementById("src").value = ARTICLES[title].trim();
  document.querySelectorAll("nav.side a").forEach(a =>
    a.classList.toggle("on", a.dataset.t === title));
  const n = ARTICLES[title].trim().length;
  document.getElementById("foot").textContent =
    `${n.toLocaleString()} bytes of wikitext · ${Object.keys(ARTICLES).length} articles in this build`;
  sortable();
  scrollTo(0, 0);
}

document.getElementById("btnSrc").onclick = () => {
  document.body.classList.add("srcmode");
  document.getElementById("btnSrc").classList.add("on");
  document.getElementById("btnRead").classList.remove("on");
};
document.getElementById("btnRead").onclick = () => {
  ARTICLES[current] = document.getElementById("src").value;
  document.body.classList.remove("srcmode");
  document.getElementById("btnRead").classList.add("on");
  document.getElementById("btnSrc").classList.remove("on");
  show(current);
};
document.getElementById("btnCopy").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("src").value);
  const b = document.getElementById("btnCopy"); const t = b.textContent;
  b.textContent = "Copied"; setTimeout(() => b.textContent = t, 1200);
};

const q = document.getElementById("q");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  document.querySelectorAll("nav.side a").forEach(a =>
    a.style.display = !s || a.dataset.t.toLowerCase().includes(s) ? "" : "none");
  document.querySelectorAll("nav.side h3").forEach(h => {
    let n = h.nextElementSibling, any = false;
    while (n && n.tagName === "A"){ if (n.style.display !== "none") any = true; n = n.nextElementSibling; }
    h.style.display = any ? "" : "none";
  });
});

function route(){
  const [page, sec] = location.hash.slice(1).split("#");
  show(unslug(page));
  if (sec){
    const el = document.getElementById(sec);
    if (el) el.scrollIntoView({block: "start"});
  }
}
addEventListener("hashchange", route);

// The article list, when it lives behind the button: picking an article or
// pressing Escape puts it away.
{
  const burger = document.getElementById("burger");
  const setOpen = open => {
    document.body.classList.toggle("navopen", open);
    burger.setAttribute("aria-expanded", String(open));
  };
  burger.onclick = () => setOpen(!document.body.classList.contains("navopen"));
  navEl.addEventListener("click", e => { if (e.target.closest("a[data-t]")) setOpen(false); });
  addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
}
document.getElementById("mapLink").href = mapUrl(MAP_PUB);
buildNav();
location.hash ? route() : show("Galaxy Genome Wiki");
