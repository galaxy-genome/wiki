<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Genome Wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0f1216; --rail:#151a21; --card:#1b2129; --edge:#2a323d;
  --ink:#d9e2ec; --dim:#8b9aab; --accent:#3fc4dd; --accent2:#ffab3d;
  --link:#5bd0e6; --head:#ffffff;
  --ui:"Rubik",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.65}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a.new{color:#e06c6c}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
  height:52px;padding:0 18px;background:var(--rail);border-bottom:1px solid var(--edge)}
.topbar .logo{color:var(--head);text-decoration:none;font-family:var(--ui);font-weight:700;letter-spacing:.02em;
  color:var(--head);font-size:16px;white-space:nowrap}
.topbar .logo span{color:var(--accent)}
.topbar input{margin-left:auto;width:min(320px,40vw);padding:7px 11px;border-radius:16px;
  border:1px solid var(--edge);background:#0d1116;color:var(--ink);font:inherit;font-size:13px}
.topbar input:focus{outline:none;border-color:var(--accent)}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;
  max-width:1500px;margin:0 auto}
nav.side{border-right:1px solid var(--edge);padding:18px 0 60px;min-height:calc(100vh - 52px)}
nav.side h3{margin:18px 18px 6px;font-family:var(--ui);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
nav.side a{display:block;padding:6px 18px;color:var(--ink);font-size:14px;
  border-left:3px solid transparent}
nav.side a:hover{background:#1a2029;text-decoration:none}
nav.side .credit{margin:24px 18px 0;padding-top:12px;border-top:1px solid var(--edge);
  font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;color:var(--dim)}
nav.side .credit p{margin:0 0 6px}
nav.side .credit .stores{display:grid;grid-template-columns:auto 1fr;column-gap:8px;
  row-gap:2px;align-items:baseline;justify-items:start}
nav.side .credit .stores>span{grid-row:span 2}
nav.side .credit a{display:inline;padding:0;border:0;font-size:inherit;color:var(--link)}
nav.side .credit a:hover{background:none;text-decoration:underline}
nav.side .credit .fine{margin-bottom:0;opacity:.8}
nav.side a.on{border-left-color:var(--accent);background:#1a2029;color:var(--accent)}

main{padding:26px 34px 90px;min-width:0}
.hero{border-bottom:1px solid var(--edge);padding-bottom:10px;margin-bottom:20px;
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-family:var(--ui);font-size:30px;font-weight:600;color:var(--head);margin:0}
.hero .tools{margin-left:auto;display:flex;gap:8px}
.hero button{background:var(--card);border:1px solid var(--edge);color:var(--dim);
  font:inherit;font-size:12px;padding:5px 11px;border-radius:3px;cursor:pointer}
.hero button:hover{border-color:var(--accent);color:var(--accent)}
.hero button.on{border-color:var(--accent);color:var(--accent)}

article h2{font-family:var(--ui);font-size:22px;font-weight:600;color:var(--head);
  border-bottom:1px solid var(--edge);padding-bottom:5px;margin:30px 0 12px}
article h3{font-family:var(--ui);font-size:17px;font-weight:600;color:var(--head);margin:22px 0 8px}
article p{margin:0 0 13px;max-width:74ch}
article ul,article ol{max-width:74ch;padding-left:22px;margin:0 0 13px}
article li{margin:3px 0}
article b,article strong{color:#fff;font-weight:600}

.tablewrap{overflow-x:auto;margin:0 0 18px}
table.fandom-table{border-collapse:collapse;font-size:13.5px;min-width:100%}
table.fandom-table th{background:#232c36;color:#fff;font-family:var(--ui);font-weight:600;
  text-align:left;padding:8px 12px;border:1px solid var(--edge);white-space:nowrap}
table.fandom-table.sortable th{cursor:pointer;user-select:none}
table.fandom-table.sortable th::after{content:"";opacity:.4;font-size:10px}
table.fandom-table.sortable th.asc::after{content:" \25B2"}
table.fandom-table.sortable th.desc::after{content:" \25BC"}
table.fandom-table td{padding:6px 12px;border:1px solid var(--edge);
  font-variant-numeric:tabular-nums}
table.fandom-table tr:nth-child(even) td{background:#171d24}

.spoilerbox{background:#2a1620;border-left:3px solid #e0567f;color:#f0c2d0;
  padding:10px 14px;margin:0 0 18px;font-size:13.5px;max-width:74ch}
.spoilerbox b{color:#ff7fa3}
.stub{background:#241f14;border-left:3px solid var(--accent2);color:#e5cfa4;
  padding:9px 13px;margin:16px 0;font-size:13.5px;max-width:74ch}
.stub b{color:var(--accent2)}

.src{display:none;width:100%;min-height:62vh;background:#0b0e12;color:#c8d4e0;
  border:1px solid var(--edge);border-radius:3px;padding:14px;
  font:13px/1.55 ui-monospace,Menlo,monospace;resize:vertical;white-space:pre}
body.srcmode .src{display:block}
body.srcmode article{display:none}

footer.wf{border-top:1px solid var(--edge);margin-top:40px;padding-top:14px;
  color:var(--dim);font-size:12px}
.burger{display:none;width:34px;height:30px;flex:none;place-items:center;padding:0;
  background:transparent;border:1px solid var(--edge);border-radius:3px;cursor:pointer}
.burger span,.burger span::before,.burger span::after{display:block;width:16px;height:2px;
  background:var(--dim);position:relative;content:""}
.burger span::before{position:absolute;top:-5px}
.burger span::after{position:absolute;top:5px}
.burger:hover span,.burger:hover span::before,.burger:hover span::after,
body.navopen .burger span,body.navopen .burger span::before,
body.navopen .burger span::after{background:var(--accent)}

/* Narrow, the article gets the width and the list of articles moves behind a
   button, rather than stacking above the article and pushing it off screen. */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .burger{display:grid}
  nav.side{position:fixed;top:52px;left:0;bottom:0;z-index:9;width:min(280px,85vw);
    min-height:0;overflow-y:auto;background:var(--rail);border-right:1px solid var(--edge);
    box-shadow:12px 0 30px rgba(0,0,0,.45);transform:translateX(-100%);
    visibility:hidden;transition:transform .18s ease-in,visibility 0s .18s}
  body.navopen nav.side{transform:none;visibility:visible;transition:transform .18s ease-out}
  main{padding:20px 16px 70px}
  .topbar input{width:auto;flex:1;min-width:90px}
  .topbar{gap:10px;padding:0 12px}
  #devflag{display:none}
}
@media (prefers-reduced-motion:reduce){nav.side{transition:none}}
</style></head><body>

<div class="topbar">
  <button class="burger" id="burger" type="button" aria-label="Articles"
          aria-controls="nav" aria-expanded="false"><span></span></button>
  <a class="logo" href="#Galaxy_Genome_Wiki">GALAXY GENOME <span>WIKI</span></a>
  <span id="devflag" hidden style="font:11px var(--mono);color:var(--accent2);
  border:1px solid var(--accent2);border-radius:3px;padding:2px 7px">local map</span>
<input id="q" type="search" placeholder="Search articles" autocomplete="off">
</div>

<div class="shell">
  <nav class="side" id="nav"></nav>
  <main>
    <div class="hero">
      <h1 id="title">—</h1>
      <div class="tools">
        <button id="btnRead" class="on">Read</button>
        <button id="btnSrc">Edit source</button>
        <button id="btnCopy">Copy wikitext</button>
      </div>
    </div>
    <article id="body"></article>
    <textarea class="src" id="src" spellcheck="false"></textarea>
    <footer class="wf" id="foot"></footer>
  </main>
</div>

<script>
const ARTICLES = {"Galaxy Genome Wiki": "\n[[File:Galaxy Genome.png|thumb]]\n'''Galaxy Genome''' is a space simulator for iOS and Android by SKV Games.\nYou start in an [[Ships|Ion]] with two pulse lasers and two tons of cargo space,\nand the galaxy holds 14,906 catalogued\nsystems \u2014 5,340 of them\ninside the height the map can reach \u2014 before the generator fills in everything\nbetween them.\n\nThis wiki documents what the game does not tell you: what a scan is worth, what\nan ore sells for, and what each [[Crafting|module upgrade]] costs in\nmaterials.\n\nEverything is bought with '''credits''' (CR), and there are four ways to earn\nthem: [[Missions|station job boards]], [[Trading|trading]], [[Mining|mining]],\nand [[Exploration|exploration]], which pays best of all once your ship can reach\nthe systems nobody has catalogued.\n\n== Start here ==\n* [[Getting started]] \u2014 your first few hours and your first million credits\n* [[Exploration]] \u2014 what each discovery pays, and where you may not scan\n* [[Ships]] \u2014 all 45 of them, with prices\n\n== Reference ==\n* [[Mining]] \u00b7 [[Trading]] \u00b7 [[Crafting#Landing|Landing]]\n* [[Factions]] \u00b7 [[Reputation and ranks]] \u00b7 [[Stations]] \u00b7 [[Your space station]]\n* [[Crafting|Module upgrades]] \u00b7 [[Crafting#Craft materials|Craft materials]]\n* [[Exploration|Planet types]] \u00b7 [[The galaxy#Star types|Star types]] \u00b7 [[The galaxy#Nebulae|Nebulae]] \u00b7 [[The galaxy]]\n\n== Spoilers ==\nDiscoveries the game intends you to make yourself are kept behind one page:\n[[Spoilers]].\n\n== Maps ==\nAn interactive map of every system, with filters and route planning, is at\n[https://galaxy-genome.github.io/map/ Galaxy Genome Map].\n\n== About the game ==\n'''Galaxy Genome''' is developed and published by '''SKV Games''', and is\navailable on Google Play and the App Store. This wiki is written by players and\nis not connected to the developer.\n", "Your space station": "\nThere is an '''abandoned station''' waiting in one of five systems, and once you\nhave repaired it, it is yours: a second base that stores cargo, sells it while\nyou are elsewhere, moves itself across the galaxy, and gets raided by pirates.\nThe game never tells you it exists.\n\n== Finding it ==\nWhich system holds it is decided when your save is created, and the five are not\nequally likely:\n\n{| class=\"fandom-table sortable\"\n! System !! Chance !! Location\n|-\n| [https://galaxy-genome.github.io/map/?system=LHS%203182 LHS 3182] || 30% || 36, 77 \u00b7 85 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=212%20Puppis 212 Puppis] || 20% || 55, -19 \u00b7 58 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=HR%20244 HR 244] || 20% || -51, -34 \u00b7 61 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=GD%20219 GD 219] || 20% || -49, 42 \u00b7 65 ly\n|-\n| [https://galaxy-genome.github.io/map/?system=Wolf%201462 Wolf 1462] || 10% || -32, 83 \u00b7 89 ly\n|}\n\nNothing marks it until you fly there: the station is created the moment you first\nenter the system holding it, and your assistant says ''\u201cLooks like you found an abandoned station. Let's check its condition.\u201d''\nUntil then there is no hint at all, so finding it means visiting the five. All of\nthem are inside 90 ly of Sol, which is early-ship range.\n\nOnce you have seen it, the galaxy map's '''Filters''' screen grows a\n'''Find own station''' button, next to Reset filters and Show journey. It\ndoes not fly you anywhere: it scrolls the map to where the station is, which\nmatters later, because the station moves.\n\n== Repairing it ==\nThe wreck needs ore in your hold, not credits:\n\n{| class=\"fandom-table sortable\"\n! Material !! Tons\n|-\n| Bouxite || 200\n|-\n| Coltan || 180\n|-\n| Lepidolite || 50\n|-\n| Bromellite || 20\n|-\n| Uraninite || 10\n|}\n\nHanding them over is partial: whatever you are carrying is taken and the rest\nstays owing, so you can fill it over several trips. All five are mined from\nbelts and planets \u2014 see [[Mining]].\n\n== Subsystems ==\nEvery upgrade costs '''(level + 1) \u00d7 200,000 CR'''. The three single-level\nsubsystems cost a flat '''1,000,000 CR''' instead.\n\n{| class=\"fandom-table sortable\"\n! Subsystem !! Levels !! What it gives\n|-\n| Storage || 6 || 200 tons at level 0, doubling to 12,800\n|-\n| Trade Port || 6 || routes out to 20 ly and +7% on the price\n|-\n| Warp drive || 6 || moves the station 11 ly at level 0, 35 ly at level 6\n|-\n| Guards Control Center || 3 || one guard ship per level\n|-\n| Modules Store || 6 || sells modules, one class better per level\n|-\n| Bar || 1 || a mission board at your own station\n|-\n| Repair dock || 1 || repairs without flying to a station\n|-\n| Spaceships shop || 1 || buys and sells hulls\n|}\n\nTwo of them are gated behind quests that '''ship in mod files''': the Trade Port\nneeds quest 100040 and the Bar needs 100041. Without those mods installed,\nneither button does anything. See [[Side quests]].\n\nThe Trade Port also costs '''trade points''', earned a point a ton for\neverything the station sells: 400 for level 2, 1,600 for level 3, 4,800 for level 4, 12,800 for level 5, 32,000 for level 6.\n\n=== What each level buys ===\n{| class=\"fandom-table sortable\"\n! Level !! Storage (tons) !! Warp range (ly) !! Route range (ly) !! Price bonus\n|-\n| 0 || 200 || 11 || \u2014 || +0%\n|-\n| 1 || 400 || 15 || 10 || +0%\n|-\n| 2 || 800 || 19 || 12 || +2%\n|-\n| 3 || 1,600 || 23 || 14 || +4%\n|-\n| 4 || 3,200 || 27 || 16 || +5%\n|-\n| 5 || 6,400 || 31 || 18 || +6%\n|-\n| 6 || 12,800 || 35 || 20 || +7%\n|}\n\n== Trading while you are away ==\nMark cargo in the store '''for sale''' and the station finds its own buyers:\nevery station inside the Trade Port's range that wants that good. What they pay\ndepends on how badly they want it \u2014 '''\u00d71.2''' at neutral demand, '''\u00d71.4''' at\nhigh demand \u2014 plus the Trade Port's percentage. Only the best buyer for each good\nis kept.\n\nA sale happens '''every 30 seconds of play, and only while you are not in the\nstation's system'''. Each one moves one good to one buyer, and the size of the\nbatch is a roll:\n\n{| class=\"fandom-table sortable\"\n! Chance !! Tons sold\n|-\n| 30% || 8\u201320\n|-\n| 30% || 30\u201380\n|-\n| 20% || 100\u2013160\n|-\n| 20% || 170\u2013250\n|}\n\nThe money is '''tons \u00d7 base price \u00d7 1,000 \u00d7 demand''', the same arithmetic as\nselling it yourself, so the station earns most when it is holding something\nexpensive. See [[Trading]] for what each good is worth.\n\n== Pirates ==\nOnce the store holds more than '''50 tons''', pirates start arriving: the game\nchecks every '''10 minutes''' of play.\n\n'''If you are there''', they hail you and name a price. Pay and they leave.\nRefuse and you fight up to '''five''' ships, matched to your own hull and at the\ngame's highest danger level. Your guards fight alongside you.\n\n'''If you are away''', it is settled without you. Every guard's weapons are added\nup \u2014 damage times rate of fire \u2014 against a raid worth 50 to 150, the damage is\nshared out, and a guard that survives gains experience that makes it tougher next\ntime. '''If every guard is destroyed the pirates empty the store''' and leave the\nstation 10\u201313% damaged, which is ore out of your hold again.\n\nGuards are ships from your own fleet, parked at the station, so the real cost of\nprotecting it is a hull you are not flying \u2014 and repairing a damaged guard is\ncharged to you.\n\n== Moving it ==\nThe Warp drive subsystem moves the whole station to any system inside its range,\npaid for in materials. One rule: '''it cannot jump to a system that already has a\nstation'''. That is what makes where you park it a decision \u2014 in reach of several\nstations it sells faster, but the pirates know where it is either way.\n\nIts appearance can be changed for '''10,000,000 CR''', which is cosmetic only and\ntakes effect the next time you arrive.\n", "Getting started": "\nYou start in an '''Ion''' with two basic pulse lasers, a basic shield and a cargo\nrack that holds two tons. After the tutorial you are offered a job in the '''Ross\n720''' system, and your starter ship cannot get there. That gap is the game's\nopening problem.\n\n== Your first credits ==\nTake item transport missions from any station within warp reach. One to two tons\nof cargo pays '''50,000\u201360,000 CR''', and finishing jobs also earns influence\nwith the [[Factions|faction]] that owns the station, which unlocks better-paid\nwork later.\n\nSpend the first profits on cargo racks so you can carry more per run, and learn\nyour way around the [https://galaxy-genome.github.io/map/?system=Sol Core Systems] while you are\nlimited to them.\n\n== Your second ship ==\nThe '''Phoenix''' is the usual first upgrade: a well-rounded multipurpose hull\nwith a warp drive that widens your range considerably. Its hull is about three\ntimes the strength of the Chaser, so it survives the transport and courier work\nthat pays for it. The '''Chaser''' suits easy to moderate combat instead.\n\n== Then explore ==\nExploration is the fastest money in the game by a wide margin. See [[Exploration]].\n\nTwo cautions before you go far:\n* You are not paid for discoveries until you reach a station and sell them from its '''Discoveries''' menu.\n* Deep space has no repairs and no fuel but what you scoop. See [[Modules#Fuel tanks and scooping|fuel]].\n\n{{stub|The combat, module and planetary-vehicle sections are still missing.}}\n", "Exploration": "\nFinding new worlds pays, and you are paid '''every time''' you find one, not only\nthe first time anyone did. You need a '''Planet Scanner''' fitted. You collect by\nselling at a station's '''Discoveries''' menu, which also earns reputation with\nthat station and with the [[Factions|faction]] that owns it.\n\n== How a discovery actually happens ==\nMostly it happens '''by flying near the thing'''. Any planet that comes within\nyour scanner's range is discovered automatically, a green '''+ CR''' message\nappears, and the value is banked until you next dock.\n\nTwo things follow from that:\n* '''Stars are free.''' They are discovered as soon as you arrive in the system, at any distance, and some of them are worth a fortune. See below.\n* '''Asteroid belts do not count.''' They are excluded from the tally entirely.\n\nEach system shows a '''mapped / total''' count, so you can see what is left\nbefore moving on. Your ship's '''Specs \u2192 Stars and Planets''' list shows every\nobject type, what it pays, how rare it is, and whether you have found one yet.\n\n== The Planet Scanner ==\nRange is the whole point of the module: a longer scanner discovers planets from\nfurther out, so you fly less to clear the same system.\n\n{| class=\"fandom-table sortable\"\n! Scanner !! Grade !! Range !! Power !! Mass !! Cost (CR)\n|-\n| 1D || D || 230 || 0.2 || 0 || 1,000\n|-\n| 1C || C || 270 || 0.3 || 0 || 12,000\n|-\n| 1B || B || 320 || 0.4 || 0 || 50,000\n|-\n| 1A || A || 390 || 0.35 || 0 || 350,000\n|}\n\nEvery grade is '''massless''', so a scanner never costs you jump range. Note that\n'''A draws less power than B''' as well as reaching 70 further, so B is worth\nskipping if you can afford to wait.\n\n=== What each grade is actually worth ===\nRange is measured in '''light seconds''', the same unit a planet's orbit is in,\nand the innermost orbit a system can hold is 65. So a scanner's range is exactly\nthe question ''how much of this system do I get for free''.\n\nAcross the '''4,085''' catalogued systems that pay anything at all, this is\nwhat each grade banks on arrival, before you fly anywhere:\n\n{| class=\"fandom-table sortable\"\n! Scanner !! Cost (CR) !! Mean banked on arrival (CR) !! Gained over the grade below (CR) !! Systems to pay it back\n|-\n| none || \u2014 || 40,489 || \u2014 || \u2014\n|-\n| 1D || 1,000 || 92,162 || 51,673 || under 1\n|-\n| 1C || 12,000 || 99,576 || 7,414 || 2\n|-\n| 1B || 50,000 || 106,144 || 6,567 || 6\n|-\n| 1A || 350,000 || 115,088 || 8,944 || 34\n|}\n\n'''The 1D is the best purchase in the game.''' One thousand credits takes the\naverage system from 40,489 CR to 92,162 CR banked for\nturning up, and it pays for itself in the first system you visit. Nothing else in\nthe outfitter does that.\n\nAfter that the returns fall off a cliff. Each grade above it adds roughly\n7,414 to 8,944 CR a system, for eleven thousand,\nthirty-eight thousand and three hundred thousand credits in turn. The 1A takes\n34 systems to break even. They all pay back eventually if you\nexplore seriously; none of them is urgent.\n\n=== Most systems need no flying at all ===\nCounting only bodies worth 100,000 CR or more, because nobody crosses a system\nfor less:\n\n{| class=\"fandom-table sortable\"\n! Scanner !! Systems needing no trip !! Mean banked on arrival (CR) !! Mean after the trips worth making (CR)\n|-\n| none || 78% || 40,489 || 149,685\n|-\n| 1D || 81% || 92,162 || 180,635\n|-\n| 1C || 82% || 99,576 || 184,970\n|-\n| 1B || 82% || 106,144 || 189,301\n|-\n| 1A || 83% || 115,088 || 195,007\n|}\n\n'''Four systems in five are already finished when you arrive.''' The fifth is\nwhere the money is: crossing to one or two bodies roughly doubles what the system\npays. That is the shape of exploration income \u2014 long stretches of jump, bank,\njump, punctuated by a system worth stopping in.\n\n== You cannot scan near Sol ==\nWithin '''300 ly of Sol''' every body is treated as already explored:\nthe scan is refused and nothing is paid. The system tooltip says so outright,\n''Explored: yes''. This is why scanning is not something you can do on your\ndoorstep, and why a scanner is a purchase for when you can already travel. A\ncouple of objects are exceptions; see [[Spoilers]].\n\n'''There is a second one.''' The same rule applies within '''150 ly of\nThe Void''', which is easy to be caught out by: it sits over 4,500 ly from Sol, so\nyou arrive after a long trip expecting untouched sky and find everything already\nsurveyed. The rule is per system and covers '''stars as well as planets''', so\nthere is nothing left to sell.\n\n== Exploration rank ==\nSelling discoveries raises your '''exploration rank''', measured by the credits\nyou have earned from them in total. Each rank adds a flat percentage to\neverything you sell afterwards.\n\n{| class=\"fandom-table sortable\"\n! Rank !! Earned from discoveries !! Bonus\n|-\n| Aimless || 0 || +0%\n|-\n| Mostly Aimless || 10,000 || +1%\n|-\n| Scout || 185,000 || +2%\n|-\n| Surveyor || 300,000 || +4%\n|-\n| Trailblazer || 1,250,000 || +8%\n|-\n| Pathfinder || 3,500,000 || +9%\n|-\n| Ranger || 15,000,000 || +12%\n|-\n| Pioneer || 40,000,000 || +15%\n|-\n| Prime || 79,990,000 || +18%\n|}\n\nIt is a bonus, not a multiplier. At '''+18%''' the top rank will not transform\nyour income the way station reputation transforms [[Missions|mission]] pay, so\ntreat it as something that accrues while you explore rather than a target. See\n[[Reputation and ranks]].\n\n== Stars pay too, and one pays enormously ==\n'''This is where the real money is.''' Fourteen star types carry a discovery\nvalue of their own, and because stars are found the moment you arrive, the whole\npayment is made for turning up.\n\n{| class=\"fandom-table sortable\"\n! Star !! Scan value (CR) !! Rarity\n|-\n| [https://galaxy-genome.github.io/map/?startype=Preonstar Preon star] || 13,000,000 || Hypothetical\n|-\n| [https://galaxy-genome.github.io/map/?startype=Quarkstar Quark star] || 1,800,000 || Hypothetical\n|-\n| [https://galaxy-genome.github.io/map/?startype=WolfRayetStar Wolf Rayet Star] || 1,500,600 || Hypothetical\n|-\n| [https://galaxy-genome.github.io/map/?startype=SoftGammaRepeaterMagnetar Soft Gamma Repeater Magnetar] || 920,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=WN-WolfRayetStar WN - Wolf Rayet Star] || 450,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=O-BlueWhite O - Blue White] || 450,000 || Rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=WNC-WolfRayetStar WNC - Wolf Rayet Star] || 430,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=WC-WolfRayetStar WC - Wolf Rayet Star] || 400,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=O-Hypergiant O - Hypergiant] || 290,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=DOV-WhiteDwarf DOV - White Dwarf] || 280,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=DX-WhiteDwarf DX - White Dwarf] || 250,000 || Very rare\n|-\n| [https://galaxy-genome.github.io/map/?startype=WO-WolfRayetStar WO - Wolf Rayet Star] || 250,000 || Rare\n|}\n\nA single '''Quark star''' is worth more than any planet in the game, and\nfinding one unlocks an achievement. Every star type not listed here pays nothing,\nso an ordinary system is worth only what its planets are worth.\n\nHunting these is a different activity from clearing systems planet by planet: you\nare looking for one object, at range, and the map can filter for the types that\noccur in reachable space.\n\n== What each object pays ==\nFive types are shown as a range because they carry a second, higher value when\nthe planet sits in the habitable band.\n\n{| class=\"fandom-table sortable\"\n! Planet type !! Scan value (CR) !! Rarity !! Landable\n|-\n| [https://galaxy-genome.github.io/map/?ptype=WaterGiant Water Giant] || 1,150,000 || Rare || \n|-\n| [https://galaxy-genome.github.io/map/?ptype=EarthLikePlanet Earth Like Planet] || 1,100,000 || Rare || \n|-\n| [https://galaxy-genome.github.io/map/?ptype=AmmoniaPlanet Ammonia Planet] || 620,000 || Rare || \n|-\n| [https://galaxy-genome.github.io/map/?ptype=WaterWorld Water World] || 450,000 || Common || \n|-\n| [https://galaxy-genome.github.io/map/?ptype=HeliumRichGasGiant Helium Rich Gas Giant] || 320,000 || Rare || \n|-\n| [https://galaxy-genome.github.io/map/?ptype=GasGi  for. Arrival\nis what a ship with a 1D scanner collects for turning up, with no flying at all;\na hop is one body worth crossing the system for, which in practice is a minute of\nautopilot and two minutes of menus. A system with a large total and no hops is a\nbetter trip than one with a larger total and three.\n\n== Reading the table ==\n* '''Water Giants''' and '''Earth Like Planets''' pay the most, and both are rare.\n* '''Ice Planets''' are common and pay 1,500 CR.\n* The game's own '''Stars and planets''' table shows some types as a range, such as 1,700-90,000 CR for a '''Rock Planet'''. The upper figure is for a planet in the habitable zone, and no type that displays a range can ever qualify for it: the test is against the type's whole temperature band, and every one of those bands falls partly outside it. What you are paid is the lower figure, every time.\n* Scan value is per object, so a system is worth the sum of its planets. A system of four gas giants can beat one with more bodies in it.\n\nFinding an '''Earth Like Planet''' or an '''Ammonia Planet''' for the first time\neach unlocks an achievement, as do two of the rarest [[The galaxy#Star types|stars]].\n\nThe [https://galaxy-genome.github.io/map/ Galaxy Genome Map] filters on either figure \u2014 total value, or what\nyour own scanner banks on arrival \u2014 and systems the game already counts as\n''explored'' score zero, so they never appear on either list.\n", "Ships": "\nThere are '''38''' ships you can own, and '''14''' of those\ncannot simply be bought. Those are '''faction ships''': sold only at that\nfaction's [[Stations|stations]], and only once you have enough\n[[Reputation and ranks|reputation]] with it. Each faction name links to where its\nstations are.\n\n{| class=\"fandom-table sortable\"\n! Ship !! Role !! Ability !! Faction !! Reputation !! Price (CR) !! Hull !! Shields !! Speed !! Manoeuvre\n|-\n| Angler || Combat ||  ||  ||  || 16,200 || 220 || 0 || 370.0 || 8.0\n|-\n| Ion || Multipu Aircraft carrier || [https://galaxy-genome.github.io/map/?faction=Trade%20Federation&filters=station Trade Federation] || Admiral || 292,190,560 || 5200 || 4250 || 135.0 || \n|-\n| Hyperion || Multipurpose || Multi-target cannons fire || [https://galaxy-genome.github.io/map/?faction=United%20Empire&filters=station United Empire] || Admiral || 392,170,990 || 6800 || 3700 || 130.0 || \n|-\n| Reaper || Combat || Big cannon || [https://galaxy-genome.github.io/map/?faction=Interstellar%20Alliance&filters=station Interstellar Alliance] || Admiral || 393,800,500 || 5400 || 3850 || 145.0 || 1.0\n|}\n\nYou start the game in an '''Ion''' at 32,000 CR, which is not the\ncheapest hull on the list: the '''Angler''' undercuts it\nat 16,200 CR.\n\n\n== What a hull will take ==\nA shop can only sell you what your ship will accept. Every hull carries a\n'''maximum class''' per main slot, and nothing above it will fit however much\nyou can afford.\n\n{| class=\"fandom-table sortable\"\n! Ship !! Warp Drive !! Thrusters !! Power Plant !! Power Distributor !! Fuel Tank\n|-\n| Angler || 2 || 2 || 2 || 2 || 1\n|-\n| Ion || 2 || 2 || 2 || 1 || 1\n|-\n| Atom || 3 || 3 || 3 || 2 || 3\n|-\n| Vortex || 3 || 3 || 3 || 3 || 2\n|-\n| Chaser || 3 || 3 || 3 || 2 || 2\n|-\n| Pangolin || 4 || 4 || 4 || 3 || 4\n|-\n| Phoenix || 4 || 4 || 4 || 3 || 4\n|-\n| Pangolin MK2 || 4 || 4 || 4 || 3 || 4\n|-\n| Hawk || 5 || 4 || 4 || 4 || 5\n|-\n| Vanger || 4 || 4 || 4 || 3 || 4\n|-\n| Wasp || 4 || 5 || 4 || 5 || 3\n|-\n| Falcon || 5 || 5 || 5 || 4 || 5\n|-\n| Porter || 5 || 5 || 4 || 3 || 5\n|-\n| Viking || 5 || 6 || 6 || 6 || 4\n|-\n| Valkyrie || 5 || 6 || 6 || 6 || 4\n|-\n| Valkyrie M || 5 || 6 || 6 || 6 || 4\n|-\n| Overseer || 5 || 6 || 6 || 6 || 4\n|-\n| Delver || 5 || 5 || 5 || 4 || 5\n|-\n| Gladiator || 5 || 6 || 6 || 6 || 4\n|-\n| Therion || 5 || 6 || 6 || 7 || 4\n|-\n| Scorpion || 4 || 5 || 6 || 6 || 3\n|-\n| Keeper || 5 || 5 || 5 || 4 || 5\n|-\n| Specter || 5 || 6 || 7 || 7 || 5\n|-\n| Barracuda || 5 || 6 || 7 || 7 || 5\n|-\n| Behemoth || 5 || 6 || 7 || 7 || 5\n|-\n| Zeus || 4 || 5 || 6 || 6 || 3\n|-\n| Pilgrim || 5 || 6 || 5 || 5 || 5\n|-\n| Prometheus || 5 || 5 || 6 || 6 || 5\n|-\n| Leviathan || 6 || 7 || 6 || 6 || 6\n|-\n| Cardinal || 6 || 7 || 8 || 8 || 5\n|-\n| Kraken || 6 || 7 || 8 || 6 || 6\n|-\n| Mantis || 6 || 7 || 8 || 8 || 5\n|-\n| Goliath || 7 || 8 || 8 || 7 || 6\n|-\n| Grinder || 8 || 8 || 8 || 8 || 6\n|-\n| Nemesis || 8 || 8 || 8 || 8 || 6\n|-\n| Discordia || 8 || 8 || 9 || 8 || 6\n|-\n| Hyperion || 8 || 8 || 9 || 8 || 6\n|-\n| Reaper || 8 || 8 || 9 || 8 || 7\n|}\n\nTwo slots are not on that table because they cannot be changed at all:\n'''life support''' and '''sensors''' are pinned to the class the hull ships\nwith, and the hull slot is always class 1.\n\nThis is the answer to \"why can I not buy the big drive\": it is the hull, not the\n[[Stations|station]]. Check the ceiling before paying for a module, and check it\nbefore buying a hull you mean to grow into.\n\n== Unique abilities ==\nSeven ships do something no module can give you, and the shop lists it as\n'''Unique abilities'''. '''A ship only ever shows one.''' The shop picks it by a\nfixed precedence \u2014 supercharge, then multi-target, then Titan, then Discordia,\nthen Miner \u2014 so a ship qualifying for two displays only the first.\n\n{| class=\"fandom-table sortable\"\n! Ability !! Ships !! What it does !! Covered on\n|-\n| Warp Supercharge || Prometheus (x3), Nemesis (x5) || Multiplies jump range and cuts fuel burn || [[Navigation#Warp supercharge, and the button you have to press|Navigation]]\n|-\n| Multi-target cannons fire || Hyperion || Guns spread fire across nearby enemies instead of your locked target || [[Combat#Unique abilities in a fight|Combat]]\n|-\n| Big cannon || Reaper || The only hull with a class-5 hardpoint, for the [https://galaxy-genome.github.io/map/?module=TitanLanceWeapon Energy Lance] || [[Combat#Unique abilities in a fight|Combat]]\n|-\n| Aircraft carrier || Discordia || Carries the largest fighter hangar as standard || [[Combat#Unique abilities in a fight|Combat]]\n|-\n| Miner || Grinder, Delver || Highlights asteroids holding deep materials || [[Mining#The Miner ability|Mining]]\n|}\n\n== NPC ships ==\nThese exist in the galaxy but are never offered for sale. You will meet them as\npatrols, pirates and targets.\n\n{| class=\"fandom-table sortable\"\n! Ship !! Role !! Ability !! Hull !! Shields !! Speed !! Manoeuvre\n|-\n| Rogue || Combat ||  || 110 || 60 || 370.0 || 8.0\n|-\n| Thorn || Combat ||  || 150 || 65 || 320.0 || 5.0\n|-\n| Vortex || Combat ||  || 126 || 137 || 315.0 || 4.0\n|-\n| Zentarks Scout || Combat ||  || 420 || 450 || 402.0 || 9.0\n|-\n| Angler-Mother || Combat ||  || 3266 || 0 || 290.0 || 3.0\n|-\n| Automaton || Multipurpose ||  || 1400 || 1500 || 350.0 || 8.0\n|-\n| Zentarks Hunter || Combat ||  || 6400 || 8850 || 370.0 || 9.0\n|}\n\n'''Vortex''' appears in both lists: the version law patrols fly is a separate\nship type with identical statistics.\n", "Factions": "\nFive factions hold the settled galaxy between them. Which one likes you decides\nwhich [[Ships|ships]] you may buy and which [[Side quests|side quests]] you are\noffered.\n\n== Reputation is the sum of your stations ==\nThere is no separate faction score to grind. '''Your standing with a faction is\nthe total of your reputations at its individual stations.''' Do well at one\nUnited Empire station and the United Empire as a whole thinks better of you; the\nfaction number is just addition.\n\nTwo things follow from that.\n\n'''A faction with more stations is easier to climb.''' Every station is more\nheadroom, and the factions are not evenly sized.\n\n{| class=\"fandom-table sortable\"\n! Faction !! Stations !! Ships !! Standing needed for its best ship\n|-\n| Independent || 47 || 3 || Admiral\n|-\n| Interstellar Alliance || 26 || 4 || Admiral\n|-\n| Pirates || 3 || 1 || Recruit\n|-\n| Trade Federation || 40 || 4 || Admiral\n|-\n| United Empire || 40 || 2 || Admiral\n|}\n\n'''The Pirates are a special case.''' Three stations is very little to work with,\nso their one ship is gated at '''Recruit''' rather than anything higher.\n\nReaching '''Admiral''' with any of the four non-pirate factions unlocks an\nachievement of its own.\n\n== The ladder ==\n{| class=\"fandom-table\"\n! Standing !! What it unlocks\n|-\n| None || nothing\n|-\n| Recruit || the Pirates' Valkyrie M\n|-\n| Officer || most faction ships\n|-\n| Commander || the Scorpion and the Prometheus\n|-\n| Admiral || the heavy hulls, and an achievement\n|}\n\n== Independent ==\n'''47''' stations. [https://galaxy-genome.github.io/map/?faction=Independent&filters=station Show them on the map].\n\n{| class=\"fandom-table sortable\"\n! Ship !! Standing needed !! Price (CR) !! Role\n|-\n| Specter || Officer || 38,500,320 || Explorer\n|-\n| Prometheus || Commander || 51,630,970 || Explorer\n|-\n| Nemesis || Admiral || 289,223,500 || Explorer\n|}\n\n== Interstellar Alliance ==\n'''26''' stations. [https://galaxy-genome.github.io/map/?faction=Interstellar%20Alliance&filters=station Show them on the map].\n\n{| class=\"fandom-table sortable\"\n! Ship !! Standing needed !! Price (CR) !! Role\n|-\n| Viking || Officer || 18,430,700 || Combat\n|-\n| Therion || Officer || 30,490,500 || Combat\n|-\n| Scorpion || Commander || 34,260,920 || Combat\n|-\n| Reaper || Admiral || 393,800,500 || Combat\n|}\n\n== Pirates ==\n'''3''' stations. [https://galaxy-genome.github.io/map/?faction=Pirates&filters=station Show them on the map].\n\n{| class=\"fandom-table sortable\"\n! Ship !! Standing needed !! Price (CR) !! Role\n|-\n| Valkyrie M || Recruit || 22,500,800 || Combat\n|}\n\n== Trade Federation ==\n'''40''' stations. [https://galaxy-genome.github.io/map/?faction=Trade%20Federation&filters=station Show them on the map].\n\n{| class=\"fandom-table sortable\"\n! Ship !! Standing needed !! Price (CR) !! Role\n|-\n| Porter || Officer || 17,890,500 || Freighter\n|-\n| Valkyrie || Officer || 19,600,930 || Combat\n|-\n| Gladiator || Officer || 30,190,240 || Combat\n|-\n| Discordia || Admiral || 292,190,560 || Combat\n|}\n\n== United Empire ==\n'''40''' stations. [https://galaxy-genome.github.io/map/?faction=United%20Empire&filters=station Show them on the map].\n\n{| class=\"fandom-table sortable\"\n! Ship !! Standing needed !! Price (CR) !! Role\n|-\n| Overseer || Officer || 23,400,890 || Multipurpose\n|-\n| Hyperion || Admiral || 392,170,990 || Multipurpose\n|}\n", "Reputation and ranks": "\nThree separate things track your progress, and they do not feed each other. It is\nworth knowing which one a given activity pays into, because the size of the\nreward differs enormously between them.\n\n== Station and faction reputation ==\nEarned by completing [[Missions|missions]] and by selling\n[[Exploration|discoveries]] at a station.\n\n* '''Station reputation''' decides what that station's mission board pays you.\n* '''Faction reputation''' decides which [[Ships|ships]] you are allowed to buy.\n\nThis is the big one. A mission's reward is its base value raised to the power of\nyour standing, so the same job pays '''17 times more''' at Allied than at Neutral:\n\n{| class=\"fandom-table sortable\"\n! Standing !! A Mining contract pays\n|-\n| Neutral || 180,000\n|-\n| Confiding || 468,000\n|-\n| Friendly || 1,216,800\n|-\n| Allied || 3,163,680\n|}\n\nWorking one station until it trusts you beats taking the best-looking job at a\nstation that does not.\n\n== Exploration rank ==\nEarned by '''selling discoveries''', and measured by the credits you have made\nfrom them in total. It adds a flat percentage to what discoveries sell for.\n\n== Combat rank ==\nEarned by fighting, and measured the same way. It adds the same percentage to\nbounty payouts, '''and it is what lets you own a fleet''': wingman ships that fly\nwith you, capped in both number and price by your rank.\n\n{| class=\"fandom-table sortable\"\n! Exploration !! Combat !! Progress needed !! Exploration bonus !! Combat bonus !! Fleet ships !! Max ship cost (CR)\n|-\n| Aimless || Harmless || 0 || +0% || +0% ||  || \n|-\n| Mostly Aimless || Mostly Harmless || 10,000 || +1% || +1% ||  || \n|-\n| Scout || Novice || 185,000 || +2% || +2% ||  || \n|-\n| Surveyor || Competent || 300,000 || +4% || +4% ||  || \n|-\n| Trailblazer || Expert || 1,250,000 || +8% || +6% || 1 || 1,000,000\n|-\n| Pathfinder || Master || 3,500,000 || +9% || +9% || 1 || 7,000,000\n|-\n| Ranger || Dangerous || 15,000,000 || +12% || +12% || 2 || 30,000,000\n|-\n| Pioneer || Deadly || 40,000,000 || +15% || +15% || 3 || 49,000,000\n|-\n| Prime || Elite || 79,990,000 || +18% || +18% || 4 || 200,000,000\n|}\n\nBoth top out at '''+18%''', and the two ladders differ at exactly one rung:\nTrailblazer gives '''+8%''' where Expert gives '''+6%'''. Next to reputation's\nmultiplier these are small, so neither rank is a reason to grind on its own. The\nfleet is.\n\n== Trading rank ==\nThere is a '''third''' ladder, easy to miss because nothing points at it. It runs\non what you have earned by [[Trading|trade]], and it has its own nine names:\n\n''Penniless \u00b7 Mostly Penniless \u00b7 Penniless Peddler \u00b7 Dealer \u00b7 Merchant \u00b7 Broker \u00b7 Entrepreneur \u00b7 Tycoon \u00b7 Prime''\n\nIt shares the top rung, '''Prime''', with the other two. Earning all three at once\nis what the '''Absolute Prime''' [[Achievements|achievement]] asks for.\n\nTrading rank also sets the size of some [[Events and Tasks|Daily Tasks]]: Mining\nRush and Illegal Trader both scale their target count off it, so a high trading\nrank makes those dailies longer as well as more valuable.\n\n== Karma ==\nKarma is not a rank you earn, it is a record of how you behave, and the game\ngives it names too:\n\n''Despised \u00b7 Disliked \u00b7 Average \u00b7 Liked \u00b7 Revered''\n\nIt moves both ways. Clearing pirate activity from a system is worth\n'''+2'''; destroying law enforcement costs you. It matters because\n[[Side quests|side quests]] check it in '''both directions''' \u2014 some will not\ntalk to you until your record is clean, and others will not talk to you unless it\nis dirty. A spotless record closes doors as surely as a bad one.\n", "Stations": "\nThere are '''156''' stations. A station is where you sell\n[[Exploration|discoveries]], take [[Missions|missions]], buy [[Modules|modules]] and\n[[Ships|ships]], and repair. Generated systems never have one, so stations are\nthe fixed points the rest of the galaxy hangs off.\n\nOne station is not on any of these lists: there is an abandoned one waiting to be\nrepaired, and it becomes yours. See [[Your space station]].\n\nWhat a station sells depends on its '''type''', so a run for a specific module\nmeans finding the right kind of station rather than the nearest one.\n\n'''The game never labels a station with its type.''' Click a system and you get a\nname, a faction and a distance, and nothing else until you dock. The station's\n'''name''' is the only handle you have, which is what the table below is for, and\nwhat the [[Galaxy Genome Map|map]] puts in its tooltip.\n\nWorse, '''the names do not describe the stock'''. A Trading station carries the\nindustrial list; an Industrial station carries the trade-post list. Read the\nPurpose column, not the Type column.\n\n== Types ==\n{| class=\"fandom-table sortable\"\n! Type !! Purpose !! Count\n|-\n| Asteroid station || [https://galaxy-genome.github.io/map/?purpose=Industrial Industrial] || 6\n|-\n| Farm station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || 24\n|-\n| Industrial station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || 29\n|-\n| Military station || [https://galaxy-genome.github.io/map/?purpose=Military Military] || 35\n|-\n| Trading station || [https://galaxy-genome.github.io/map/?purpose=Industrial Industrial] || 31\n|-\n| HiTech station || [https://galaxy-genome.github.io/map/?purpose=HiTech High tech] || 31\n|}\n\n== Every station ==\nOrdered by distance from Sol.\n\n{| class=\"fandom-table sortable\"\n! Station !! System !! Location !! Type !! Purpose !! Faction\n|-\n| Gamma Orbital || [https://galaxy-genome.github.io/map/?system=Sol Sol] || 0, 0 \u00b7 0 ly || Trading station || [https://galaxy-genome.github.io/map/?purpose=Industrial Industrial] || United Empire\n|-\n| Thunder Station || [https://galaxy-genome.github.io/map/?system=Sol Sol] || 0, 0 \u00b7 0 ly || Industrial station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || Trade Federation\n|-\n| DKS Station || [https://galaxy-genome.github.io/map/?system=Alpha%20Centauri Alpha Centauri] || 3, 3 \u00b7 4 ly || Farm station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || United Empire\n|-\n| Lem Hub || [https://galaxy-genome.github.io/map/?system=Alpha%20Centauri Alpha Centauri] || 3, 3 \u00b7 4 ly || Military station || [https://galaxy-genome.github.io/map/?purpose=Military Military] || United Empire\n|-\n| Quark Station || [https://galaxy-genome.github.io/map/?system=Alpha%20Centauri Alpha Centauri] || 3, 3 \u00b7 4 ly || Trading station || [https://galaxy-genome.github.io/map/?purpose=Industrial Industrial] || United Empire\n|-\n| Nexus Station || [https://galaxy-genome.github.io/map/?system=Barnard%27s%20Star Barnard's Star] || -3, 5 \u00b7 6 ly || Military station || [https://galaxy-genome.github.io/map/?purpose=Military Military] || Trade Federation\n|-\n| Vertex Terminal || [https://galaxy-genome.github.io/map/?system=Barnard%27s%20Star Barnard's Star] || -3, 5 \u00b7 6 ly || Farm station || [https://galaxy-genome.github.io/map/?purpose=TraderPost Trading post] || Trade Federation\n|-\n| Manson Orbital || [https://galaxy-genome.github.io/map/?system=Wolf%20359 Wolf 359] || 4, -2 \u00b7 4 ly || HiTech station || [https://galaxy-genome.github.io/map/?purpose=HiTech High tech] || Trade Federation\n|-\n| Cooper City || [https://galaxy-gen
